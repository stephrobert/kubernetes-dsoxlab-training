---
# Contrat déclaratif consommé par la CLI dsoxlab.
# https://github.com/stephrobert/dsoxlab
#
# Ce catalogue complète la formation Kubernetes du blog. Il ne redit pas les
# guides : il donne à l'apprenant de quoi PROUVER qu'il sait faire, ce que ni
# un quiz ni une lecture ne peuvent établir.
schema_version: 1

repo:
  id: kubernetes-dsoxlab-training
  category: kubernetes
  title: "Kubernetes Training: from the first Pod to the certifications"
  blog_url: "https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/"
  # Où `dsoxlab support --issue` dépose le rapport d'un apprenant.
  #
  # Sans ce champ, dsoxlab retombe sur `git remote get-url origin`, ce qui
  # marche ici mais suppose deux choses : un remote nommé `origin`, et un
  # hébergeur dont les issues vivent sous `<dépôt>/issues`. Le déclarer lève
  # la supposition.
  issues_url: "https://github.com/stephrobert/kubernetes-dsoxlab-training/issues"
  description: >-
    Verifiable labs for the blog's Kubernetes course. Every lab is paired
    with a lesson on the site and validates a skill named by an exam
    blueprint. The cluster is a real kubeadm cluster on virtual machines,
    not a container runtime: that is what makes the kubelet, etcd and the
    node's own configuration reachable.

# Topologie d'infrastructure.
#
# POURQUOI DES VM, ALORS QUE LA FORMATION ENSEIGNE SUR kind.
# La règle 11 de la section Kubernetes impose kind comme outil unique des
# GUIDES, parce que l'apprenant doit pouvoir suivre la formation sur son
# poste. Ce catalogue répond à une autre question, et sa règle 7 la pose :
# certains faits ne se prouvent PAS dans un conteneur, parce que kind et k3d
# partagent le noyau de l'hôte. Relevé en lab le 2026-09-14, le kubelet d'un
# nœud kind refuse un Pod AppArmor avec « Cannot enforce AppArmor: AppArmor
# is not enabled on the host ».
#
# Ce que les VM débloquent, et que la formation a dû classer « non couvert » :
#   - AppArmor et les profils de confinement du nœud
#   - la montée de version kubeadm, control plane et kubelets réels
#   - le durcissement de l'OS hôte, l'accès réseau externe, le point de
#     métadonnées du nœud (compétences Cluster Setup et System Hardening CKS)
#   - le diagnostic d'un kubelet, d'un pod statique ou d'un etcd cassé
#
# Les deux approches ne se concurrencent pas : la formation enseigne, ce
# catalogue éprouve.
infra:
  provider:
    - kvm
    - incus
  # « lab-kubernetes » est REFUSÉ : le pont dérivé, virbr-kubernetes, fait
  # 16 caractères alors que le noyau en accepte 15. libvirt échoue alors en
  # cours d'apply sur « Numerical result out of range », message qui ne nomme
  # pas la cause. Le nom du pont vaut virbr- plus le nom du réseau privé de
  # son préfixe lab- : il reste donc 9 caractères utiles.
  network: lab-k8s
  cidr: 10.10.50.0/24

  # ATTENTION : l'IP et la MAC de chaque hôte dérivent de sa POSITION dans
  # cette liste. Insérer un hôte au milieu réattribue les adresses de tous
  # les suivants, ce que le provider libvirt refuse en cours de route.
  # Tout nouvel hôte s'ajoute EN FIN DE LISTE.
  hosts:
    # Ubuntu 24.04 parce que c'est ce que recommande le guide kubeadm publié.
    # Aligner le lab sur le guide évite à l'apprenant de traduire une
    # procédure pendant qu'il apprend la procédure.
    - name: k8s-cp.lab
      distro: ubuntu24
      role: control-plane
      # kubeadm refuse d'initialiser en dessous de 2 vCPU et 1,7 Go. On prend
      # de la marge : le control plane porte etcd, l'API server et, pendant
      # les labs de diagnostic, des Pods qu'on casse volontairement.
      ram_mb: 4096
      vcpu: 2
      disk_gb: 25

    - name: k8s-w1.lab
      distro: ubuntu24
      role: worker
      ram_mb: 2560
      vcpu: 2
      disk_gb: 20

    # Les labs du module Fondamentaux de la formation tournent sur un cluster
    # kind, l'outil que la formation enseigne : un seul nœud, dans une VM, avec
    # Docker et kind posés par shared/kind-cluster.yml. Rôle `kind` et non
    # `worker` : le socle kubeadm rejoint tout hôte `worker` au cluster.
    #
    # 4096 Mo et 2 vCPU sont MESURÉS, le 2026-11-10, et non estimés : les deux
    # labs du module sortent VALIDE à cette taille, cycle 0 → 7/7 → 0 compris.
    # La mesure porte sur le PIRE cas, qui n'est pas un lab seul : chaque lab
    # kind crée SON cluster (`lab` et `boutique`), et aucun cleanup ne détruit
    # le sien, puisqu'il est le socle. Un apprenant qui joue le module en
    # entier porte donc DEUX clusters kind simultanés. Relevé dans la VM à ce
    # moment-là, 39 échantillons sans perte :
    #
    #   au repos, avant tout socle       3581 Mo disponibles sur 3915 utiles
    #   un cluster kind                  1179 Mo utilisés
    #   les deux clusters, au repos      1623 Mo utilisés
    #   au pire instant mesuré           2059 Mo encore disponibles
    #   OOM, Pods en Pending             aucun
    #
    # Soit 53 % de la mémoire inemployée au plus fort. Les 8192 Mo d'origine
    # réservaient plus du double du pic, ce qui portait le catalogue à 14,5 Go
    # et contredisait la leçon « Dimensionner sa machine » : un catalogue doit
    # tenir seul sur 16 Go.
    #
    # Ne pas descendre plus bas sans le mesurer, et surtout pas de mémoire :
    # la VM n'a AUCUN swap, donc un dépassement est un OOM franc, sans phase
    # de ralentissement qui avertirait. 3072 Mo n'a pas été éprouvé.
    - name: k8s-kind.lab
      distro: debian13
      role: kind
      ram_mb: 4096
      vcpu: 2
      disk_gb: 30

  # Hôtes OPTIONNELS (dsoxlab 0.9.0, contrat `infra.optional_hosts[]`) : montés
  # par `run` ou `start` d'un lab qui les cite dans `runtime.targets[].host` ou
  # `roles`, jamais par `provision` seul, gardés par `clean` et `reset`, retirés
  # par `destroy --optional-hosts`. Leur adresse dérive de leur position dans
  # hosts + optional_hosts, communs d'abord : en ajouter un ne décale aucun
  # hôte commun, mais un nouvel optionnel s'ajoute lui aussi EN FIN DE LISTE.
  optional_hosts:
    # Le cluster des labs Cilium du niveau 6 « Réseau avancé » (CKNE) : un plan
    # de contrôle et deux workers, SANS kube-proxy, monté par
    # shared/cilium-cluster.yml. Il est DISTINCT du cluster partagé
    # k8s-cp/k8s-w1 (Calico et kube-proxy), dont dépendent tous les autres labs
    # kubeadm : remplacer kube-proxy y casserait ce qu'ils éprouvent.
    #
    # Les rôles ne valent PAS `control-plane` ni `worker`, et c'est délibéré :
    # shared/kubeadm-cluster.yml joint au cluster partagé tout hôte de labenv
    # dont le rôle vaut `worker`. Un hôte net-* monté porterait sinon deux
    # clusters à la fois.
    #
    # Ubuntu 24.04 comme les nœuds kubeadm existants. Deux workers parce que
    # les labs suivants (capture, egress, BGP, WireGuard) ont besoin d'un
    # trafic qui traverse le réseau entre deux nœuds sans passer par le plan
    # de contrôle. 2048 Mo par worker est une ESTIMATION, pas une mesure :
    # agent Cilium, cilium-envoy, kubelet et containerd tiennent dans cette
    # taille sur un cluster de lab, à confirmer par la première validation.
    - name: net-cp.lab
      distro: ubuntu24
      role: cilium-control-plane
      ram_mb: 4096
      vcpu: 2
      disk_gb: 20

    - name: net-w1.lab
      distro: ubuntu24
      role: cilium-worker
      ram_mb: 2048
      vcpu: 2
      disk_gb: 20

    - name: net-w2.lab
      distro: ubuntu24
      role: cilium-worker
      ram_mb: 2048
      vcpu: 2
      disk_gb: 20

    # Le second worker des labs Istio du niveau 6 (Gateway HTTPS, traçage,
    # trafic d'inférence) : un control plane et DEUX workers, la topologie de
    # leur cadrage. Rôle `worker-optionnel` et NON `worker` : le socle kubeadm
    # joint au cluster tout hôte `worker` de l'inventaire, or un hôte optionnel
    # reste monté après le lab qui l'a fait monter. C'est le lab qui le cite
    # qui le joint, par shared/noeud-optionnel.yml, et son cleanup qui le
    # retire du cluster.
    - name: k8s-w2.lab
      distro: ubuntu24
      role: worker-optionnel
      ram_mb: 2560
      vcpu: 2
      disk_gb: 20

    # Le cluster hautement disponible du lab cka-control-plane-haute-disponibilite
    # (leçon 12-04, décisions D11 et D71, option B validée par Stéphane le
    # 2026-11-16) : trois plans de contrôle derrière un répartiteur HAProxy,
    # DISTINCT du cluster partagé, que ce lab ne touche pas. Joindre deux membres
    # etcd au cluster partagé mettrait son quorum en jeu.
    #
    # 2048 Mo par plan de contrôle : le minimum de lab que donne la leçon (2 CPU,
    # 2 Go), au-dessus des 1,7 Go que kubeadm exige. Le répartiteur ne porte que
    # HAProxy. Le surcoût réel se mesure pendant le lab (à relever ici).
    - name: ha-cp1.lab
      distro: ubuntu24
      role: ha-control-plane
      ram_mb: 2048
      vcpu: 2
      disk_gb: 20

    - name: ha-cp2.lab
      distro: ubuntu24
      role: ha-control-plane
      ram_mb: 2048
      vcpu: 2
      disk_gb: 20

    - name: ha-cp3.lab
      distro: ubuntu24
      role: ha-control-plane
      ram_mb: 2048
      vcpu: 2
      disk_gb: 20

    - name: ha-lb.lab
      distro: ubuntu24
      role: ha-repartiteur
      ram_mb: 512
      vcpu: 1
      disk_gb: 10

# Sections et niveaux reprennent les DOMAINES des blueprints officiels, mot
# pour mot. C'est ce qui permet de répondre à la seule question qui compte
# pour un candidat : « combien de compétences de l'examen puis-je démontrer ? »
sections:
  # La KCNA vient en tête : c'est le niveau 1, celui des modules qui
  # enseignent ce qu'est un cluster avant de l'administrer. Section ajoutée le
  # 2026-11-10 (décision de Stéphane) avec le module Architecture.
  - id: kcna
    title: "KCNA, Kubernetes and Cloud Native Associate"
    description: >-
      Four domains. Kubernetes Fundamentals weighs 44 %, the heaviest: what a
      cluster is made of and which component does what, read on a live
      multi-node cluster.
    labs:
      # Labs guidés du module Fondamentaux, un par leçon de pratique, avant son
      # challenge : installer kubectl (sur un cluster préparé par le setup),
      # premier cluster (supprime les clusters des autres labs, recréés par leur
      # setup), contextes kubeconfig, premier déploiement sur « boutique ».
      - k8s-installer-kubectl
      - k8s-creer-un-cluster-kind
      - k8s-changer-de-contexte
      - k8s-premier-deploiement
      # Le challenge du module Fondamentaux, sur le cluster kind « boutique » :
      # le référentiel KCNA rattache sa leçon Concepts clés à « Kubernetes Core
      # Concepts », le référentiel CKAD n'en rattache aucune.
      - k8s-challenge-premier-deploiement
      # Le module Architecture de la formation, sur un cluster kind à quatre
      # nœuds partagé par les quatre labs : un lab guidé par leçon
      # (architecture, control plane, nœuds worker), puis le challenge.
      - k8s-suivre-un-pod-de-kubectl-au-conteneur
      - k8s-observer-la-reconciliation
      - k8s-lire-un-node
      - k8s-challenge-lire-un-cluster

  - id: cka
    title: "CKA, Certified Kubernetes Administrator"
    description: >-
      Five domains. Troubleshooting weighs 30 %, more than any other, and it
      is the one that separates those who know Kubernetes from those who can
      operate it.
    labs:
      - cka-deployment-rollout-rollback
      - cka-kubectl-debug
      - cka-troubleshoot-networking
      - cka-troubleshoot-dns
      # Les deux labs de routage se suivent, et dans cet ordre : ils posent la
      # MÊME situation de départ, et seule la façon de la router change.
      # L'apprenant qui vient d'écrire un Ingress voit alors ce que la Gateway
      # API sépare, et ce qu'elle ne change pas.
      - cka-ingress-path-routing
      - cka-gateway-api-httproute
      - cka-networkpolicy-isolate-db
      # Le challenge du module Réseau et exposition, posé dans la leçon
      # « Network Policies », sur le cluster kubeadm (Calico, Traefik).
      - k8s-challenge-exposer-et-isoler
      - cka-pv-pvc-storageclass
      - cka-storageclass-provisionnement-dynamique
      # Le challenge du module Stockage persistant, posé dans la leçon
      # « StorageClass », sur le cluster kind « lab ».
      - k8s-challenge-donnees-qui-survivent
      # Lab guidé de la leçon « Les StatefulSets », module Workloads avancés.
      - cka-statefulset-identite-stable
      - cka-daemonset-all-nodes
      # Lab guidé de la leçon « Opérateurs », module Workloads avancés : installer
      # un opérateur tiers et ne configurer que sa ressource.
      - cka-operateur-installer-et-configurer
      # Le challenge du module Workloads avancés, posé dans la leçon
      # « Operators et CRDs pour développeurs », sur le cluster kind « multi ».
      - k8s-challenge-choisir-le-bon-workload
      - cka-node-affinity
      - cka-taints-tolerations-placement
      # Lab guidé de la leçon « Scheduling avancé », module 8 (D56), sur le
      # cluster kind « multi ».
      - k8s-prioriser-et-preempter
      - cka-resourcequota-limitrange
      - cka-hpa-autoscaling
      # Lab guidé de la leçon « Vertical Pod Scaling », module 8, sur le
      # cluster kubeadm.
      - k8s-appliquer-une-recommandation-vpa
      # Le challenge du module Scheduling et capacité, posé dans la leçon
      # « Ajuster les ressources d'un Pod », sur le cluster kind « capacite ».
      - k8s-challenge-placer-et-plafonner
      - cka-rbac-serviceaccount
      # Le challenge du module 9 (RBAC et ServiceAccounts), posé dans la leçon
      # « ServiceAccounts », sur le cluster kubeadm.
      - k8s-challenge-identite-et-droits-minimaux
      # L'épreuve de fin du niveau 3 (fiche KUBERN-EPREUVE-N3), qui suppose
      # les modules RBAC, Réseau, Scheduling et capacité, et Sécurité des
      # workloads joués, sur le cluster kind « capacite » (trois workers).
      - k8s-epreuve-livrer-une-application
      # Niveau 4, lot A (vague 1) : les interfaces d'un nœud (CNI, CSI et CRI),
      # puis la santé d'etcd avant sa sauvegarde.
      - k8s-lire-les-interfaces-d-un-noeud
      # Niveau 4, lot A (vague 2) : initialiser le plan de contrôle, puis
      # joindre un worker au cluster kubeadm.
      - cka-initialiser-un-plan-de-controle
      - cka-joindre-un-noeud-kubeadm
      # Lab guidé de la leçon 12-04 « Haute disponibilité » (D71, D103) : trois
      # plans de contrôle kubeadm derrière HAProxy, sur les hôtes optionnels ha-*.
      - cka-control-plane-haute-disponibilite
      # Le challenge du module Installer un cluster (initialiser, joindre, CNI
      # CSI et CRI), posé dans la leçon « Haute disponibilité » : le worker
      # réinitialisé sur le cluster kubeadm, la haute disponibilité sur un
      # cluster kind à trois plans de contrôle.
      - k8s-challenge-installer-un-cluster
      - cka-etcd-sante-et-defragmentation
      - cka-etcd-backup-restore
      # Les API retirées se repèrent avant toute montée de version.
      - k8s-detecter-les-api-depreciees
      # Niveau 4, lot A (vague 1) : la PKI du cluster (renouveler, donner un
      # accès par CSR), puis cert-manager.
      - kubeadm-verifier-et-renouveler-les-certificats
      - k8s-donner-un-acces-par-csr
      # Niveau 4, lot A (vague 2) : le challenge du module Administrer le cluster,
      # après les labs qu'il met en jeu.
      - k8s-challenge-sauvegarder-et-restaurer
      # Lab guidé de la leçon 14-02 « Observer la santé d'un cluster » (D103) :
      # metrics-server, kubectl top et réservation des nœuds, sur le cluster kubeadm.
      - k8s-observer-la-sante-d-un-cluster
      # Lab guidé de la leçon 14-04 « Analyser les événements Kubernetes » (D103) :
      # quatre pannes nommées par leurs Events, et leur chronologie, sur le cluster kubeadm.
      - k8s-reconstituer-un-incident-par-les-evenements
      - cka-troubleshoot-crashloopbackoff
      # Lab guidé de la leçon 14-07 « Diagnostiquer un Pod Pending » (D103) :
      # quatre causes de Pending, une par application, sur le cluster kubeadm.
      - cka-placer-un-pod-pending
      - cka-troubleshoot-imagepullbackoff
      - cka-troubleshoot-apiserver
      - cka-static-pod
      - cka-troubleshoot-kubelet
      - cka-troubleshoot-node-notready
      # Le challenge du module Diagnostiquer (niveau 4), après les labs de
      # diagnostic qu'il cumule, sur le cluster kubeadm.
      - k8s-challenge-depanner-une-application
      # Lab guidé de la leçon 14-11 « Modifier une ressource en production »
      # (D103) : patch strategic, JSON et dérive avec Git, sur le cluster kubeadm.
      - k8s-modifier-une-ressource-en-production
      - cka-node-drain-cordon
      # Lab guidé de la leçon 14-13 « Gérer les nœuds » (D103) : étiquette, rôle,
      # annotation et taint NoExecute sur un worker, sur le cluster kubeadm.
      - cka-etiqueter-et-isoler-un-noeud
      # La montée de version vient après la sauvegarde d'etcd
      # (cka-etcd-backup-restore), et dans cet ordre : on n'opère pas sur un
      # plan de contrôle dont on ne sait pas restaurer l'état. C'est aussi le
      # seul lab du catalogue qui reconstruit le cluster, d'où sa place tardive.
      - cka-kubeadm-upgrade
      # Le challenge du module Maintenir et mettre à jour, posé dans la leçon
      # « Mettre à jour un cluster » : vider un nœud, le rendre, puis monter
      # tout le cluster. Il reconstruit le cluster en 1.36 comme le lab
      # précédent, dont il reprend le setup et le cleanup.
      - k8s-challenge-maintenir-un-noeud
      # Lab guidé de la leçon 14-18 « Tâches quotidiennes de l'admin » (D103) : la
      # revue hebdomadaire (Jobs, quota, révisions), avant le challenge du module.
      - k8s-faire-la-routine-d-exploitation
      # Le challenge du module Fiabiliser et exploiter (niveau 4), sur le cluster
      # kubeadm : son check évacue lui-même le worker.
      - k8s-challenge-garantir-la-disponibilite
      # L'épreuve de fin du niveau 4 (KUBERN-EPREUVE-N4), qui suppose tous les
      # modules du niveau joués : elle croise installation, haute
      # disponibilité, sauvegarde, montée de version, maintenance et dépannage.
      # Elle reconstruit le cluster kubeadm, comme cka-kubeadm-upgrade.
      - k8s-epreuve-administrer-un-cluster
      # Le capstone vient en dernier : il suppose les dix-neuf précédents joués,
      # puisqu'il ne dit plus quel est le sujet de la panne.
      - cka-capstone-portail
      # L'examen blanc chronométré, au format et aux poids de la CKA : il vient
      # après le capstone, quand tout le parcours a été joué.
      - cka-examen-blanc

  - id: ckad
    title: "CKAD, Certified Kubernetes Application Developer"
    description: >-
      Five application-facing domains. « Application Environment,
      Configuration and Security » weighs 25 %, the heaviest of the five.
    labs:
      # Sert le module Fondamentaux de la formation, sur un cluster kind : le
      # lab de la leçon « Lire l'état du cluster ». Le challenge du module est
      # rangé en kcna depuis le 2026-11-10.
      - k8s-lire-l-etat-d-un-pod-en-erreur
      # Labs guidés du module « Les ressources de base », un par leçon de
      # pratique, sur le cluster kind « boutique », chacun dans son namespace :
      # Pods, ReplicaSets, puis labels et annotations.
      - k8s-diagnostiquer-un-pod
      - k8s-lire-les-replicasets
      - ckad-rolling-update-strategy
      - k8s-labels-et-selecteurs
      - ckad-expose-service
      - ckad-blue-green-deployment
      # Lab guidé de la leçon « Services » : réparer un Service NodePort, noté sur
      # une vraie requête vers chaque nœud.
      - ckad-service-nodeport-reparer
      # Lot 3b du même module : expose et port-forward, ConfigMaps,
      # Namespaces, puis l'aide-mémoire kubectl (extraction JSONPath).
      - k8s-atteindre-une-application
      - k8s-configurer-par-configmap
      - ckad-secret-injection-protection
      - ckad-configmap-secret-injection
      - k8s-isoler-par-namespace
      - k8s-extraire-avec-kubectl
      # Servent le module « Les ressources de base », sur le cluster kind
      # « boutique », chacun dans son namespace : le challenge du module, puis
      # l'épreuve de fin du niveau 1, qui suppose le module entier joué.
      - k8s-challenge-relier-config-et-service
      - k8s-epreuve-livrer-et-mettre-a-jour
      # Labs guidés du module « Déployer ses applications » (niveau 2), sur le
      # cluster kind « lab », un par leçon technique : explorer l'API, écrire un
      # manifeste, créer ou appliquer, vérifier et attendre ; Kustomize est
      # servi par ckad-kustomize-overlays ; puis gérer les images.
      - k8s-explorer-l-api
      - k8s-ecrire-un-manifeste
      - k8s-creer-ou-appliquer
      - k8s-verifier-et-attendre
      - ckad-kustomize-overlays
      # Labs guidés des leçons Helm (règle 17, issues #218 et #219) : inspecter et
      # restaurer une release, puis surcharger les values, Helm 4.3.2 et podinfo.
      - k8s-inspecter-et-restaurer-une-release-helm
      - ckad-helm-install-upgrade
      - k8s-surcharger-les-values-d-un-chart-helm
      - k8s-gerer-les-images
      - ckad-init-container
      - ckad-multi-container-sidecar
      - ckad-job-cronjob
      - ckad-volumes-partage-entre-conteneurs
      - ckad-probes-all-types
      - ckad-pod-resources-labels
      - ckad-in-place-pod-vertical-scaling
      - ckad-troubleshoot-missing-configmap
      # Le challenge du module, posé dans la leçon « Débugger une application »
      # (P12, D43), sur le cluster kind « lab ».
      - k8s-challenge-manifest-robuste
      # Lab guidé de la leçon 12 facteurs (KUBERN-06-18, D110, issue #217) :
      # Kustomize, état dans Redis, preStop et Job d'administration.
      - k8s-rendre-une-application-conforme-12-facteurs
      - ckad-networkpolicy-ingress-egress
      # Lab guidé de la leçon « Operators et CRDs pour développeurs », module
      # Workloads avancés, sur le cluster kind « lab ».
      - ckad-crd-ressource-personnalisee
      # L'épreuve de fin du niveau 2, qui suppose les modules 4 à 6 joués, sur
      # le cluster kind « multi ».
      - k8s-epreuve-deployer-une-application
      - ckad-security-context-hardened
      - ckad-rbac-role-rolebinding
      - ckad-troubleshoot-crashloop
      # Le capstone vient en dernier, et ce n'est pas qu'une question d'ordre :
      # il ne s'adresse qu'à qui a déjà joué les dix-sept précédents, puisqu'il
      # ne dit plus quel objet employer.
      - ckad-capstone-boutique
      # L'examen blanc chronométré, au format et aux poids de la CKAD : il vient
      # après le capstone, quand tout le parcours a été joué.
      - ckad-examen-blanc

  - id: cks
    title: "CKS, Certified Kubernetes Security Specialist"
    description: >-
      Six domains. Three of them weigh 20 % each, so 60 % between them.
      Several of their skills cannot be checked on a containerised cluster,
      which is the reason this catalogue uses virtual machines.
    labs:
      - cks-ingress-tls
      - cks-networkpolicy-default-deny
      # L'immuabilité ne répète pas la reprise d'un Pod privilégié :
      # cks-secure-existing-pod porte sur le privilège et le partage de
      # namespaces avec l'hôte, celui-ci sur le système de fichiers et sur ce
      # que le fermer coûte à une application qui écrit pour démarrer. Le
      # parcours du site place l'immuabilité avant, dans le module Sécurité des
      # workloads.
      - cks-security-context-immutable
      - cks-rbac-least-privilege
      # Niveau 4, lot A (vague 1) : des certificats émis par cert-manager et
      # une CA interne, après le TLS d'un Ingress (cks-ingress-tls).
      - k8s-emettre-un-certificat-avec-cert-manager
      # Module Modèle de menaces et cadres (niveau 5, KCSA), sur le cluster
      # kubeadm : le lab guidé de la leçon Persistance. Il suppose joués
      # cks-rbac-least-privilege et cks-audit-log-policy. Le parcours du site
      # place pourtant la leçon Audit Logs après celle-ci : écart signalé dans
      # la PR qui a aligné ce fichier sur le parcours, en attente de décision.
      - k8s-detecter-une-persistance
      # Le lab guidé de la leçon Déni de service, qui suit la Persistance dans
      # le module et s'appuie sur cka-resourcequota-limitrange.
      - k8s-contenir-un-deni-de-service
      # Le challenge du module, posé dans la leçon Déni de service : il croise
      # les deux labs guidés précédents sur un autre scénario.
      - k8s-challenge-contenir-une-attaque
      - cks-api-server-hardening
      - cks-cis-benchmark-remediate
      # Lab guidé de la même leçon 15-27 (#220) : réduire la surface de l'OS
      # du même nœud optionnel, ce qui écoute sans servir Kubernetes.
      - cks-reduire-la-surface-du-noeud
      # Lab guidé de la leçon 15-27 « Durcir les nœuds » (#235) : SSH réservé
      # à un groupe, par clé seulement, et un sudo ramené au plus juste, sur
      # l'hôte optionnel k8s-w2.lab (une erreur d'AllowGroups s'y répare en
      # détruisant la machine, sans toucher au cluster partagé).
      - cks-restreindre-l-acces-au-noeud
      # Lab guidé de la même leçon 15-27 (#221) : le pare-feu nftables du
      # nœud optionnel, persistant, sans effacer kube-proxy ni Calico.
      - cks-fermer-l-acces-reseau-au-noeud
      # Lab guidé de la leçon 15-28 « Restreindre l'accès à l'API server »
      # (#234) : l'anonyme gardé sur la santé et la découverte de kubeadm
      # join, le kubelet fermé, NodeRestriction rendu. Après le durcissement
      # du profileur, sur le même Pod statique.
      - cks-restreindre-l-acces-anonyme
      - cks-apparmor-confiner-un-pod
      - cks-seccomp-profile
      - cks-pod-security-admission
      - cks-secure-existing-pod
      - cks-validating-admission-policy
      # Le challenge du module Politiques d'admission (niveau 5), posé dans la
      # leçon « VAP vs Kyverno vs Gatekeeper » : standard restricted, Pod
      # privilégié reconstruit et politique native, sur le cluster kubeadm.
      - k8s-challenge-faire-refuser-par-admission
      # Le mTLS vient après la NetworkPolicy (cks-networkpolicy-default-deny) :
      # l'une décide QUI a le droit de parler, l'autre exige que celui qui
      # parle prouve son identité. Les deux répondent à des questions
      # différentes, et l'apprenant qui a posé un default-deny voit mieux ce
      # que le chiffrement ajoute par-dessus.
      - cks-istio-mtls-lockdown
      - cks-image-pinned-digest
      - cks-dockerfile-static-analysis
      - cks-cosign-verify-image
      - cks-image-scanning-trivy
      # Le challenge du module Chaîne d'approvisionnement (niveau 5), posé
      # dans la leçon « Image Scanning » : épingler, analyser, signer, et un
      # cluster qui refuse le non signé (Kyverno posé par le setup).
      - k8s-challenge-livrer-une-image-verifiee
      - cks-audit-log-policy
      # Le challenge du module Durcir le cluster (niveau 5), posé dans la
      # leçon « Audit Logs » : il croise l'API server durci, la remédiation
      # CIS et l'audit, sur le cluster kubeadm.
      - k8s-challenge-durcir-le-plan-de-controle
      # Lab guidé de la leçon 15-16 « Falco » (D103) : une règle personnalisée,
      # limitée à un namespace, chargée en plus des règles fournies. Il vient
      # avant le challenge qui suit, lequel croise Falco avec le confinement.
      - cks-falco-detecter-un-shell
      - cks-runtime-sandbox-gvisor
      # Le challenge du module « Confiner et détecter » (niveau 5), posé dans
      # la leçon « Runtime Sandboxes », après les labs du module qu'il croise :
      # AppArmor, seccomp, gVisor, la NetworkPolicy par défaut et le mTLS. Il y
      # ajoute Falco, dont cks-falco-detecter-un-shell a posé les bases.
      - k8s-challenge-confiner-et-detecter
      # L'épreuve de fin du niveau 5 (KUBERN-EPREUVE-N5), après tous les labs
      # du niveau qu'elle croise : plan de contrôle, audit, admission,
      # confinement, réseau, Falco et chaîne d'approvisionnement.
      - k8s-epreuve-securiser-un-cluster

      # Le capstone vient en dernier, comme ceux du CKA et du CKAD : il ne
      # nomme plus aucun objet Kubernetes, et ne s'adresse donc qu'à qui a
      # déjà joué les quinze précédents.
      - cks-capstone-enclave
      # L'examen blanc chronométré, au format et aux poids de la CKS : il vient
      # après le capstone, quand tout le parcours a été joué, comme ceux du CKA
      # et du CKAD.
      - cks-examen-blanc

  # Le niveau 6 « Réseau avancé » vient après la CKS (décision D84 du
  # 2026-11-14), avec sa propre épreuve. Ses labs tournent sur le cluster
  # Cilium sans kube-proxy des hôtes optionnels net-* (shared/cilium-cluster.yml),
  # jamais sur le cluster partagé.
  - id: ckne
    title: "Advanced networking (CKNE)"
    description: >-
      Five domains in the CKNE curriculum. Service Networking and DNS and
      Network Security and Policy weigh 25 % each. The labs run on a
      dedicated Cilium cluster without kube-proxy, or run Istio in ambient
      mode on the kubeadm cluster, with a second worker.
    labs:
      # Leçon L1 : le cluster que l'apprenant initialise et dont Cilium
      # remplace kube-proxy. Son cleanup remet les nœuds à zéro.
      - k8s-installer-cilium-sans-kube-proxy
      # Leçon L2 : capturer sur l'interface d'un Pod (tcpdump, nsenter,
      # kubectl debug), sur le cluster kubeadm du socle et son second worker.
      - k8s-capturer-le-trafic-d-un-pod
      # Leçon L3 : une seconde interface par Multus v4.3.2 thick, à côté de
      # Cilium en cni.exclusive=false, sur les hôtes net-*.
      - k8s-attacher-une-seconde-interface
      # Leçon L4 : sur le cluster prêt du socle, que son setup remonte.
      - k8s-auditer-les-flux-avec-hubble
      # Leçon L5 : le plan de contrôle BGP de Cilium face à un routeur FRR
      # 10.6.2 hors du cluster (sur k8s-cp.lab, espace de noms réseau à lui).
      - k8s-annoncer-un-service-en-bgp
      # Leçon L6 : la passerelle d'egress de Cilium (masquage BPF exigé),
      # témoin externe sur k8s-cp.lab, hors du cluster net-*.
      - k8s-faire-sortir-le-trafic-par-une-passerelle
      # Le challenge du module (fiche E-maitriser-les-flux-du-cluster), hébergé
      # par la leçon egress, la dernière dont il évalue le geste (D92) : Service
      # sans kube-proxy, un seul flux, sortie d'un namespace, flux refusé lu
      # dans Hubble, sur net-*.
      - k8s-challenge-reseau-avance
      # Leçon L7 : ClusterMesh entre deux clusters d'un nœud (ha-cp1,
      # ha-cp2), autorité de certification partagée. Le cleanup remet les
      # deux hôtes à zéro pour le lab de haute disponibilité.
      - k8s-relier-deux-clusters
      # L8 : la Gateway d'Istio en HTTPS, certificat de cert-manager. Suppose
      # joué k8s-emettre-un-certificat-avec-cert-manager (niveau 4, D85).
      - k8s-servir-une-gateway-en-https
      # L9 : tracer une requête lente (waypoint, collecteur OpenTelemetry,
      # Jaeger) dans le même maillage ambient que L8, service lent tiré au
      # hasard par le setup.
      - k8s-tracer-une-requete-lente
      # L10 : Gateway API Inference Extension servie par la Gateway d'Istio.
      - k8s-router-des-requetes-d-inference
      # Gateway servi par Cilium et politique L7 (entité ingress), sur net-*.
      # Leçon cilium-gateway-l7, préalable de l'épreuve du niveau.
      - k8s-filtrer-en-l7-avec-cilium
      # L'épreuve de fin du niveau 6 (KUBERN-EPREUVE-N6), après tous les labs
      # du niveau qu'elle croise : Gateway API servie par Cilium, politique
      # L7, chiffrement WireGuard et diagnostic par Hubble, sur net-*.
      - k8s-epreuve-reseau-avance
      # Le capstone de la CKNE (fiche KUBERN-16-17), en dernier comme ceux du
      # CKA, du CKAD et de la CKS : il ne nomme aucun objet. Deux sites (ha-cp1,
      # ha-cp2) reliés par ClusterMesh, annonce BGP au routeur FRR de k8s-cp,
      # Gateway HTTPS servie par Cilium avec cert-manager.
      - ckne-capstone-relier-deux-sites

