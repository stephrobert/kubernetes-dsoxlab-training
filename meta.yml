---
# Contrat déclaratif consommé par la CLI dsoxlab.
# https://github.com/stephrobert/dsoxlab
#
# Ce catalogue complète la formation Kubernetes du blog. Il ne redit pas les
# guides : il donne à l'apprenant de quoi PROUVER qu'il sait faire, ce que ni
# un quiz ni une lecture ne peuvent établir.
schema_version: 1

repo:
  id: kubernetes-dsoxlab-training
  category: kubernetes
  title: "Kubernetes DevSecOps Training: CKA, CKAD and CKS"
  blog_url: "https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/"
  # Où `dsoxlab support --issue` dépose le rapport d'un apprenant.
  #
  # Sans ce champ, dsoxlab retombe sur `git remote get-url origin`, ce qui
  # marche ici mais suppose deux choses : un remote nommé `origin`, et un
  # hébergeur dont les issues vivent sous `<dépôt>/issues`. Le déclarer lève
  # la supposition.
  issues_url: "https://github.com/stephrobert/kubernetes-dsoxlab-training/issues"
  description: >-
    Verifiable labs for the blog's Kubernetes course. Every lab is paired
    with a lesson on the site and validates a skill named by an exam
    blueprint. The cluster is a real kubeadm cluster on virtual machines,
    not a container runtime: that is what makes the kubelet, etcd and the
    node's own configuration reachable.

# Topologie d'infrastructure.
#
# POURQUOI DES VM, ALORS QUE LA FORMATION ENSEIGNE SUR kind.
# La règle 11 de la section Kubernetes impose kind comme outil unique des
# GUIDES, parce que l'apprenant doit pouvoir suivre la formation sur son
# poste. Ce catalogue répond à une autre question, et sa règle 7 la pose :
# certains faits ne se prouvent PAS dans un conteneur, parce que kind et k3d
# partagent le noyau de l'hôte. Relevé en lab le 2026-09-14, le kubelet d'un
# nœud kind refuse un Pod AppArmor avec « Cannot enforce AppArmor: AppArmor
# is not enabled on the host ».
#
# Ce que les VM débloquent, et que la formation a dû classer « non couvert » :
#   - AppArmor et les profils de confinement du nœud
#   - la montée de version kubeadm, control plane et kubelets réels
#   - le durcissement de l'OS hôte, l'accès réseau externe, le point de
#     métadonnées du nœud (compétences Cluster Setup et System Hardening CKS)
#   - le diagnostic d'un kubelet, d'un pod statique ou d'un etcd cassé
#
# Les deux approches ne se concurrencent pas : la formation enseigne, ce
# catalogue éprouve.
infra:
  provider:
    - kvm
    - incus
  # « lab-kubernetes » est REFUSÉ : le pont dérivé, virbr-kubernetes, fait
  # 16 caractères alors que le noyau en accepte 15. libvirt échoue alors en
  # cours d'apply sur « Numerical result out of range », message qui ne nomme
  # pas la cause. Le nom du pont vaut virbr- plus le nom du réseau privé de
  # son préfixe lab- : il reste donc 9 caractères utiles.
  network: lab-k8s
  cidr: 10.10.50.0/24

  # ATTENTION : l'IP et la MAC de chaque hôte dérivent de sa POSITION dans
  # cette liste. Insérer un hôte au milieu réattribue les adresses de tous
  # les suivants, ce que le provider libvirt refuse en cours de route.
  # Tout nouvel hôte s'ajoute EN FIN DE LISTE.
  hosts:
    # Ubuntu 24.04 parce que c'est ce que recommande le guide kubeadm publié.
    # Aligner le lab sur le guide évite à l'apprenant de traduire une
    # procédure pendant qu'il apprend la procédure.
    - name: k8s-cp.lab
      distro: ubuntu24
      role: control-plane
      # kubeadm refuse d'initialiser en dessous de 2 vCPU et 1,7 Go. On prend
      # de la marge : le control plane porte etcd, l'API server et, pendant
      # les labs de diagnostic, des Pods qu'on casse volontairement.
      ram_mb: 4096
      vcpu: 2
      disk_gb: 25

    - name: k8s-w1.lab
      distro: ubuntu24
      role: worker
      ram_mb: 2560
      vcpu: 2
      disk_gb: 20

    # Les labs du module Fondamentaux de la formation tournent sur un cluster
    # kind, l'outil que la formation enseigne : un seul nœud, dans une VM, avec
    # Docker et kind posés par shared/kind-cluster.yml. Rôle `kind` et non
    # `worker` : le socle kubeadm rejoint tout hôte `worker` au cluster.
    #
    # 4096 Mo et 2 vCPU sont MESURÉS, le 2026-11-10, et non estimés : les deux
    # labs du module sortent VALIDE à cette taille, cycle 0 → 7/7 → 0 compris.
    # La mesure porte sur le PIRE cas, qui n'est pas un lab seul : chaque lab
    # kind crée SON cluster (`lab` et `boutique`), et aucun cleanup ne détruit
    # le sien, puisqu'il est le socle. Un apprenant qui joue le module en
    # entier porte donc DEUX clusters kind simultanés. Relevé dans la VM à ce
    # moment-là, 39 échantillons sans perte :
    #
    #   au repos, avant tout socle       3581 Mo disponibles sur 3915 utiles
    #   un cluster kind                  1179 Mo utilisés
    #   les deux clusters, au repos      1623 Mo utilisés
    #   au pire instant mesuré           2059 Mo encore disponibles
    #   OOM, Pods en Pending             aucun
    #
    # Soit 53 % de la mémoire inemployée au plus fort. Les 8192 Mo d'origine
    # réservaient plus du double du pic, ce qui portait le catalogue à 14,5 Go
    # et contredisait la leçon « Dimensionner sa machine » : un catalogue doit
    # tenir seul sur 16 Go.
    #
    # Ne pas descendre plus bas sans le mesurer, et surtout pas de mémoire :
    # la VM n'a AUCUN swap, donc un dépassement est un OOM franc, sans phase
    # de ralentissement qui avertirait. 3072 Mo n'a pas été éprouvé.
    - name: k8s-kind.lab
      distro: debian13
      role: kind
      ram_mb: 4096
      vcpu: 2
      disk_gb: 30

# Sections et niveaux reprennent les DOMAINES des blueprints officiels, mot
# pour mot. C'est ce qui permet de répondre à la seule question qui compte
# pour un candidat : « combien de compétences de l'examen puis-je démontrer ? »
sections:
  # La KCNA vient en tête : c'est le niveau 1, celui des modules qui
  # enseignent ce qu'est un cluster avant de l'administrer. Section ajoutée le
  # 2026-11-10 (décision de Stéphane) avec le module Architecture.
  - id: kcna
    title: "KCNA, Kubernetes and Cloud Native Associate"
    description: >-
      Four domains. Kubernetes Fundamentals weighs 44 %, the heaviest: what a
      cluster is made of and which component does what, read on a live
      multi-node cluster.
    labs:
      # Labs guidés du module Fondamentaux, un par leçon de pratique, avant son
      # challenge : installer kubectl (sur un cluster préparé par le setup),
      # premier cluster (supprime les clusters des autres labs, recréés par leur
      # setup), contextes kubeconfig, premier déploiement sur « boutique ».
      - k8s-installer-kubectl
      - k8s-creer-un-cluster-kind
      - k8s-changer-de-contexte
      - k8s-premier-deploiement
      # Le challenge du module Fondamentaux, sur le cluster kind « boutique » :
      # le référentiel KCNA rattache sa leçon Concepts clés à « Kubernetes Core
      # Concepts », le référentiel CKAD n'en rattache aucune.
      - k8s-challenge-premier-deploiement
      # Le module Architecture de la formation, sur un cluster kind à quatre
      # nœuds partagé par les quatre labs : un lab guidé par leçon
      # (architecture, control plane, nœuds worker), puis le challenge.
      - k8s-suivre-un-pod-de-kubectl-au-conteneur
      - k8s-observer-la-reconciliation
      - k8s-lire-un-node
      - k8s-challenge-lire-un-cluster

  - id: cka
    title: "CKA, Certified Kubernetes Administrator"
    description: >-
      Five domains. Troubleshooting weighs 30 %, more than any other, and it
      is the one that separates those who know Kubernetes from those who can
      operate it.
    labs:
      - cka-static-pod
      - cka-daemonset-all-nodes
      # Lab guidé de la leçon « Les StatefulSets », module Workloads avancés.
      - cka-statefulset-identite-stable
      # Le challenge du module Workloads avancés, posé dans la leçon
      # « Operators et CRDs pour développeurs », sur le cluster kind « multi ».
      - k8s-challenge-choisir-le-bon-workload
      - cka-rbac-serviceaccount
      - cka-taints-tolerations-placement
      - cka-node-affinity
      - cka-networkpolicy-isolate-db
      # Les deux labs de routage se suivent, et dans cet ordre : ils posent la
      # MÊME situation de départ, et seule la façon de la router change.
      # L'apprenant qui vient d'écrire un Ingress voit alors ce que la Gateway
      # API sépare, et ce qu'elle ne change pas.
      - cka-ingress-path-routing
      - cka-gateway-api-httproute
      - cka-pv-pvc-storageclass
      - cka-storageclass-provisionnement-dynamique
      # Le challenge du module Stockage persistant, posé dans la leçon
      # « StorageClass », sur le cluster kind « lab ».
      - k8s-challenge-donnees-qui-survivent
      - cka-deployment-rollout-rollback
      - cka-node-drain-cordon
      - cka-hpa-autoscaling
      - cka-resourcequota-limitrange
      - cka-troubleshoot-imagepullbackoff
      - cka-troubleshoot-crashloopbackoff
      - cka-kubectl-debug
      - cka-troubleshoot-dns
      - cka-troubleshoot-networking
      - cka-troubleshoot-node-notready
      - cka-troubleshoot-kubelet
      - cka-troubleshoot-apiserver
      - cka-etcd-backup-restore
      # La montée de version vient juste après la sauvegarde d'etcd, et dans
      # cet ordre : on n'opère pas sur un plan de contrôle dont on ne sait pas
      # restaurer l'état. C'est aussi le seul lab du catalogue qui reconstruit
      # le cluster, d'où sa place tardive.
      - cka-kubeadm-upgrade
      # Le capstone vient en dernier : il suppose les dix-neuf précédents joués,
      # puisqu'il ne dit plus quel est le sujet de la panne.
      - cka-capstone-portail

  - id: ckad
    title: "CKAD, Certified Kubernetes Application Developer"
    description: >-
      Five application-facing domains. « Application Environment,
      Configuration and Security » weighs 25 %, the heaviest of the five.
    labs:
      - ckad-pod-resources-labels
      - ckad-configmap-secret-injection
      - ckad-secret-injection-protection
      - ckad-probes-all-types
      - ckad-init-container
      - ckad-multi-container-sidecar
      - ckad-volumes-partage-entre-conteneurs
      - ckad-expose-service
      - ckad-security-context-hardened
      - ckad-rbac-role-rolebinding
      - ckad-networkpolicy-ingress-egress
      - ckad-rolling-update-strategy
      - ckad-blue-green-deployment
      - ckad-kustomize-overlays
      - ckad-helm-install-upgrade
      - ckad-job-cronjob
      - ckad-in-place-pod-vertical-scaling
      - ckad-troubleshoot-missing-configmap
      - ckad-troubleshoot-crashloop
      # Le capstone vient en dernier, et ce n'est pas qu'une question d'ordre :
      # il ne s'adresse qu'à qui a déjà joué les dix-sept précédents, puisqu'il
      # ne dit plus quel objet employer.
      - ckad-capstone-boutique
      # Sert le module Fondamentaux de la formation, sur un cluster kind : le
      # lab de la leçon « Lire l'état du cluster ». Le challenge du module est
      # rangé en kcna depuis le 2026-11-10.
      - k8s-lire-l-etat-d-un-pod-en-erreur
      # Labs guidés du module « Les ressources de base », un par leçon de
      # pratique, sur le cluster kind « boutique », chacun dans son namespace :
      # Pods, ReplicaSets, puis labels et annotations.
      - k8s-diagnostiquer-un-pod
      - k8s-lire-les-replicasets
      - k8s-labels-et-selecteurs
      # Lot 3b du même module : expose et port-forward, ConfigMaps,
      # Namespaces, puis l'aide-mémoire kubectl (extraction JSONPath).
      - k8s-atteindre-une-application
      - k8s-configurer-par-configmap
      - k8s-isoler-par-namespace
      - k8s-extraire-avec-kubectl
      # Servent le module « Les ressources de base », sur le cluster kind
      # « boutique », chacun dans son namespace : le challenge du module, puis
      # l'épreuve de fin du niveau 1, qui suppose le module entier joué.
      - k8s-challenge-relier-config-et-service
      - k8s-epreuve-livrer-et-mettre-a-jour
      # Labs guidés du module « Déployer ses applications » (niveau 2), sur le
      # cluster kind « lab », un par leçon technique : explorer l'API, écrire un
      # manifeste, créer ou appliquer, vérifier et attendre ; Kustomize est
      # servi par ckad-kustomize-overlays ; puis gérer les images.
      - k8s-explorer-l-api
      - k8s-ecrire-un-manifeste
      - k8s-creer-ou-appliquer
      - k8s-verifier-et-attendre
      - k8s-gerer-les-images
      # Le challenge du module, posé dans la leçon « Débugger une application »
      # (P12, D43), sur le cluster kind « lab ».
      - k8s-challenge-manifest-robuste
      # Lab guidé de la leçon « Operators et CRDs pour développeurs », module
      # Workloads avancés, sur le cluster kind « lab ».
      - ckad-crd-ressource-personnalisee

  - id: cks
    title: "CKS, Certified Kubernetes Security Specialist"
    description: >-
      Six domains. Three of them weigh 20 % each, so 60 % between them.
      Several of their skills cannot be checked on a containerised cluster,
      which is the reason this catalogue uses virtual machines.
    labs:
      - cks-apparmor-confiner-un-pod
      - cks-seccomp-profile
      - cks-pod-security-admission
      - cks-secure-existing-pod
      # L'immuabilité suit la reprise d'un Pod privilégié, et ne la répète
      # pas : le lab précédent porte sur le privilège et le partage de
      # namespaces avec l'hôte, celui-ci sur le système de fichiers et sur ce
      # que le fermer coûte à une application qui écrit pour démarrer.
      - cks-security-context-immutable
      - cks-runtime-sandbox-gvisor
      - cks-image-pinned-digest
      - cks-validating-admission-policy
      - cks-image-scanning-trivy
      - cks-cosign-verify-image
      - cks-dockerfile-static-analysis
      - cks-rbac-least-privilege
      - cks-api-server-hardening
      - cks-audit-log-policy
      - cks-networkpolicy-default-deny
      # Le mTLS vient juste après la NetworkPolicy, et dans cet ordre : l'un
      # décide QUI a le droit de parler, l'autre exige que celui qui parle
      # prouve son identité. Les deux répondent à des questions différentes,
      # et l'apprenant qui a posé un default-deny voit mieux ce que le
      # chiffrement ajoute par-dessus.
      - cks-istio-mtls-lockdown
      - cks-ingress-tls
      - cks-cis-benchmark-remediate

      # Le capstone vient en dernier, comme ceux du CKA et du CKAD : il ne
      # nomme plus aucun objet Kubernetes, et ne s'adresse donc qu'à qui a
      # déjà joué les quinze précédents.
      - cks-capstone-enclave

# Envoi des preuves vers le compte facultatif du site, par `dsoxlab login` puis
# `dsoxlab push`. Rien ne part sans ces deux gestes de l'apprenant. Toutes ces
# valeurs sont publiques : le client Cognito de la CLI est un client public
# (PKCE, sans secret). Le retour passe par une page du site qui affiche le code
# à recopier, la page de connexion gérée refusant une boucle locale en http.
learning:
  sync:
    protocol: "learner-sync/1"
    api: "https://q44wsl0b0i.execute-api.eu-west-3.amazonaws.com"
    issuer: "https://cognito-idp.eu-west-3.amazonaws.com/eu-west-3_x2PWxNlgE"
    oauth_domain: "https://connexion.stephane-robert.info"
    client_id: "4fitn8grnrm8gu70v4ud35itti"
    callback_url: "https://www.stephane-robert.info/auth/cli/"
