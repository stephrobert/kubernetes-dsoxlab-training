id: cka-rbac-serviceaccount
title: "Give an application an identity: ServiceAccount, Role, RoleBinding"
level: cluster-architecture-installation-configuration
section: cka
difficulty: intermediate
description: |
  An application refuses to start because its ServiceAccount does not exist.
  Create it, grant it the right to read the Pods of its namespace and
  nothing else, then prove from inside the Pod, with its own token, that
  listing goes through and that deleting, reading Secrets or looking
  elsewhere are denied. Finally, cut the token of the Pod that never calls
  the API.
skills:
  - serviceaccount
  - role
  - rolebinding
  - rbac
  - least-privilege
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/serviceaccounts-for-developers/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKA, domaine Cluster Architecture, Installation and
# Configuration (25 %) : « Manage role based access control (RBAC) ». Le lab
# CKAD voisin donne des droits à une utilisatrice ; celui-ci en donne à une
# application, et la preuve se fait depuis son Pod, avec le jeton projeté.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: l-application-demarre-sous-son-identite
    label: "The application runs under its ServiceAccount"
    tests:
      - test_l_application_demarre_sous_son_identite
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/serviceaccounts-for-developers/
  - id: le-role-accorde-la-lecture-et-rien-de-plus
    label: "The Role grants reading the Pods and nothing more"
    tests:
      - test_le_role_accorde_la_lecture_et_rien_de_plus
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/serviceaccounts-for-developers/
  - id: le-binding-donne-le-role-au-serviceaccount
    label: "The RoleBinding gives this Role to the ServiceAccount"
    tests:
      - test_le_binding_donne_le_role_au_serviceaccount
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/serviceaccounts-for-developers/
  - id: depuis-le-pod-lister-les-pods-passe
    label: "From the Pod, listing the Pods is allowed"
    tests:
      - test_depuis_le_pod_lister_les_pods_passe
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/serviceaccounts-for-developers/
  - id: depuis-le-pod-tout-le-reste-est-refuse
    label: "From the Pod, everything else is denied"
    tests:
      - test_depuis_le_pod_tout_le_reste_est_refuse
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/serviceaccounts-for-developers/
  - id: le-pod-qui-n-appelle-pas-l-api-n-a-aucun-jeton
    label: "The Pod that never calls the API carries no token"
    tests:
      - test_le_pod_qui_n_appelle_pas_l_api_n_a_aucun_jeton
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/serviceaccounts-for-developers/
