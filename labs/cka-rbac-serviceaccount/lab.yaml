id: cka-rbac-serviceaccount
title: "Give an application an identity: ServiceAccount, Role, RoleBinding"
level: cluster-architecture-installation-configuration
description: |
  An application refuses to start because its ServiceAccount does not exist.
  Create it, grant it the right to read the Pods of its namespace and
  nothing else, then prove from inside the Pod, with its own token, that
  listing goes through and that deleting, reading Secrets or looking
  elsewhere are denied.
skills:
  - serviceaccount
  - role
  - rolebinding
  - rbac
  - least-privilege
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/serviceaccounts-developpeurs/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Cluster Architecture, Installation and
# Configuration (25 %) : « Manage role based access control (RBAC) ». Le lab
# CKAD voisin donne des droits à une utilisatrice ; celui-ci en donne à une
# application, et la preuve se fait depuis son Pod, avec le jeton projeté.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
