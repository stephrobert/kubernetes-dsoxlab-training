# Lab guidé de la leçon « Namespaces » du module « Les ressources de base » de
# la formation. Le challenge part d'une erreur courante : l'application
# inventaire créée dans default, faute de -n. L'apprenant la range dans stock,
# retire la copie de default, la joint depuis le Pod caisse d'un autre
# namespace par <service>.<namespace>, note le Pod qui répond (une valeur du
# cluster), et constate que le nom court échoue (geste enseigné par la leçon
# Services, qui précède).
#
# Il tourne sur le cluster kind « boutique », dans deux namespaces à lui
# (stock et caisse).
id: k8s-isoler-par-namespace
title: "Isolate an application in a namespace"
level: application-design
section: ckad
difficulty: beginner
description: |
  The inventaire application was created in default by mistake. Move it and
  its Service to the stock namespace, remove it from default, then from the
  caisse Pod of the caisse namespace reach it by its namespace-qualified name,
  record the Pod that answers, and record what the short name gives.
skills:
  - namespaces
  - kubectl-create-namespace
  - service-dns
  - kubectl-exec
distros:
  - debian13
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/namespaces/
lab_type: lab
estimated_time: 15m

certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: kind
      host: k8s-kind.lab
  default: kind

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: l-application-est-dans-son-namespace
    label: "The inventaire Deployment and Service are in stock, and no longer in default"
    tests:
      - test_inventaire_est_dans_stock_et_plus_rien_dans_default
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/namespaces/
  - id: le-nom-qualifie-repond
    label: "The caisse Pod reaches inventaire by its namespace-qualified name, and the answering Pod is recorded"
    tests:
      - test_caisse_joint_inventaire_par_son_nom_qualifie
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/namespaces/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-nom-court-echoue
    label: "From caisse, the short name inventaire fails, and the observation is recorded"
    tests:
      - test_le_nom_court_echoue_depuis_caisse_et_le_constat_est_consigne
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
