id: ckad-capstone-boutique
title: "Capstone: ship the shop, from the specification alone"
level: application-deployment
section: ckad
difficulty: advanced
description: |
  A full delivery, given as a specification rather than a walkthrough. Six
  requirements to satisfy in one namespace: configuration, secret, probes,
  identity, exposure and isolation. Nothing says which object to create, and
  the last test checks the only thing that matters: a frontend Pod reaches
  the shop, and a Pod that is not one does not.
skills:
  - deployment
  - configmap
  - secret
  - probes
  - security-context
  - service
  - networkpolicy
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
lab_type: capstone
estimated_time: 45m

# Un capstone ne vise pas UNE compétence du blueprint, il en croise plusieurs.
# Celui-ci couvre les cinq domaines du CKAD : Application Design and Build
# (20 %), Application Deployment (20 %), Application Environment,
# Configuration and Security (25 %), Application Observability (15 %) et
# Services and Networking (20 %).
#
# Ce que les micro-labs n'éprouvent pas, et qui est pourtant la moitié de
# l'examen : passer d'une tâche à l'autre sous contrainte, sans qu'on vous
# annonce le sujet de chacune.
certification_tags:
  - ckad

# Le seuil de l'examen CKAD est de 66 %. On le pose ici, faute de quoi
# `dsoxlab submit` ne rend aucun verdict : le moteur le dit sans détour, « un
# capstone sans seuil de réussite n'en est pas un ».
exam_passing_score: 66

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-catalogue-tourne-en-deux-exemplaires
    label: "The catalogue runs two replicas"
    tests:
      - test_le_catalogue_tourne_en_deux_exemplaires
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
  - id: le-message-vit-en-dehors-du-pod
    label: "The message lives outside the Pod"
    tests:
      - test_le_message_vit_en_dehors_du_pod
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
  - id: le-conteneur-recoit-vraiment-le-message
    label: "The container really receives the message"
    tests:
      - test_le_conteneur_recoit_vraiment_le_message
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
  - id: le-mot-de-passe-n-est-ni-dans-la-definition-ni-dans-l-environnement
    label: "The password is neither in the definition nor in the environment"
    tests:
      - test_le_mot_de_passe_n_est_ni_dans_la_definition_ni_dans_l_environnement
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
  - id: le-conteneur-lit-le-mot-de-passe-dans-un-fichier
    label: "The container reads the password from a file"
    tests:
      - test_le_conteneur_lit_le_mot_de_passe_dans_un_fichier
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
  - id: les-deux-sondes-sont-declarees
    label: "Both probes are declared"
    tests:
      - test_les_deux_sondes_sont_declarees
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
  - id: les-sondes-ne-font-pas-redemarrer-les-exemplaires
    label: "The probes do not restart the replicas"
    tests:
      - test_les_sondes_ne_font_pas_redemarrer_les_exemplaires
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
  - id: le-conteneur-ne-tourne-pas-en-root
    label: "The container does not run as root"
    tests:
      - test_le_conteneur_ne_tourne_pas_en_root
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
  - id: la-boutique-repond-au-nom-stable
    label: "The shop answers on its stable name"
    tests:
      - test_la_boutique_repond_au_nom_stable
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
  - id: seul-le-frontend-joint-la-boutique
    label: "Only the frontend reaches the shop"
    tests:
      - test_seul_le_frontend_joint_la_boutique
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/ckad/exercises/
