---
# Joué par `dsoxlab clean` : retire les deux namespaces du challenge, puis
# Traefik, ses CRD et sa GatewayClass. Le cluster reste, il est le socle commun
# des labs du catalogue.
- name: Nettoyer le challenge k8s-challenge-exposer-et-isoler
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer les namespaces du challenge
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace
        comptoir voisinage --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false

    - name: Retirer le contrôleur, les CRD et la politique d'admission
      ansible.builtin.include_tasks: ../../shared/traefik-retirer.yml
