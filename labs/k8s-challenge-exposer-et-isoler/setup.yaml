---
# Joué par `dsoxlab run` : le cluster kubeadm du catalogue (Calico applique
# les NetworkPolicies), Traefik avec la Gateway API, puis la situation du
# challenge dans comptoir et voisinage.
#
# La Gateway API est installée parce que l'énoncé laisse le choix de la route :
# un Ingress ou une HTTPRoute. Les deux passent par le même Traefik, exposé sur
# le NodePort 30080.
- name: Préparer le challenge k8s-challenge-exposer-et-isoler
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Installer le contrôleur, l'Ingress et la Gateway API
      ansible.builtin.include_tasks: ../../shared/traefik.yml
      vars:
        traefik_gateway_api: true

    - name: Poser la situation du challenge
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
