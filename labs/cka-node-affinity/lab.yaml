id: cka-node-affinity
title: "Placing with nodeAffinity: required constraint and preference"
level: workloads-scheduling
description: |
  Place a Deployment with a required node affinity on a label that accepts
  several values, add a weighted preference to it, then unblock a Pod that
  is waiting for a node which does not exist yet, by setting the label it
  demands. The tests read the node labels, the declared affinities and the
  actual node of every Pod.
skills:
  - nodeAffinity
  - requiredDuringScheduling
  - preferredDuringScheduling
  - node-labels
  - scheduling
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/affinity-toleration-taint/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Workloads and Scheduling (15 %) : les
# mécanismes de placement, nodeAffinity en particulier. Le lab hérité
# exigeait kubernetes.io/os=linux, contrainte que tout nœud satisfait ;
# ici la contrainte obligatoire porte sur un label que seul le worker a,
# ce qui rend son effet mesurable.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
