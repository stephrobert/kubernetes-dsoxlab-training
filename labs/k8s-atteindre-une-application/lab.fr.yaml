title: "Atteindre une application : expose et port-forward"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-expose-port-forward-proxy/#mettre-en-pratique
description: |
  Dans le namespace guichet, exposez le Deployment annonces par un Service sur
  le port 8081 vers le port 9376 de ses Pods, vérifiez qu'il compte ses endpoints,
  puis ouvrez un tunnel kubectl port-forward vers le Service et consignez le
  Pod qui répond à travers lui.

criteria:
  - id: le-service-a-les-bons-ports
    label: "Le Service annonces expose le port 8081 vers le port 9376 des Pods annonces"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-expose-port-forward-proxy/
  - id: le-service-compte-ses-endpoints
    label: "Le Service annonces compte les deux Pods annonces prêts comme endpoints"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-expose-port-forward-proxy/
  - id: le-tunnel-repond
    label: "Un tunnel port-forward vers le Service annonces répond sur le port local 19081 pendant la vérification"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-expose-port-forward-proxy/
  - id: la-reponse-du-tunnel-est-consignee
    label: "Le Pod qui répond par ce tunnel est consigné"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-expose-port-forward-proxy/
