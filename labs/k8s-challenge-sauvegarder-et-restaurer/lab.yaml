# Challenge du module Administrer le cluster du niveau 4, hébergé par la leçon
# « PKI du cluster » (KUBERN-13-05, décision D72). Sans procédure : une
# sauvegarde fraîche, une restauration d'etcd depuis la sauvegarde de la
# veille, un dépôt de manifestes à migrer, des certificats à renouveler.
# Noté sur l'état du cluster, un test par état demandé.
id: k8s-challenge-sauvegarder-et-restaurer
title: "Challenge: back up, restore and put a cluster back in order"
level: cluster-architecture-installation-configuration
section: cka
difficulty: advanced
description: |
  No procedure. Take a fresh etcd backup, restore etcd from the previous
  day's backup onto a new data directory, migrate a repository of manifests
  off removed APIs, and leave no control plane certificate close to expiry.
  Graded on the state of the cluster.
skills:
  - etcd
  - etcdctl
  - kubeadm
  - api-migration
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-pki/
lab_type: challenge
exam_passing_score: 70
estimated_time: 50m

certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: sauvegarde-fraiche
    label: "A fresh etcd backup photographs the state before the restore"
    tests:
      - test_une_sauvegarde_fraiche_photographie_l_etat_d_avant_la_restauration
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/backup-restore/
  - id: etcd-restaure
    label: "etcd runs on a restored data directory, and the cluster is healthy"
    tests:
      - test_etcd_tourne_sur_un_repertoire_restaure_et_le_cluster_est_sain
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/backup-restore/
  - id: uid-d-origine
    label: "The deleted objects are back with their original UIDs"
    tests:
      - test_les_objets_supprimes_sont_revenus_avec_leurs_uid
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/backup-restore/
  - id: objet-posterieur
    label: "The object written after the backup is gone"
    tests:
      - test_l_objet_ecrit_apres_la_sauvegarde_n_existe_plus
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/backup-restore/
  - id: api-migrees
    label: "The repository's manifests use current APIs and are applied"
    tests:
      - test_les_manifestes_du_depot_sont_migres_et_appliques
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/api-deprecations/
  - id: certificats
    label: "No control plane certificate expires within thirty days"
    tests:
      - test_aucun_certificat_n_expire_avant_trente_jours
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-pki/
