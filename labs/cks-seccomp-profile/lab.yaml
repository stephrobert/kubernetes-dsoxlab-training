id: cks-seccomp-profile
title: "Deny a system call to a container, and check it from the inside"
level: system-hardening
section: cks
difficulty: advanced
description: |
  A container that may call anything the kernel offers. Write a seccomp
  profile that refuses one family of system calls, apply it, and prove the
  confinement holds: the forbidden call fails from inside, and everything else
  still works.
skills:
  - seccomp
  - system-hardening
  - syscall-filtering
  - kubelet
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/seccomp/
lab_type: lab
estimated_time: 25m

# Compétence du blueprint CKS, domaine System Hardening (10 %) : « Minimize
# host OS footprint (reduce attack surface) ».
#
# Le profil vit sur le NŒUD, dans un répertoire que le kubelet est seul à
# connaître, et il n'est pas un objet Kubernetes. C'est la même famille que
# cks-apparmor-confiner-un-pod, et la même raison d'être des VM : un nœud en
# conteneur ne permet pas de poser un filtre d'appels système et de le
# vérifier.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-profil-refuse-la-famille-chmod
    label: "The profile refuses the whole chmod family"
    tests:
      - test_le_profil_refuse_la_famille_chmod
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/seccomp/
  - id: le-pod-tourne-et-declare-le-profil-local
    label: "The Pod runs and declares the local profile"
    tests:
      - test_le_pod_tourne_et_declare_le_profil_local
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/seccomp/
  - id: le-confinement-refuse-chmod-et-laisse-le-reste
    label: "The confinement refuses chmod and lets the rest through"
    tests:
      - test_le_confinement_refuse_chmod_et_laisse_le_reste
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/seccomp/
