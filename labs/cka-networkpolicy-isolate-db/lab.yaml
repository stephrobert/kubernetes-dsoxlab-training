id: cka-networkpolicy-isolate-db
title: "Isolate the database: only the backend gets in"
level: services-networking
section: cka
difficulty: intermediate
description: |
  Write the NetworkPolicy that lets nothing into the database but the backend
  of its own namespace, on its port. The tests attempt the connections: the
  one that must go through, the frontend one that must be blocked, the one
  from a Pod with the right label but in another namespace, and they check
  that the database can still reach out.
skills:
  - networkpolicy
  - ingress-rules
  - podSelector
  - network-isolation
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/#mettre-en-pratique
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Services and Networking (20 %) :
# « Define and enforce Network Policies ». Le lab hérité lisait le spec de
# la politique et une connexion dans chaque sens ; ici un Pod intrus, au bon
# label mais dans un autre namespace, doit rester dehors, ce qu'un
# namespaceSelector vide laisserait passer. Calico applique les politiques.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: la-politique-s-applique-a-la-base
    label: "The policy db-allow-backend applies to the database Pods"
    tests:
      - test_la_politique_s_applique_a_la_base
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: la-politique-controle-l-entree
    label: "The policy controls inbound traffic"
    tests:
      - test_la_politique_controle_l_entree
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: la-politique-laisse-entrer-le-backend-du-meme-namespace
    label: "The policy lets in the app=backend Pods of the same namespace"
    tests:
      - test_la_politique_laisse_entrer_le_backend_du_meme_namespace
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: la-politique-n-ouvre-que-le-port-5432-en-tcp
    label: "The policy opens only TCP port 5432"
    tests:
      - test_la_politique_n_ouvre_que_le_port_5432_en_tcp
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: le-backend-atteint-toujours-la-base
    label: "backend still reaches db on 5432"
    tests:
      - test_le_backend_atteint_toujours_la_base
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: le-frontend-est-bloque
    label: "frontend no longer reaches db"
    tests:
      - test_le_frontend_est_bloque
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: l-intrus-d-un-autre-namespace-est-bloque
    label: "intrus, in another namespace, no longer reaches db despite its label"
    tests:
      - test_l_intrus_d_un_autre_namespace_est_bloque
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: la-base-peut-toujours-sortir
    label: "The database can still make outbound connections"
    tests:
      - test_la_base_peut_toujours_sortir
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/

feedback: full
