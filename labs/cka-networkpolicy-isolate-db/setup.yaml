---
# Joué par `dsoxlab run` avant d'ouvrir la session : la base, ses deux
# voisins, l'intrus d'un autre namespace, et aucune politique. Le setup
# mesure que tout le monde atteint la base avant de rendre la main.
#
# Transposé de K8sExamLab, qui posait une base postgres et deux Pods
# busybox. L'intrus est ajouté : un podSelector seul ne vise que le
# namespace de la politique, et c'est ce que le lab doit prouver.
# Confronté à Kubernetes 1.37 et Calico le 2026-09-15.
- name: Préparer le lab cka-networkpolicy-isolate-db
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la base, ses voisins et l'intrus
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
