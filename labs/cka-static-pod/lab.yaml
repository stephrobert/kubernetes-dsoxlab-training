id: cka-static-pod
title: "Place a static Pod on a worker, without going through the API"
level: cluster-architecture-installation-configuration
section: cka
difficulty: intermediate
description: |
  Run a Pod that the worker's kubelet manages on its own, from a manifest
  dropped on the node, and see it appear in the API under its mirror name.
  The file must sit where the kubelet's own configuration says, and the
  worker's runtime must really be running the container.
skills:
  - static-pod
  - kubelet
  - mirror-pod
  - staticPodPath
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/#mettre-en-pratique
lab_type: lab
estimated_time: 10m

# Compétence du blueprint CKA, domaine Cluster Architecture, Installation and
# Configuration (25 %) : « Understand the role of the kubelet » et la
# mécanique des Pods statiques, sur laquelle repose tout le control plane
# kubeadm. La formation ne peut pas le prouver sur kind : le staticPodPath y
# est celui d'un conteneur, pas d'un nœud que l'on joint en ssh.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
      # Ce lab interroge k8s-w1.lab par l'API du cluster : il lui faut
      # donc ce noeud, et `roles` est le champ que le contrat prevoit pour
      # « les hotes additionnels utilises simultanement ». Sans lui,
      # `dsoxlab start` ne le provisionne pas depuis la 0.8.2, et le lab
      # echoue sur un noeud introuvable.
      roles:
        worker: k8s-w1.lab
    - name: w1
      host: k8s-w1.lab
      # Ce lab interroge k8s-cp.lab par l'API du cluster : il lui faut
      # donc ce noeud, et `roles` est le champ que le contrat prevoit pour
      # « les hotes additionnels utilises simultanement ». Sans lui,
      # `dsoxlab start` ne le provisionne pas depuis la 0.8.2, et le lab
      # echoue sur un noeud introuvable.
      roles:
        control_plane: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

# Un critère par état demandé, et la leçon où le réviser.
criteria:
  - id: le-manifeste-est-ou-le-kubelet-le-cherche
    label: "The static-web manifest is in the staticPodPath of the worker's kubelet"
    tests:
      - test_le_manifeste_est_dans_le_repertoire_du_kubelet
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
  - id: le-pod-miroir-vient-d-un-fichier
    label: "The mirror Pod comes from a file and belongs to the worker Node"
    tests:
      - test_le_pod_miroir_vient_d_un_fichier
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
  - id: le-pod-statique-tourne
    label: "The static Pod is Running with the required image and port"
    tests:
      - test_le_pod_statique_tourne
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
  - id: le-runtime-du-worker-execute-le-conteneur
    label: "The worker's runtime really runs the web container"
    tests:
      - test_le_runtime_du_worker_execute_le_conteneur
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
