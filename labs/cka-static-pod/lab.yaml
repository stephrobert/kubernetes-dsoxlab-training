id: cka-static-pod
title: "Poser un Pod statique sur un worker, sans passer par l'API"
level: cluster-architecture-installation-configuration
description: |
  Faire tourner un Pod que le kubelet du worker gère seul, à partir d'un
  manifeste déposé sur le nœud, et le voir apparaître dans l'API sous son
  nom de miroir. Le fichier doit être au bon endroit, celui que la
  configuration du kubelet désigne, et le runtime du worker doit
  réellement exécuter le conteneur.
skills:
  - static-pod
  - kubelet
  - mirror-pod
  - staticPodPath
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
lab_type: lab
estimated_time: 10m

# Compétence du blueprint CKA, domaine Cluster Architecture, Installation and
# Configuration (25 %) : « Understand the role of the kubelet » et la
# mécanique des Pods statiques, sur laquelle repose tout le control plane
# kubeadm. La formation ne peut pas le prouver sur kind : le staticPodPath y
# est celui d'un conteneur, pas d'un nœud que l'on joint en ssh.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
    - name: w1
      host: k8s-w1.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
