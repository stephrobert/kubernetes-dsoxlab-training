id: cks-capstone-enclave
title: "Capstone: open an enclave for a team you do not trust"
level: minimize-vulnerabilities
section: cks
difficulty: advanced
description: |
  An outside team needs room in your cluster. Give them one that stays safe
  even if they are not: the cluster itself must refuse what they should not
  deploy, their identity must be able to do almost nothing, and nothing
  outside the enclave may reach what runs inside it.
skills:
  - pod-security-admission
  - rbac
  - serviceaccount
  - networkpolicy
  - securitycontext
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cks/exercises/
lab_type: capstone
estimated_time: 45m

# Un capstone ne vise pas UNE compétence du blueprint, il en croise plusieurs.
# Celui-ci couvre trois des six domaines du CKS : Minimize Microservice
# Vulnerabilities (20 %), Cluster Hardening (15 %) et Cluster Setup (15 %),
# soit 50 % de l'épreuve.
#
# Ce que les micro-labs n'éprouvent pas, et qui est pourtant l'essentiel du
# CKS : décider CE QU'IL FAUT POSER. Un lab nommé « networkpolicy-default-deny »
# a déjà nommé l'objet avant que le candidat n'ouvre un terminal. Ici, aucune
# des cinq exigences ne nomme un objet Kubernetes.
certification_tags:
  - cks

# Le seuil de l'examen CKS est de 67 %, arrondi ici comme pour les deux autres
# capstones du catalogue : quatre exigences sur cinq.
exam_passing_score: 66

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: l-espace-refuse-une-charge-privilegiee
    label: "The namespace refuses a privileged workload"
    tests:
      - test_l_espace_refuse_une_charge_privilegiee
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cks/exercises/
  - id: l-identite-existe-et-son-jeton-ne-se-monte-pas
    label: "The identity exists, and its token is not mounted"
    tests:
      - test_l_identite_existe_et_son_jeton_ne_se_monte_pas
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cks/exercises/
  - id: l-identite-peut-lister-les-charges-et-rien-d-autre
    label: "The identity can list workloads, and nothing else"
    tests:
      - test_l_identite_peut_lister_les_charges_et_rien_d_autre
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cks/exercises/
  - id: le-coffre-tourne-et-emploie-l-identite
    label: "The vault runs and uses the identity"
    tests:
      - test_le_coffre_tourne_et_emploie_l_identite
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cks/exercises/
  - id: seul-l-appelant-declare-atteint-le-coffre
    label: "Only the declared caller reaches the vault"
    tests:
      - test_seul_l_appelant_declare_atteint_le_coffre
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cks/exercises/
