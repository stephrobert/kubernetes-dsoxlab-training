---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose le namespace et
# un Pod qui a des logs à lire, et retire les droits qu'un passage précédent
# aurait laissés.
#
# Transposé de K8sExamLab, où le lab n'avait pas de setup et demandait un
# ConfigMap « evidence » qui ne prouvait rien : supprimé, kubectl auth can-i
# suffit. Confronté à Kubernetes 1.37 le 2026-09-15.
- name: Préparer le lab ckad-rbac-role-rolebinding
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
