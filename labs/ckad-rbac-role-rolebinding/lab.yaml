id: ckad-rbac-role-rolebinding
title: "Grant read-only access to Pods with RBAC"
level: application-environment
description: |
  Let a user read the Pods of a namespace and their logs, and nothing more:
  no creating, no deleting, no looking into the other namespaces. Prove both
  sides with kubectl auth can-i, what is allowed and what stays denied.
skills:
  - rbac
  - role
  - rolebinding
  - auth-can-i
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rbac/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Environment, Configuration
# and Security (25 %) : « Understand authentication, authorization and
# admission control ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
