title: "Écrire et valider un manifeste"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ecrire-manifests/#mettre-en-pratique
description: |
  Réparez le manifeste multi-documents d'un collègue (une ConfigMap, un
  Deployment et un Service) jusqu'à ce que le serveur d'API l'accepte, que
  chaque objet nomme son namespace et que le Service trouve ses Pods, puis
  appliquez-le pour mettre à jour en place l'ancienne version du Deployment,
  sans la recréer.

criteria:
  - id: fichier-multi-documents
    label: "api.yaml porte les trois objets et le serveur d'API l'accepte"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ecrire-manifests/
  - id: namespace-dans-le-fichier
    label: "Le fichier nomme son namespace et rien n'a atterri dans default"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ecrire-manifests/
  - id: deployment-disponible
    label: "api a deux réplicas disponibles sur l'image demandée"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ecrire-manifests/
  - id: service-relie
    label: "Le Service api trouve les deux Pods"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ecrire-manifests/
  - id: configuration-par-configmap
    label: "Le conteneur reçoit sa configuration de api-config"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ecrire-manifests/
  - id: corrige-sans-recreer
    label: "api est mis à jour en place, sans avoir été recréé"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ecrire-manifests/
