# Lab guidé de la leçon « Écrire des Manifests » (KUBERN-06-02) du module
# « Déployer ses applications ». Le challenge part d'un manifeste fourni et
# faux (namespace oublié, valeur que seul le serveur refuse, sélecteur qui ne
# trouve aucun Pod) : l'apprenant le valide côté serveur, le répare, puis
# l'applique pour mettre à jour en place l'ancienne version d'api, sans la
# recréer. Avant le 2026-11-20, il déroulait le scénario de la leçon.
id: k8s-ecrire-un-manifeste
title: "Write and validate a manifest"
level: application-deployment
section: ckad
difficulty: intermediate
description: |
  Repair a colleague's multi-document manifest (a ConfigMap, a Deployment and
  a Service) until the API server accepts it, every object names its
  namespace and the Service finds its Pods, then apply it to update the
  running old version of the Deployment in place, without recreating it.
skills:
  - kubernetes-manifest
  - dry-run-server
  - multi-document-yaml
  - kubectl-patch
distros:
  - debian13
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/write-kubernetes-manifests/
lab_type: lab
estimated_time: 30m

certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: kind
      host: k8s-kind.lab
  default: kind

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: fichier-multi-documents
    label: "api.yaml holds the three objects and the API server accepts it"
    tests:
      - test_le_fichier_porte_les_trois_objets_et_le_serveur_l_accepte
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/write-kubernetes-manifests/
  - id: namespace-dans-le-fichier
    label: "The file names its namespace and nothing landed in default"
    tests:
      - test_le_fichier_nomme_son_namespace_et_rien_n_est_dans_default
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/write-kubernetes-manifests/
  - id: deployment-disponible
    label: "api has two available replicas on the requested image"
    tests:
      - test_api_a_deux_replicas_disponibles_sur_l_image_demandee
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/write-kubernetes-manifests/
  - id: service-relie
    label: "The api Service finds the two Pods"
    tests:
      - test_le_service_api_trouve_les_deux_pods
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/write-kubernetes-manifests/
  - id: configuration-par-configmap
    label: "The container receives its configuration from api-config"
    tests:
      - test_le_conteneur_recoit_sa_configuration_de_api_config
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/write-kubernetes-manifests/
  - id: corrige-sans-recreer
    label: "api is updated in place, without being recreated"
    tests:
      - test_api_est_mis_a_jour_sans_avoir_ete_recree
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/write-kubernetes-manifests/
