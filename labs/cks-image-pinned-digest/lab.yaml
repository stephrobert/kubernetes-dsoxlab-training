id: cks-image-pinned-digest
title: "Épingler une image par son digest, et prouver que le tag ne suffit pas"
level: supply-chain-security
section: cks
difficulty: intermediate
description: |
  A Deployment that trusts a mutable tag. Pin it to the immutable digest of
  the image it actually runs, and prove the pin holds: the declared digest
  must match what the runtime resolved, not just look like one.
skills:
  - supply-chain-security
  - image-digest
  - immutable-reference
  - crictl
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/supply-chain-security/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKS, domaine Supply Chain Security (20 %) :
# « Minimize base image footprint » et la référence immuable qui va avec. Ce
# domaine pèse un cinquième de l'épreuve et n'avait aucun lab.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
