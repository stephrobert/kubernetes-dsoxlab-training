id: cks-image-pinned-digest
title: "Pin an image by digest, and check the tag is not enough"
level: supply-chain-security
section: cks
difficulty: intermediate
description: |
  A Deployment that trusts a mutable tag. Pin it to the immutable digest of
  the image it actually runs, and prove the pin holds: the declared digest
  must match what the runtime resolved, not just look like one.
skills:
  - supply-chain-security
  - image-digest
  - immutable-reference
  - crictl
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKS, domaine Supply Chain Security (20 %) :
# « Minimize base image footprint » et la référence immuable qui va avec. Ce
# domaine pèse un cinquième de l'épreuve et n'avait aucun lab.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: l-image-n-est-plus-referencee-par-un-tag
    label: "The image is referenced by its digest, no longer by a tag"
    tests:
      - test_l_image_n_est_plus_referencee_par_un_tag
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
  - id: c-est-toujours-l-image-demandee
    label: "It is still the requested nginx image"
    tests:
      - test_c_est_toujours_l_image_demandee
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
  - id: le-digest-declare-est-celui-que-le-noeud-execute
    label: "The declared digest is the one the node runs"
    tests:
      - test_le_digest_declare_est_celui_que_le_noeud_execute
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
