id: cks-api-server-hardening
title: "Close the API server profiler, without closing the API"
level: cluster-hardening
section: cks
difficulty: advanced
description: |
  The API server exposes its Go profiler to anyone who can reach it, and a
  kubeadm cluster leaves it on. Close it and drop the CBC cipher suites, then prove
  both halves: the profiler answers 404, and the cluster still works.
skills:
  - api-server
  - profiling
  - tls
  - static-pod
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/cis-benchmark/
lab_type: lab
estimated_time: 25m

# Compétence du blueprint CKS, domaine Cluster Hardening (15 %) : « Restrict
# access to Kubernetes API ».
#
# Ce lab modifie le manifeste statique de l'API server, comme
# cks-audit-log-policy. C'est le genre de geste qu'un cluster en conteneur ne
# permet pas d'éprouver, et une des raisons d'être des VM de ce catalogue.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-manifeste-porte-les-deux-flags
    label: "The manifest carries the two flags, and nothing that breaks the API server"
    tests:
      - test_le_manifeste_porte_les_deux_flags
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/cis-benchmark/
  - id: le-profileur-est-ferme-et-l-api-sert-toujours
    label: "The profiler is closed, and the API still serves"
    tests:
      - test_le_profileur_est_ferme_et_l_api_sert_toujours
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/cis-benchmark/
  - id: l-api-server-refuse-les-suites-cbc
    label: "The API server refuses CBC suites and keeps AEAD suites"
    tests:
      - test_l_api_server_refuse_les_suites_cbc
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/cis-benchmark/
