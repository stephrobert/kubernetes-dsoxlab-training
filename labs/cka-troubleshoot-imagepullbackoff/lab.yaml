id: cka-troubleshoot-imagepullbackoff
title: "Get a Pod out of ImagePullBackOff"
level: troubleshooting
section: cka
difficulty: beginner
description: |
  A Pod does not start because its image will not download. Read the runtime's
  exact message in the events, fix the image reference, and prove that the
  server answers.
skills:
  - troubleshooting
  - imagepullbackoff
  - images
  - events
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/imagepullbackoff/
lab_type: lab
estimated_time: 10m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Troubleshoot
# clusters and nodes » et « Manage and evaluate container output streams ».
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-pod-tourne
    label: "The Pod runs, its container ready"
    tests:
      - test_le_pod_tourne
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/imagepullbackoff/
  - id: l-image-est-nginx-et-a-ete-tiree
    label: "The image is nginx, and it was really pulled"
    tests:
      - test_l_image_est_nginx_et_a_ete_tiree
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/imagepullbackoff/
  - id: le-serveur-repond
    label: "The server answers"
    tests:
      - test_le_serveur_repond
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/imagepullbackoff/
