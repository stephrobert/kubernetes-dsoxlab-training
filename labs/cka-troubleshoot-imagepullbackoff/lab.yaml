id: cka-troubleshoot-imagepullbackoff
title: "Get a Pod out of ImagePullBackOff"
level: troubleshooting
section: cka
difficulty: beginner
description: |
  A Pod does not start because its image will not download. Read the runtime's
  exact message in the events, fix the image reference, and prove that the
  server answers.
skills:
  - troubleshooting
  - imagepullbackoff
  - images
  - events
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/imagepullbackoff-kubernetes/
lab_type: lab
estimated_time: 10m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Troubleshoot
# clusters and nodes » et « Manage and evaluate container output streams ».
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
