---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit, un Pod dont l'image ne se télécharge pas.
#
# Transposé de K8sExamLab. Confronté à Kubernetes 1.37 le 2026-09-14 :
# l'attestation du blog y a mesuré que ErrImagePull et ImagePullBackOff
# ALTERNENT, le setup attend donc l'un ou l'autre.
- name: Préparer le lab cka-troubleshoot-imagepullbackoff
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, un cluster kubeadm à un nœud
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
