title: "Revenir en arrière sur un déploiement bloqué, puis livrer la bonne version"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/#mettre-en-pratique
description: |
  Une mise à jour est partie avec un nom d'image faux et le déploiement est
  bloqué. Remettre en service la révision qui marchait, puis livrer l'image
  correcte et porter une cause de changement sur le Deployment. Les tests
  lisent les ReplicaSets qui appartiennent au Deployment et les numéros de
  révision exacts attendus : un Deployment supprimé puis recréé n'a plus
  l'historique qu'ils lisent.

criteria:
  - id: le-deploiement-demande-la-bonne-image
    label: "Le Deployment webapp demande l'image nginx:1.30.6"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: les-trois-replicas-sont-disponibles-et-a-jour
    label: "Les trois replicas sont disponibles et à jour"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: aucun-pod-n-est-en-erreur-d-image
    label: "Aucun Pod de webapp n'est resté en erreur d'image"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: l-historique-du-deploiement-est-intact
    label: "Une fois la livraison faite, l'historique garde encore la version qui marchait et la fautive"
    lessons:
