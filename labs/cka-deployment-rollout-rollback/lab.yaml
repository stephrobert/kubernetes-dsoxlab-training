id: cka-deployment-rollout-rollback
title: "Roll back a stuck rollout, then ship the right version"
level: workloads-scheduling
description: |
  An update went out with a wrong image name and the rollout is stuck. Go
  back to the revision that worked through the Deployment history, then ship
  the correct image with a change cause. The tests read the ReplicaSets and
  their revision numbers: they tell the story of what happened, and a
  Deployment recreated from scratch tells no story at all.
skills:
  - deployment
  - rollout
  - rollback
  - replicaset
  - revision-history
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Workloads and Scheduling (15 %) :
# « Understand application deployments and how to perform rolling update and
# rollbacks ». Le lab CKAD voisin règle maxSurge et maxUnavailable ; celui-ci
# part d'un déploiement bloqué, la situation de l'examen.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
