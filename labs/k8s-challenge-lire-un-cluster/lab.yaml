# Challenge du module Architecture de la formation Kubernetes.
#
# `lab_type: challenge` : il ÉVALUE, sans guidage. Rien n'y est réexpliqué :
# les trois leçons du module ont enseigné qui porte quelle fonction dans un
# cluster, le control plane et ses quatre composants, puis les nœuds worker et
# leur runtime. Ici, l'apprenant le retrouve sur un cluster vivant, et le
# consigne dans un relevé que les tests confrontent à l'état réel.
#
# Le cluster `architecture` reprend la topologie multi-nœuds de référence de
# la formation (règle 11) : un control plane et trois workers étiquetés par
# zone. Sans worker, l'état « runtime de chaque worker » n'aurait rien à lire,
# et le Pod témoin atterrirait sur le control plane.
id: k8s-challenge-lire-un-cluster
title: "Read a cluster: which component does what"
level: kubernetes-fundamentals
section: kcna
difficulty: beginner
description: |
  On a four-node kind cluster, find which Node carries the control plane, name
  the Pods of its four components with their role, read the container runtime
  of each worker, prove where the scheduler placed a Pod, and find which
  component does not act on a Deployment whose Pods never start.
skills:
  - kubectl-get-nodes
  - kubectl-describe
  - control-plane-components
  - container-runtime
  - scheduler-events
  - replicaset-controller
distros:
  - debian13
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
lab_type: challenge
exam_passing_score: 70
estimated_time: 30m

certification_tags:
  - kcna
  - kcsa

runtime:
  type: vm
  targets:
    - name: kind
      host: k8s-kind.lab
  default: kind

validation:
  functional: true
  persistence_after_reboot: false

# Un critère par état demandé, et les leçons où le réviser. Les rôles des
# composants sont vérifiés par mots-clés tolérants, en français comme en
# anglais : on note l'appariement composant et fonction, jamais une phrase.
criteria:
  - id: le-noeud-du-control-plane-est-consigne
    label: "The Node that carries the control plane is recorded"
    tests:
      - test_le_noeud_du_control_plane_est_consigne
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/architecture/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/control-plane/
  - id: les-composants-du-control-plane-sont-consignes
    label: "The Pods of the four control plane components are recorded with their role"
    tests:
      - test_les_quatre_composants_du_control_plane_sont_consignes_avec_leur_role
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/control-plane/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/architecture/
  - id: le-runtime-de-chaque-worker-est-consigne
    label: "The container runtime of every worker Node is recorded"
    tests:
      - test_le_runtime_de_chaque_worker_est_consigne
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
  - id: le-placement-du-pod-temoin-est-prouve
    label: "The Node that received the temoin Pod is recorded, with the Scheduled event"
    tests:
      - test_le_noeud_du_pod_temoin_est_prouve_par_l_evenement_scheduled
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/control-plane/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
  - id: le-maillon-qui-n-agit-pas-est-identifie
    label: "For file-attente, the component that acted and the one that does not act are recorded"
    tests:
      - test_le_maillon_qui_n_agit_pas_est_identifie
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/control-plane/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/architecture/
