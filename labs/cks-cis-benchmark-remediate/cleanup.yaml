---
# Joué par `dsoxlab clean` : rend aux fichiers du kubelet du worker leurs
# droits d'installation, puis retire le namespace d'audit.
#
# Ces fichiers vivent sur le nœud, hors du cluster, et le validateur ne les
# photographie pas. Les laisser resserrés ferait passer le premier test du
# prochain passage avant tout travail.
- name: Nettoyer le lab cks-cis-benchmark-remediate
  hosts: lab_target
  become: true
  vars:
    noeud_audite: k8s-w1.lab
  tasks:
    - name: Rendre aux fichiers du kubelet du worker leurs droits d'installation
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0644"
      loop:
        - /lib/systemd/system/kubelet.service
        - /var/lib/kubelet/config.yaml
      delegate_to: "{{ noeud_audite }}"
      failed_when: false

    - name: Supprimer le namespace d'audit
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace conformite
        --ignore-not-found --wait=false
      changed_when: true
      failed_when: false
