---
# Joué par `dsoxlab clean` : rend les trois manifestes du control plane tels
# qu'ils étaient, puis retire le namespace d'audit.
#
# Les trois composants sont des Pods STATIQUES : leurs fichiers vivent sur le
# nœud, hors du cluster, et le validateur ne les photographie pas. Les laisser
# modifiés ferait passer le premier test du prochain passage avant tout
# travail.
- name: Nettoyer le lab cks-cis-benchmark-remediate
  hosts: lab_target
  become: true
  tasks:
    - name: Restaurer les manifestes du control plane
      ansible.builtin.copy:
        src: "/var/backups/{{ item }}.avant-cis.yaml"
        dest: "/etc/kubernetes/manifests/{{ item }}.yaml"
        remote_src: true
        mode: "0600"
      loop:
        - kube-apiserver
        - kube-controller-manager
        - kube-scheduler
      failed_when: false

    - name: Attendre que l'API server réponde à nouveau
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /healthz
      register: sante
      until: sante.rc == 0
      retries: 40
      delay: 3
      changed_when: false
      failed_when: false

    - name: Attendre que les Pods du control plane soient Running
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system
        get pods -l tier=control-plane
        -o jsonpath={.items[*].status.phase}
      register: phases
      until: phases.stdout and 'Pending' not in phases.stdout
      retries: 40
      delay: 3
      changed_when: false
      failed_when: false

    - name: Supprimer le namespace d'audit
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace conformite
        --ignore-not-found --wait=false
      changed_when: true
      failed_when: false
