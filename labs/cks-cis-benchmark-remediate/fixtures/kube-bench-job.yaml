apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: conformite
spec:
  backoffLimit: 1
  template:
    spec:
      nodeName: k8s-w1.lab
      hostPID: true
      restartPolicy: Never
      containers:
        - name: kube-bench
          image: aquasec/kube-bench:v0.16.0@sha256:75506f222d1eb6ce2a751a5533bdc0a3b54c898e2e49e7751d0ee22cfb862679
          command: ["kube-bench", "run", "--targets", "node", "--json"]
          volumeMounts:
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: lib-systemd
              mountPath: /lib/systemd
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: usr-bin
              mountPath: /usr/local/mount-from-host/bin
              readOnly: true
      volumes:
        - name: var-lib-kubelet
          hostPath: {path: /var/lib/kubelet}
        - name: etc-systemd
          hostPath: {path: /etc/systemd}
        - name: lib-systemd
          hostPath: {path: /lib/systemd}
        - name: etc-kubernetes
          hostPath: {path: /etc/kubernetes}
        - name: usr-bin
          hostPath: {path: /usr/bin}
