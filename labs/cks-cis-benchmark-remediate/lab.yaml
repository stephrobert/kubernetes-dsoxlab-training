id: cks-cis-benchmark-remediate
title: "Bring down a CIS audit count, and check it with a second audit"
level: cluster-setup
section: cks
difficulty: advanced
description: |
  kube-bench audits a worker against the CIS benchmark and fails two checks on
  a stock kubeadm cluster. Fix these two checks, which share one cause, then
  prove it the only honest way: run the audit again and count.
skills:
  - cis-benchmark
  - kube-bench
  - worker-node
  - remediation
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/cis-benchmark/
lab_type: lab
estimated_time: 30m

# Compétence du blueprint CKS, domaine Cluster Setup (15 %) : « Use CIS
# benchmark to review the security configuration of Kubernetes components ».
#
# kube-bench n'est pas dans mise, contrairement à trivy et cosign. Il n'en a
# pas besoin : il tourne comme Job DANS le cluster, avec les répertoires du
# nœud montés en lecture seule. C'est aussi ainsi qu'on l'emploie en
# production, et cela évite d'installer quoi que ce soit sur le nœud.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
      # Le worker audité : kube-bench tourne dessus, et la remédiation s'y
      # joue. Déclaré en rôle pour que `start` le monte avec le control plane.
      roles:
        worker: k8s-w1.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: les-deux-controles-vises-passent
    label: "The two targeted CIS controls pass on the replayed audit"
    tests:
      - test_les_deux_controles_vises_passent
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/cis-benchmark/
  - id: le-total-baisse-et-le-noeud-reste-pret
    label: "The failure count drops, and the worker stays Ready"
    tests:
      - test_le_total_baisse_et_le_noeud_reste_pret
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/cis-benchmark/
