id: ckad-troubleshoot-crashloop
title: "Three Pods in CrashLoopBackOff, three causes"
level: application-observability
section: ckad
difficulty: intermediate
description: |
  Three Pods restart in a loop for three different reasons: a command that
  does not exist, a missing environment variable, a memory limit set too
  low. Read for each one what kills it, fix it, and prove that all three
  hold.
skills:
  - troubleshooting
  - crashloopbackoff
  - oomkilled
  - logs
  - events
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Observability and
# Maintenance (15 %) : « Utilize container logs » et « Debugging in
# Kubernetes ». Le lab CKA cka-troubleshoot-crashloopbackoff traite une
# panne de configuration sur un Deployment ; celui-ci fait lire trois
# diagnostics différents, dont un OOMKilled que seul le kubelet raconte.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: bad-command-tourne
    label: "bad-command runs without restarting"
    tests:
      - test_bad_command_tourne
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
  - id: missing-env-tourne
    label: "missing-env runs, with the variable it requires"
    tests:
      - test_missing_env_tourne
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
  - id: oom-killed-tourne-avec-une-limite-suffisante
    label: "oom-killed runs, with a sufficient memory limit"
    tests:
      - test_oom_killed_tourne_avec_une_limite_suffisante
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
