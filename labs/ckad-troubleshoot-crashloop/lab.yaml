id: ckad-troubleshoot-crashloop
title: "Three Pods in CrashLoopBackOff, three causes"
level: application-observability
description: |
  Three Pods restart in a loop for three different reasons: a command that
  does not exist, a missing environment variable, a memory limit set too
  low. Read for each one what kills it, fix it, and prove that all three
  hold.
skills:
  - troubleshooting
  - crashloopbackoff
  - oomkilled
  - logs
  - events
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/crashloopbackoff-kubernetes/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Observability and
# Maintenance (15 %) : « Utilize container logs » et « Debugging in
# Kubernetes ». Le lab CKA cka-troubleshoot-crashloopbackoff traite une
# panne de configuration sur un Deployment ; celui-ci fait lire trois
# diagnostics différents, dont un OOMKilled que seul le kubelet raconte.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
