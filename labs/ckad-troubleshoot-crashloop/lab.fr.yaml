title: "Trois Pods en CrashLoopBackOff, trois causes"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/crashloopbackoff-kubernetes/
description: |
  Trois Pods redémarrent en boucle pour trois raisons différentes : une
  commande qui n'existe pas, une variable d'environnement absente, une
  limite de mémoire trop basse. Lire pour chacun ce qui le tue, le
  corriger, et prouver que les trois tiennent.

criteria:
  - id: bad-command-tourne
    label: "bad-command tourne sans redémarrer"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/crashloopbackoff-kubernetes/
  - id: missing-env-tourne
    label: "missing-env tourne, avec la variable qu'il exige"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/crashloopbackoff-kubernetes/
  - id: oom-killed-tourne-avec-une-limite-suffisante
    label: "oom-killed tourne, avec une limite de mémoire suffisante"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/crashloopbackoff-kubernetes/
