id: ckad-pod-resources-labels
title: "A two-container Pod, with budgets, labels and an annotation"
level: application-design
section: ckad
difficulty: beginner
description: |
  Write by hand a Pod with two containers, each with its own requests and
  limits, with labels and an annotation, and prove from inside each container
  that the memory limit is the one the kernel enforces.
skills:
  - pods
  - resources
  - labels
  - annotations
  - multi-container
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/requests-limits/
lab_type: lab
estimated_time: 10m

# Compétence du blueprint CKAD, domaine Application Design and Build (20 %) :
# « Understand multi-container Pod design patterns », et Application
# Environment : « Understand requests, limits, quotas ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
