---
# Joué par `dsoxlab clean` : ne laisse rien derrière soi. Le cluster, lui,
# reste en place, il est le socle commun de tous les labs du catalogue.
- name: Nettoyer le lab cks-apparmor-confiner-un-pod
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace de travail
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace
        confinement --ignore-not-found --wait=false
      changed_when: true
      failed_when: false

    - name: Décharger le profil AppArmor
      ansible.builtin.command: apparmor_parser -R /etc/apparmor.d/k8s-refuser-ecriture
      changed_when: false
      failed_when: false

    - name: Retirer le fichier de profil
      ansible.builtin.file:
        path: /etc/apparmor.d/k8s-refuser-ecriture
        state: absent
