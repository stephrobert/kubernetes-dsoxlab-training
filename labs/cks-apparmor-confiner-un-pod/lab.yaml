id: cks-apparmor-confiner-un-pod
title: "Confine a Pod with an AppArmor profile"
level: system-hardening
description: |
  Load an AppArmor profile on the node, apply it to a container through the
  securityContext field, and prove that the confinement holds by watching a
  write the profile forbids fail.
skills:
  - apparmor
  - securitycontext
  - node-hardening
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/apparmor/
lab_type: lab
estimated_time: 25m

# Compétence du blueprint CKS, domaine System Hardening (10 %), citée mot pour
# mot : « Appropriately use kernel hardening tools such as AppArmor, seccomp ».
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
