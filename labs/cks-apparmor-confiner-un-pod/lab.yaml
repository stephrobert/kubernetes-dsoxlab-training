id: cks-apparmor-confiner-un-pod
title: "Confine a Pod with an AppArmor profile"
level: system-hardening
section: cks
difficulty: advanced
description: |
  Load an AppArmor profile on the node, apply it to a container through the
  securityContext field, and prove that the confinement holds by watching a
  write the profile forbids fail.
skills:
  - apparmor
  - securitycontext
  - node-hardening
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/apparmor/
lab_type: lab
estimated_time: 25m

# Compétence du blueprint CKS, domaine System Hardening (10 %), citée mot pour
# mot : « Appropriately use kernel hardening tools such as AppArmor, seccomp ».
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: profil-charge-en-enforce
    label: "The profile is loaded in enforce mode"
    tests:
      - test_profil_charge_en_enforce
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/apparmor/
  - id: pod-en-marche
    label: "The Pod runs"
    tests:
      - test_pod_en_marche
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/apparmor/
  - id: profil-declare-dans-le-security-context
    label: "The profile is declared in the securityContext"
    tests:
      - test_profil_declare_dans_le_security_context
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/apparmor/
  - id: ecriture-refusee-et-lecture-permise
    label: "Writing is refused, reading still works"
    tests:
      - test_ecriture_refusee_et_lecture_permise
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/apparmor/
