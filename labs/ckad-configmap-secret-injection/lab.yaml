id: ckad-configmap-secret-injection
title: "Inject configuration and secrets into a Pod"
level: application-environment
section: ckad
difficulty: beginner
description: |
  Give an application its configuration through environment variables and
  through a mounted file, and its credentials through a Secret, without ever
  writing a password in the Pod manifest. Prove, from inside the container,
  that everything arrived.
skills:
  - configmap
  - secret
  - environment-variables
  - volume-mount
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/configmaps/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Environment, Configuration
# and Security (25 %, le plus lourd des cinq) : « Understand ConfigMaps »,
# « Understand Secrets ». Le lab hérité ckad-configmaps-secrets, issue #16,
# couvrait un sous-ensemble de celui-ci : fermé en doublon.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
