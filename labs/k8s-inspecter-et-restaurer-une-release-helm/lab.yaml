id: k8s-inspecter-et-restaurer-une-release-helm
title: "Inspect a failed Helm release and restore it"
level: application-deployment
section: ckad
difficulty: intermediate
description: |
  The release vitrine (podinfo chart) failed twice when it was upgraded. Find
  the latest 6.14 version of the chart with a filtered search, name the
  failed revisions from the history, go back to the last healthy revision,
  not to the previous one, then make the chart's tests pass on it.
skills:
  - helm
  - helm-history
  - helm-rollback
  - helm-test
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/tools/helm/helm-command-reference/
lab_type: lab
estimated_time: 20m

# Lab guidé de la leçon KUBERN-06-13 « La commande helm » (règle 17, issue
# #218). Blueprint CKAD, domaine Application Deployment : « Use the Helm
# package manager to deploy existing packages ». Helm 4.3.2 et chart podinfo
# 6.16.0 puis 6.17.0, dernières versions mesurées le 2026-11-16.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: derniere-version
    label: "derniere-version.txt holds the latest 6.14 version of the podinfo chart, as a filtered helm search repo gives it"
    tests:
      - test_la_derniere_version_du_chart_est_relevee
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/tools/helm/helm-command-reference/
  - id: revision-en-echec
    label: "revisions-en-echec.txt names every failed revision of the history"
    tests:
      - test_les_revisions_en_echec_sont_nommees
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/tools/helm/helm-command-reference/
  - id: retour-arriere
    label: "The last revision is a deployed rollback to the last healthy revision, and the application is available"
    tests:
      - test_la_release_est_revenue_a_la_revision_saine
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/tools/helm/helm-command-reference/
  - id: tests-du-chart
    label: "The chart's tests succeeded on the current revision"
    tests:
      - test_les_tests_du_chart_passent
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/tools/helm/helm-command-reference/

feedback: full
