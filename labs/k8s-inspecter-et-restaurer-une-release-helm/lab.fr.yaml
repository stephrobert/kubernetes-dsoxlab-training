title: "Inspecter une release Helm en échec et la restaurer"
description: |
  La release vitrine (chart podinfo) a échoué lors de sa montée de version.
  Trouvez la dernière version du chart par une recherche, nommez la révision
  en échec d'après l'historique, revenez à la dernière révision saine, puis
  faites passer les tests du chart sur elle.
criteria:
  - id: derniere-version
    label: "derniere-version.txt porte la dernière version du chart podinfo, telle que helm search repo la donne"
  - id: revision-en-echec
    label: "revision-en-echec.txt nomme la révision en échec de l'historique"
  - id: retour-arriere
    label: "La dernière révision est un rollback déployé vers la dernière révision saine, et l'application est disponible"
  - id: tests-du-chart
    label: "Les tests du chart ont réussi sur la révision courante"
