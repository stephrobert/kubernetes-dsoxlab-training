id: cks-runtime-sandbox-gvisor
title: "Isolate a Pod from the host kernel, and check it by reading its kernel version"
level: minimize-vulnerabilities
section: cks
difficulty: advanced
description: |
  The node offers a second container runtime that runs an application kernel of
  its own. Put a Pod inside it, and prove the isolation the only way that
  cannot be faked: from inside, the kernel version is no longer the node's.
skills:
  - runtimeclass
  - gvisor
  - sandbox
  - containerd
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/runtime-sandboxes/
lab_type: lab
estimated_time: 25m

# Compétence du blueprint CKS, domaine Minimize Microservice Vulnerabilities
# (20 %) : « Use appropriate pod security standards » et l'isolation par
# bac à sable.
#
# Ce lab lève une attestation NÉGATIVE de la formation : « runtime-sandboxes,
# containerd ne déclare que runc ». Le setup installe gVisor et le déclare
# auprès de containerd, ce qui rend la compétence éprouvable pour la première
# fois dans le catalogue.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: la-runtimeclass-designe-le-runtime-du-noeud
    label: "The RuntimeClass names the node's runtime"
    tests:
      - test_la_runtimeclass_designe_le_runtime_du_noeud
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/runtime-sandboxes/
  - id: le-pod-confine-ne-voit-pas-le-noyau-de-l-hote
    label: "The sandboxed Pod does not see the host's kernel"
    tests:
      - test_le_pod_confine_ne_voit_pas_le_noyau_de_l_hote
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/runtime-sandboxes/
