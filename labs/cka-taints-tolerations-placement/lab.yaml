id: cka-taints-tolerations-placement
title: "Reserve a node: taint, toleration and nodeSelector"
level: workloads-scheduling
section: cka
difficulty: intermediate
description: |
  Reserve the worker for production with a taint and a label, then place a
  Pod that must go there, toleration and nodeSelector, and a Pod that must
  not. The tests read the node, the actual placement of each Pod and the
  declared mechanisms: a Pod pinned with nodeName bypasses the taint and
  does not pass.
skills:
  - taints
  - tolerations
  - nodeSelector
  - node-labels
  - scheduling
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/affinity-toleration-taint/
lab_type: lab
estimated_time: 10m

# Compétence du blueprint CKA, domaine Workloads and Scheduling (15 %) :
# « Understand how resource limits can affect Pod scheduling » et les
# mécanismes de placement. Le lab hérité tournait sur kind avec un nœud
# nommé kind-worker ; ici c'est k8s-w1.lab, un vrai worker.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
