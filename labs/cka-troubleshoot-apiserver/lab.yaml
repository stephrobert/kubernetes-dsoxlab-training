id: cka-troubleshoot-apiserver
title: "Bring the API server back into service"
level: troubleshooting
section: cka
difficulty: advanced
description: |
  kubectl no longer answers: the control plane's API server exits with an
  error at startup. With no API, diagnose on the node, in the containers and
  in the kubelet journal, fix the static manifest, and prove the API answers
  without having weakened its authorization.
skills:
  - troubleshooting
  - kube-apiserver
  - static-pod
  - crictl
  - control-plane
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Troubleshoot
# cluster components ». C'est un des sujets que kind ne peut pas prouver : le
# manifeste statique et le kubelet sont ceux d'une vraie machine.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

# Un critère par état demandé, et la leçon où le réviser.
criteria:
  - id: l-api-repond
    label: "The API server answers again"
    tests:
      - test_l_api_repond
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
  - id: le-pod-statique-de-l-api-tourne
    label: "The kube-apiserver static Pod is Running"
    tests:
      - test_le_pod_statique_tourne
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
  - id: le-manifeste-est-sain-et-autorise
    label: "The manifest is repaired and still declares Node,RBAC authorization"
    tests:
      - test_le_manifeste_est_sain_et_autorise_toujours
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
