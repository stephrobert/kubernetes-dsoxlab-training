title: "Remettre l'API server en service"
description: |
  kubectl ne répond plus : l'API server du control plane sort en erreur au
  démarrage. Sans API, diagnostiquer sur le nœud, dans les conteneurs et les
  journaux du kubelet, corriger le manifeste statique, et prouver que l'API
  répond sans avoir affaibli son autorisation.

criteria:
  - id: l-api-repond
    label: "L'API server répond de nouveau"
  - id: le-pod-statique-de-l-api-tourne
    label: "Le Pod statique kube-apiserver est Running"
  - id: le-manifeste-est-sain-et-autorise
    label: "Le manifeste est réparé et déclare toujours l'autorisation Node,RBAC"
