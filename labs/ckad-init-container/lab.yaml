id: ckad-init-container
title: "Wait for a dependency with an init container"
level: application-design
section: ckad
difficulty: intermediate
description: |
  Keep an application from starting before the Service it depends on answers,
  with an init container that waits. Watch the Pod held in Init, put the
  dependency in place, and see the application start on its own.
skills:
  - init-container
  - pod-design
  - startup-dependency
  - services
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/#mettre-en-pratique
lab_type: lab
estimated_time: 20m

# Lab de la leçon « Init containers et sidecars » (KUBERN-06-07) du module
# « Déployer ses applications ». Compétence du blueprint CKAD, domaine
# Application Design and Build (20 %) :
# « Understand multi-container Pod design patterns (init containers) ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: gardien-qui-attend-le-service
    label: "app has an init container that waits for config-svc, then its main container"
    tests:
      - test_app_a_un_init_container_qui_attend_config_svc
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
  - id: dependance-derriere-le-service
    label: "config-server answers behind config-svc"
    tests:
      - test_config_server_repond_derriere_config_svc
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
  - id: init-termine-avec-succes
    label: "The init container completed successfully"
    tests:
      - test_l_init_container_s_est_termine_avec_succes
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
  - id: running-seul-quand-la-dependance-repond
    label: "app went Running on its own once the dependency answered"
    tests:
      - test_app_est_passe_seul_en_running_quand_la_dependance_a_repondu
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
