id: ckad-init-container
title: "Repair the gatekeeper of an application with an init container"
level: application-design
section: ckad
difficulty: intermediate
description: |
  An application already runs although its dependency does not answer: its
  init container only resolves a name. Diagnose the gatekeeper and the
  Service, recreate the Pod with a gatekeeper that waits for a real answer,
  then put the dependency in place and see the application start on its own.
skills:
  - init-container
  - pod-design
  - startup-dependency
  - services
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/init-containers-and-sidecars/
lab_type: lab
estimated_time: 20m

# Lab de la leçon « Init containers et sidecars » (KUBERN-06-07) du module
# « Déployer ses applications ». Compétence du blueprint CKAD, domaine
# Application Design and Build (20 %) :
# « Understand multi-container Pod design patterns (init containers) ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: gardien-qui-attend-le-service
    label: "facturation has an init container that waits for an answer from tarifs-svc on its port, then its main container"
    tests:
      - test_facturation_a_un_gardien_qui_attend_tarifs_svc
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/init-containers-and-sidecars/
  - id: dependance-derriere-le-service
    label: "tarifs answers behind tarifs-svc, on port 8080"
    tests:
      - test_tarifs_repond_derriere_tarifs_svc
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/init-containers-and-sidecars/
  - id: init-termine-avec-succes
    label: "The init container completed successfully"
    tests:
      - test_l_init_container_s_est_termine_avec_succes
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/init-containers-and-sidecars/
  - id: running-seul-quand-la-dependance-repond
    label: "facturation went Running on its own once tarifs answered"
    tests:
      - test_facturation_est_passe_seul_en_running_quand_tarifs_a_repondu
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/init-containers-and-sidecars/
