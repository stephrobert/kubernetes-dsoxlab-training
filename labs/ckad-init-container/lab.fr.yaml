title: "Attendre une dépendance avec un init container"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/#mettre-en-pratique
description: |
  Empêcher une application de démarrer avant que le Service dont elle dépend
  ne réponde, avec un init container qui attend. Observer le Pod bloqué en
  Init, poser la dépendance, et voir l'application partir toute seule.

criteria:
  - id: gardien-qui-attend-le-service
    label: "app a un init container qui attend config-svc, puis son conteneur principal"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
  - id: dependance-derriere-le-service
    label: "config-server répond derrière config-svc"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
  - id: init-termine-avec-succes
    label: "L'init container s'est terminé avec succès"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
  - id: running-seul-quand-la-dependance-repond
    label: "app est passé seul en Running quand la dépendance a répondu"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
