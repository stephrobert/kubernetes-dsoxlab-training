id: cka-kubectl-debug
title: "Get inside a container with no shell using kubectl debug"
level: troubleshooting
description: |
  A Pod whose image contains no shell offers nothing to kubectl exec. Attach
  an ephemeral container to it that shares its processes, reach the node's
  filesystem through a debug Pod, and leave proof of it.
skills:
  - kubectl-debug
  - ephemeral-container
  - node-debug
  - troubleshooting
  - distroless
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/debug-applications/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Troubleshoot
# clusters and nodes » et « Manage and evaluate container output streams ».
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
