---
# Joué par `dsoxlab clean` : défait ce que le lab a créé, le namespace. Le
# cluster, lui, reste en place.
- name: Nettoyer le lab cka-kubectl-debug
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace de travail
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace lab
        --ignore-not-found --wait=false
      changed_when: true
      failed_when: false
