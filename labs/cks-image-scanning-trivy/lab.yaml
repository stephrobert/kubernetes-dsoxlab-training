id: cks-image-scanning-trivy
title: "Replace an image riddled with flaws, and check it with a second scan"
level: supply-chain-security
section: cks
difficulty: intermediate
description: |
  A Deployment runs an image three years old. Scan it, pick a replacement, and
  prove the choice: the test scans both and demands strictly fewer critical
  findings than the original, which no fixed threshold could measure honestly.
skills:
  - supply-chain-security
  - image-scanning
  - trivy
  - cve
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/scan-kubernetes-images/
lab_type: lab
estimated_time: 25m

# Compétence du blueprint CKS, domaine Supply Chain Security (20 %) :
# « Scan images for known vulnerabilities ».
#
# Trivy est posé sur le nœud par `mise`, depuis shared/outil-par-mise.yml.
# Décision de Stéphane du 2026-09-16 : les outils des labs s'installent avec
# mise, jamais par un téléchargement d'archive.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: l-image-de-production-n-est-plus-celle-d-origine
    label: "Production no longer runs the original image"
    tests:
      - test_l_image_de_production_n_est_plus_celle_d_origine
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/scan-kubernetes-images/
  - id: la-nouvelle-image-porte-moins-de-failles-critiques
    label: "The new image carries fewer critical vulnerabilities"
    tests:
      - test_la_nouvelle_image_porte_moins_de_failles_critiques
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/scan-kubernetes-images/
