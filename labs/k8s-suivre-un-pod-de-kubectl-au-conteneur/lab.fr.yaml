title: "Suivre un Pod de kubectl au conteneur"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/architecture/#mettre-en-pratique
description: |
  Créer un Deployment, puis lire les événements de son Pod pour consigner
  chaque étape entre kubectl et un conteneur qui tourne, et le composant qui
  agit à chacune : le scheduler pour le placement, le kubelet du Node choisi
  pour le tirage de l'image, la création et le démarrage du conteneur.

criteria:
  - id: le-deployment-suivi-tourne
    label: "Le Deployment suivi a un réplica disponible sur l'image demandée"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/architecture/
  - id: le-placement-est-attribue-au-scheduler
    label: "L'étape Scheduled est attribuée au scheduler"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/architecture/
  - id: les-etapes-du-conteneur-sont-attribuees-au-kubelet
    label: "Les étapes Pulled, Created et Started sont attribuées au kubelet"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/architecture/
  - id: le-kubelet-est-celui-du-node-du-pod
    label: "Le kubelet qui a agi est celui du Node qui fait tourner le Pod"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/architecture/
