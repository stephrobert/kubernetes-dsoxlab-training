---
# Joué par `dsoxlab run`. Deux sites, deux clusters Kubernetes 1.37 d'un nœud
# sans kube-proxy (ha-cp1.lab, ha-cp2.lab), Cilium 1.20.5 avec ClusterMesh
# prêt mais NON connecté, même autorité de certification, comme le lab
# k8s-relier-deux-clusters. Le site 1 reçoit en plus ce que les labs guidés
# ont fait installer, et que le capstone ne réévalue pas :
#
# - le plan de contrôle BGP de Cilium (bgpControlPlane.enabled) ;
# - Gateway API v1.6.3 (CRD standard-install, version déclarée par Cilium
#   1.20.5) servie par Cilium (gatewayAPI.enabled), CRD posées AVANT Cilium ;
# - cert-manager v1.21.3 et une autorité interne, le ClusterIssuer
#   autorite-des-sites (même construction que k8s-servir-une-gateway-en-https).
#
# Le routeur FRR 10.6.2 de l'équipe réseau tourne sur k8s-cp.lab, dans un
# espace de noms réseau à lui (10.10.50.200, AS 65000), avec le site 1 pour
# seul voisin, en AS 65001.
- name: Préparer les deux nœuds et initialiser deux clusters d'un nœud
  hosts: lab_target:lab_cluster2
  become: true
  vars:
    mesh_id: "{{ 1 if inventory_hostname in groups['lab_target'] else 2 }}"
    kubectl: kubectl --kubeconfig /etc/kubernetes/admin.conf
  tasks:
    - name: Remettre le nœud à zéro
      ansible.builtin.include_tasks: fixtures/remise-a-zero.yml

    - name: Préparer le nœud Kubernetes
      ansible.builtin.include_tasks: ../../shared/noeud-kubernetes.yml

    - name: Initialiser le cluster d'un nœud, sans kube-proxy
      ansible.builtin.command: >-
        kubeadm init --skip-phases=addon/kube-proxy
        --pod-network-cidr=10.24{{ mesh_id }}.0.0/16
        --service-cidr=10.11{{ mesh_id }}.0.0/16
        --apiserver-advertise-address={{ ansible_host }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Laisser les Pods tourner sur le seul nœud du cluster
      ansible.builtin.command: >-
        {{ kubectl }} taint nodes --all node-role.kubernetes.io/control-plane-
      register: _taint
      changed_when: "'untainted' in _taint.stdout"
      failed_when: false

    - name: Poser Helm 4.3.2 avec mise
      ansible.builtin.include_tasks: ../../shared/outil-par-mise.yml
      vars:
        outil_nom: helm
        outil_version: "4.3.2"
        outil_verification: version --short

    - name: Ajouter le dépôt de charts de Cilium
      ansible.builtin.shell: |
        helm repo add cilium https://helm.cilium.io --force-update
        helm repo update cilium
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true

- name: Site 1 - Gateway API, Cilium avec BGP et Gateway, lecture de l'autorité
  hosts: lab_target
  become: true
  vars:
    kubectl: kubectl --kubeconfig /etc/kubernetes/admin.conf
  tasks:
    # Cilium ne sert la Gateway API que si ses CRD existent quand l'opérateur
    # démarre : elles passent avant le chart.
    - name: Poser les CRD Gateway API v1.6.3
      ansible.builtin.command: >-
        {{ kubectl }} apply --server-side -f
        https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
      changed_when: true

    - name: Installer Cilium 1.20.5 sur le site 1
      ansible.builtin.command: >-
        helm upgrade --install cilium cilium/cilium --version 1.20.5 --namespace kube-system
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ ansible_host }} --set k8sServicePort=6443
        --set ipam.mode=cluster-pool
        --set ipam.operator.clusterPoolIPv4PodCIDRList={10.241.0.0/16}
        --set cluster.name=cluster-1 --set cluster.id=1
        --set operator.replicas=1
        --set clustermesh.useAPIServer=true
        --set clustermesh.apiserver.service.type=NodePort
        --set clustermesh.apiserver.tls.auto.method=helm
        --set clustermesh.config.enabled=true
        --set bgpControlPlane.enabled=true
        --set gatewayAPI.enabled=true
        --wait --timeout 10m
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true

    - name: Attendre la GatewayClass cilium et les CRD BGP
      ansible.builtin.shell: |
        for i in $(seq 1 60); do
          {{ kubectl }} get gatewayclass cilium >/dev/null 2>&1 \
            && {{ kubectl }} get crd ciliumbgpclusterconfigs.cilium.io >/dev/null 2>&1 && exit 0
          sleep 5
        done
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: Lire le certificat et la clé de l'autorité du site 1
      ansible.builtin.command: >-
        {{ kubectl }} -n kube-system get secret cilium-ca
        -o jsonpath='{.data.ca\.crt} {.data.ca\.key}'
      register: _ca
      changed_when: false
      no_log: true

    - name: Garder l'autorité pour le site 2
      ansible.builtin.set_fact:
        mesh_ca_crt: "{{ _ca.stdout.split(' ')[0] }}"
        mesh_ca_key: "{{ _ca.stdout.split(' ')[1] }}"
      no_log: true

- name: Site 2 - Cilium avec la même autorité
  hosts: lab_cluster2
  become: true
  vars:
    cluster1: "{{ groups['lab_target'] | first }}"
  tasks:
    - name: Écrire les valeurs de l'autorité partagée
      ansible.builtin.copy:
        dest: /root/cilium-ca-valeurs.yaml
        mode: "0600"
        content: |
          tls:
            ca:
              cert: {{ hostvars[cluster1].mesh_ca_crt }}
              key: {{ hostvars[cluster1].mesh_ca_key }}
      no_log: true

    - name: Installer Cilium 1.20.5 sur le site 2
      ansible.builtin.command: >-
        helm upgrade --install cilium cilium/cilium --version 1.20.5 --namespace kube-system
        -f /root/cilium-ca-valeurs.yaml
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ ansible_host }} --set k8sServicePort=6443
        --set ipam.mode=cluster-pool
        --set ipam.operator.clusterPoolIPv4PodCIDRList={10.242.0.0/16}
        --set cluster.name=cluster-2 --set cluster.id=2
        --set operator.replicas=1
        --set clustermesh.useAPIServer=true
        --set clustermesh.apiserver.service.type=NodePort
        --set clustermesh.apiserver.tls.auto.method=helm
        --set clustermesh.config.enabled=true
        --wait --timeout 10m
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true

    - name: Retirer le fichier de l'autorité
      ansible.builtin.file:
        path: /root/cilium-ca-valeurs.yaml
        state: absent

    - name: Lire le kubeconfig d'administration du site 2
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: mesh_kubeconfig_2

- name: Site 1 - CLI cilium, deux contextes, cert-manager, routeur, application
  hosts: lab_target
  become: true
  vars:
    cli_version: v0.20.3
    cert_manager_version: "1.21.3"
    cluster2: "{{ groups['lab_cluster2'] | first }}"
    temoin_hote: "{{ groups['lab_temoin'] | first }}"
    utilisateur: "{{ ansible_user | default('ubuntu') }}"
    kubectl: kubectl --kubeconfig /etc/kubernetes/admin.conf
  tasks:
    - name: Récupérer le CLI cilium {{ cli_version }}, somme vérifiée
      ansible.builtin.get_url:
        url: "https://github.com/cilium/cilium-cli/releases/download/{{ cli_version }}/cilium-linux-amd64.tar.gz"
        checksum: "sha256:https://github.com/cilium/cilium-cli/releases/download/{{ cli_version }}/cilium-linux-amd64.tar.gz.sha256sum"
        dest: /tmp/cilium-linux-amd64.tar.gz
        mode: "0644"

    - name: Installer le CLI cilium
      ansible.builtin.unarchive:
        src: /tmp/cilium-linux-amd64.tar.gz
        dest: /usr/local/bin
        remote_src: true

    - name: Poser le kubeconfig du site 2 sur ha-cp1
      ansible.builtin.copy:
        dest: /etc/kubernetes/cluster-2.conf
        content: "{{ hostvars[cluster2].mesh_kubeconfig_2.content | b64decode }}"
        mode: "0600"
      no_log: true

    - name: Fusionner les deux kubeconfig, contextes cluster-1 et cluster-2
      ansible.builtin.script: >-
        fixtures/fusion-kubeconfig.py /etc/kubernetes/admin.conf /etc/kubernetes/cluster-2.conf
        /home/{{ utilisateur }}/.kube/config {{ utilisateur }}
      args:
        executable: python3

    - name: Récupérer le manifeste de cert-manager {{ cert_manager_version }}
      ansible.builtin.get_url:
        url: "https://github.com/cert-manager/cert-manager/releases/download/v{{ cert_manager_version }}/cert-manager.yaml"
        dest: "/root/cert-manager-v{{ cert_manager_version }}.yaml"
        mode: "0644"

    - name: Installer cert-manager sur le site 1
      ansible.builtin.command: >-
        {{ kubectl }} apply --server-side --force-conflicts -f /root/cert-manager-v{{ cert_manager_version }}.yaml
      changed_when: true

    - name: Attendre que cert-manager et son webhook soient disponibles
      ansible.builtin.command: >-
        {{ kubectl }} -n cert-manager wait --for=condition=Available deployment --all --timeout=300s
      changed_when: false

    - name: Lancer le routeur FRR de l'équipe réseau, voisin du site 1
      ansible.builtin.script: >-
        fixtures/routeur.sh present 10.10.50.200/24 65000 65001 {{ ansible_host }}
      args:
        executable: /bin/bash
      delegate_to: "{{ temoin_hote }}"

    - name: Poser l'autorité interne et l'application des deux sites
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
