id: cka-ingress-path-routing
title: "Route two applications on a single host, and prove each gets its own"
level: services-networking
section: cka
difficulty: intermediate
description: |
  Two applications, one hostname, and no rule saying which is which. Route by
  path, and prove it the only way that counts: each path answers with its own
  application's name, and an undeclared path answers with neither.
skills:
  - ingress
  - services
  - routage
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ingress/#mettre-en-pratique
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKA, domaine Services and Networking (20 %) :
# « Understand connectivity between Pods » et l'exposition par Ingress.
#
# Le contrôleur est posé par le setup : ce que le lab mesure est la règle de
# routage, pas l'installation d'un contrôleur.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: regle-pour-l-hote
    label: "An Ingress rule with a class targets app.local"
    tests:
      - test_une_regle_de_routage_existe_pour_l_hote
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ingress/
  - id: chemin-api
    label: "Path /api reaches svc-api"
    tests:
      - test_le_chemin_api_atteint_svc_api
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ingress/
  - id: chemin-web
    label: "Path /web reaches svc-web"
    tests:
      - test_le_chemin_web_atteint_svc_web
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ingress/
  - id: chemin-non-declare
    label: "An undeclared path reaches neither application"
    tests:
      - test_un_chemin_non_declare_n_atteint_aucune_application
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ingress/

feedback: full
