title: "Écrire un runbook qui se rejoue, et mesurer le SLO d'une application"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/sre-exploitation-kubernetes/
description: |
  L'application catalogue est tombée après le déploiement d'une mauvaise image.
  Écrivez le runbook qui la remet en service, pour que n'importe qui puisse le
  rejouer au prochain incident sans rien abîmer, puis mesurez sa disponibilité
  sur les 30 derniers jours face à son objectif, et dites combien de budget
  d'erreur il reste.
criteria:
  - id: service-rendu
    label: "L'application catalogue répond de nouveau, sur sa dernière bonne image"
  - id: runbook-efficace
    label: "Le runbook remet le service après la même panne, rejoué par quelqu'un d'autre"
  - id: runbook-rejouable
    label: "Rejoué sur un service sain, le runbook sort en 0 et ne change rien"
  - id: sli-mesure
    label: "Le SLI de disponibilité sur 30 jours et le SLO de 99,5 % sont consignés"
  - id: budget-juste
    label: "Le budget d'erreur restant, en minutes, est juste"
