id: ckad-rolling-update-strategy
title: "Tune a rolling update: maxSurge and maxUnavailable"
level: application-deployment
section: ckad
difficulty: intermediate
description: |
  Constrain the way a Deployment replaces its Pods, never more than two
  extra ones nor more than one unavailable, then trigger an image update and
  prove it went all the way through: old revision down to zero, new one
  complete.
skills:
  - rolling-update
  - deployment
  - strategy
  - maxsurge
  - maxunavailable
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Deployment (20 %) :
# « Understand Deployments and how to perform rolling updates ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
