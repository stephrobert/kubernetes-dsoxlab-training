id: ckad-rolling-update-strategy
title: "Tune a rolling update: maxSurge and maxUnavailable"
level: application-deployment
section: ckad
difficulty: intermediate
description: |
  A Deployment set to Recreate must become a progressive replacement:
  never more than two extra Pods nor more than one unavailable. Then
  trigger an image update and prove it went all the way through: old
  revision down to zero, new one complete.
skills:
  - rolling-update
  - deployment
  - strategy
  - maxsurge
  - maxunavailable
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/#mettre-en-pratique
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Deployment (20 %) :
# « Understand Deployments and how to perform rolling updates ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: la-strategie-est-rollingupdate
    label: "The webapp Deployment uses the RollingUpdate strategy"
    tests:
      - test_la_strategie_est_rollingupdate
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/
  - id: maxsurge-vaut-deux
    label: "maxSurge is 2: at most two extra Pods during the switch"
    tests:
      - test_maxsurge_vaut_deux
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/
  - id: maxunavailable-vaut-un
    label: "maxUnavailable is 1: at most one Pod unavailable at a time"
    tests:
      - test_maxunavailable_vaut_un
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/
  - id: l-image-est-la-nouvelle
    label: "The Deployment's image moved to nginx:1.30.6"
    tests:
      - test_l_image_est_la_nouvelle
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/
  # Le critère « les replicas restent cinq » a disparu le 2026-11-10 : une
  # exigence de non-régression est vraie avant le travail, donc son test ne
  # pouvait pas refuser. Elle est devenue une assertion du critère suivant, qui
  # lui dépend du travail.
  - id: les-cinq-replicas-sont-prets-sur-la-nouvelle-image
    label: "The five replicas are ready, up to date and running the new image"
    tests:
      - test_les_cinq_replicas_sont_prets_sur_la_nouvelle_image
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: deux-revisions-existent
    label: "Two revisions of webapp exist, the new image coming after the old one"
    tests:
      - test_deux_revisions_existent
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: le-nouveau-replicaset-porte-cinq-replicas
    label: "The ReplicaSet of the new image carries five ready replicas"
    tests:
      - test_le_nouveau_replicaset_porte_cinq_replicas
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/
  - id: les-anciens-replicasets-sont-a-zero
    label: "The old ReplicaSets are kept at zero"
    tests:
      - test_les_anciens_replicasets_sont_a_zero
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/

feedback: full
