id: cks-cosign-verify-image
title: "Sign an image, and check the signature by having another one refused"
level: supply-chain-security
section: cks
difficulty: advanced
description: |
  A local registry holds two images, neither signed. Sign one with cosign,
  publish the public key, and prove the chain works: the same key must accept
  the signed image and refuse the other. A verification that accepts
  everything proves nothing.
skills:
  - supply-chain-security
  - cosign
  - image-signing
  - registry
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/sign-and-verify-an-image/
lab_type: lab
estimated_time: 30m

# Compétence du blueprint CKS, domaine Supply Chain Security (20 %) :
# « Verify platform binaries before deploying » appliquée aux images.
#
# Le registre est LOCAL, monté par le setup : signer suppose de POUSSER la
# signature à côté de l'image, ce qu'aucun registre public ne permettrait sans
# identifiants. cosign et crane sont posés par mise.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: la-cle-publique-est-publiee-dans-le-cluster
    label: "The public key, and only it, is published in the cluster"
    tests:
      - test_la_cle_publique_est_publiee_dans_le_cluster
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/sign-and-verify-an-image/
  - id: la-signature-est-poussee-dans-le-registre
    label: "The signature is pushed to the registry"
    tests:
      - test_la_signature_est_poussee_dans_le_registre
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/sign-and-verify-an-image/
  - id: la-cle-accepte-l-image-signee-et-refuse-l-autre
    label: "The key accepts the signed image and refuses the other one"
    tests:
      - test_la_cle_accepte_l_image_signee_et_refuse_l_autre
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/sign-and-verify-an-image/
