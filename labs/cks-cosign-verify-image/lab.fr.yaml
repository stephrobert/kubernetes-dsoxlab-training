title: "Signer une image, et prouver la signature en faisant refuser une autre"
description: |
  Un registre local porte deux images, aucune signée. Signez-en une avec
  cosign, publiez la clé publique, et prouvez que la chaîne fonctionne : la
  même clé doit accepter l'image signée et refuser l'autre. Une vérification
  qui accepte tout ne prouve rien.
