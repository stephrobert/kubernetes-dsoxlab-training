---
# Joué par `dsoxlab run` avant d'ouvrir la session.
- name: Préparer le lab cks-cosign-verify-image
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser cosign sur le nœud avec mise
      ansible.builtin.include_tasks: ../../shared/outil-par-mise.yml
      vars:
        outil_nom: cosign
        outil_version: "3.1.3"
        # cosign n'accepte pas --version, seulement la sous-commande.
        outil_verification: version

    - name: Poser crane sur le nœud avec mise
      ansible.builtin.include_tasks: ../../shared/outil-par-mise.yml
      vars:
        outil_nom: crane
        outil_version: "0.22.1"
        # crane emploie lui aussi la sous-commande, pas le drapeau.
        outil_verification: version

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
