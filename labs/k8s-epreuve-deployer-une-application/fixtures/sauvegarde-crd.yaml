apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sauvegardes.atelier.formation.k8s
spec:
  group: atelier.formation.k8s
  scope: Namespaced
  names:
    plural: sauvegardes
    singular: sauvegarde
    kind: Sauvegarde
    shortNames:
      - sauv
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Retention
          type: integer
          jsonPath: .spec.retentionJours
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - source
              properties:
                source:
                  type: string
                  description: Le volume à sauvegarder
                retentionJours:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: Durée de conservation en jours
            status:
              type: object
              properties:
                phase:
                  type: string
