id: cka-troubleshoot-crashloopbackoff
title: "Get a Deployment out of CrashLoopBackOff"
level: troubleshooting
section: cka
difficulty: intermediate
description: |
  The Pods of a Deployment have been restarting in a loop since the last
  release. Read what the process said before it died, work out what it is
  missing, fix the Deployment, and prove the application serves again.
skills:
  - troubleshooting
  - crashloopbackoff
  - logs
  - configmap
  - deployment
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Manage and
# evaluate container output streams » et « Troubleshoot clusters and nodes ».
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: deux-replicas-disponibles
    label: "The Deployment has its two replicas available"
    tests:
      - test_deux_replicas_disponibles
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
  - id: plus-de-boucle-de-redemarrage
    label: "No Pod restarts in a loop any more"
    tests:
      - test_plus_de_boucle_de_redemarrage
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
  - id: la-variable-designe-le-bon-repertoire
    label: "The Deployment's variable points to /etc/config"
    tests:
      - test_la_variable_designe_le_bon_repertoire
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
  - id: la-configuration-est-montee-a-cet-endroit
    label: "The team's configuration is mounted there"
    tests:
      - test_la_configuration_est_montee_a_cet_endroit
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
  - id: l-application-repond
    label: "The application answers on port 8080"
    tests:
      - test_l_application_repond
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
