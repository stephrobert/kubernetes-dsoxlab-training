id: cka-troubleshoot-crashloopbackoff
title: "Get a Deployment out of CrashLoopBackOff"
level: troubleshooting
description: |
  The Pods of a Deployment have been restarting in a loop since the last
  release. Read what the process said before it died, work out what it is
  missing, fix the Deployment, and prove the application serves again.
skills:
  - troubleshooting
  - crashloopbackoff
  - logs
  - configmap
  - deployment
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/crashloopbackoff-kubernetes/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Manage and
# evaluate container output streams » et « Troubleshoot clusters and nodes ».
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
