---
# Joué par `dsoxlab clean` : désinstalle la release, retire le namespace et le
# répertoire de la session. Helm et la déclaration du dépôt podinfo restent :
# ce sont des outils du nœud, pas des objets du lab.
- name: Nettoyer le lab k8s-surcharger-les-values-d-un-chart-helm
  hosts: lab_target
  become: true
  vars:
    session: "{{ ansible_user | default('ansible') }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Désinstaller la release
      ansible.builtin.command: helm uninstall catalogue -n helm-values --ignore-not-found --wait
      changed_when: true
      failed_when: false

    - name: Supprimer le namespace de travail
      ansible.builtin.command: kubectl delete namespace helm-values --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false

    - name: Retirer le répertoire du lab dans la session
      ansible.builtin.file:
        path: "/home/{{ session }}/catalogue"
        state: absent
