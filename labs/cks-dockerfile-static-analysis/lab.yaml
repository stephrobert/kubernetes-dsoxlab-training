id: cks-dockerfile-static-analysis
title: "Corriger un Dockerfile que l'analyse statique refuse, sans changer l'application"
level: supply-chain-security
section: cks
difficulty: intermediate
description: |
  A Dockerfile that builds and runs, and that static analysis rejects on five
  counts. Fix them all without changing what the image does, and prove it by
  running the analysis again: the five findings must be gone by their
  identifiers, not by a count that a new rule would break.
skills:
  - supply-chain-security
  - dockerfile
  - static-analysis
  - trivy
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/supply-chain-security/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKS, domaine Supply Chain Security (20 %) :
# « Minimize base image footprint ».
#
# Trivy analyse aussi les fichiers de CONFIGURATION, Dockerfile compris, avec
# `trivy config`. C'est le même outil que cks-image-scanning-trivy, employé en
# amont : là on mesure ce qu'une image contient, ici ce que sa recette promet.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
