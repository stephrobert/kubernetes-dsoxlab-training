id: cks-dockerfile-static-analysis
title: "Fix a Dockerfile static analysis refuses, without changing the application"
level: supply-chain-security
section: cks
difficulty: intermediate
description: |
  A Dockerfile that builds and runs, and that static analysis rejects on five
  counts. Fix them all without changing what the image does, and prove it by
  running the analysis again: the five findings must be gone by their
  identifiers, not by a count that a new rule would break.
skills:
  - supply-chain-security
  - dockerfile
  - static-analysis
  - trivy
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKS, domaine Supply Chain Security (20 %) :
# « Minimize base image footprint ».
#
# Trivy analyse aussi les fichiers de CONFIGURATION, Dockerfile compris, avec
# `trivy config`. C'est le même outil que cks-image-scanning-trivy, employé en
# amont : là on mesure ce qu'une image contient, ici ce que sa recette promet.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-tag-latest-a-disparu
    label: "The base image no longer uses the latest tag"
    tests:
      - test_le_tag_latest_a_disparu
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
  - id: l-image-ne-tourne-plus-en-root
    label: "The image no longer runs as root"
    tests:
      - test_l_image_ne_tourne_plus_en_root
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
  - id: le-port-22-n-est-plus-expose
    label: "Port 22 is no longer exposed"
    tests:
      - test_le_port_22_n_est_plus_expose
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
  - id: un-healthcheck-est-declare
    label: "A HEALTHCHECK is declared"
    tests:
      - test_un_healthcheck_est_declare
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
  - id: apt-get-n-installe-plus-les-recommandations
    label: "apt-get no longer installs recommended packages"
    tests:
      - test_apt_get_n_installe_plus_les_recommandations
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
