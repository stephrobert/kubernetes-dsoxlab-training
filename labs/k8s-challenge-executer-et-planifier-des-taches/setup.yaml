---
# Joué par `dsoxlab run` avant d'ouvrir la session : il installe le cluster
# kubeadm du catalogue s'il manque, puis pose le namespace compta, ses deux
# ConfigMap tirées au sort et le Job export-compta en échec.
- name: Préparer le lab k8s-challenge-executer-et-planifier-des-taches
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
