---
# Joué par `dsoxlab clean` et `dsoxlab reset`. Des certificats renouvelés sont
# valides : il n'y a rien à défaire sur le cluster. Le nettoyage remet le
# kubeconfig de l'utilisateur sur l'admin.conf courant, et retire les réponses
# et le relevé du setup.
- name: Défaire le lab kubeadm-verifier-et-renouveler-les-certificats
  hosts: lab_target
  become: true
  tasks:
    - name: Remettre le kubeconfig de l'utilisateur sur l'admin.conf courant
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user | default('ansible') }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user | default('ansible') }}"
        mode: "0600"

    - name: Retirer les réponses et le relevé du setup
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/home/{{ ansible_user | default('ansible') }}/pki"
        - /var/lib/dsoxlab/pki-series.json
