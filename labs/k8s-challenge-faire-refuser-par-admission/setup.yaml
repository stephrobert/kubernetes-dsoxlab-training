---
# Joué par `dsoxlab run` : le cluster kubeadm du catalogue, puis la situation
# du challenge (fixtures/prepare.sh), fausse sur les dix états par
# construction.
- name: Préparer le challenge k8s-challenge-faire-refuser-par-admission
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser les quatre namespaces et le Pod privilégié
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
