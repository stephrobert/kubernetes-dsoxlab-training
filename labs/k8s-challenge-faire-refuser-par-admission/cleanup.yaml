---
# Joué par `dsoxlab clean` et `dsoxlab reset`.
#
# Les labels de standard et les Pods vivent dans les quatre namespaces du
# challenge : les supprimer suffit. La politique d'admission et sa liaison,
# elles, sont des objets de CLUSTER : elles survivraient aux namespaces, et une
# politique laissée en place refuserait des Pods dans les labs suivants.
- name: Défaire le challenge k8s-challenge-faire-refuser-par-admission
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer les quatre namespaces du challenge
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace vitrine paiement production recette
        --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false

    - name: Supprimer les politiques d'admission et leurs liaisons
      # La liaison d'abord : une politique sans liaison n'agit sur rien, une
      # liaison qui désigne une politique absente est une erreur bruyante.
      ansible.builtin.shell: |
        set -eu
        kubectl get validatingadmissionpolicybinding -o name \
          | grep -vE 'safe-upgrades' \
          | xargs -r kubectl delete --ignore-not-found >/dev/null
        kubectl get validatingadmissionpolicy -o name \
          | grep -vE 'safe-upgrades' \
          | xargs -r kubectl delete --ignore-not-found >/dev/null
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true
      failed_when: false
