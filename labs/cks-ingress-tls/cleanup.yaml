---
# Joué par `dsoxlab clean`.
- name: Nettoyer le lab cks-ingress-tls
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace du site
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace vitrine
        --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false

    - name: Retirer le contrôleur Ingress et ses CRD
      ansible.builtin.include_tasks: ../../shared/traefik-retirer.yml
