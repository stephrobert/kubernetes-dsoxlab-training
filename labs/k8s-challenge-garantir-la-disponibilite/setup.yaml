---
# Joué par `dsoxlab run` : le cluster kubeadm du catalogue (deux nœuds
# ordonnançables, le socle retire le taint du control plane), puis la situation
# du challenge (fixtures/prepare.sh), fausse sur les six états par construction.
- name: Préparer le challenge k8s-challenge-garantir-la-disponibilite
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser l'application paiement et de quoi nourrir le rapport de routine
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
        LAB_USER: "{{ ansible_user | default('ansible') }}"
