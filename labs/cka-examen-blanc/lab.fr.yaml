title: "Examen blanc CKA : 17 tâches en 120 minutes"
description: |
  Un examen blanc chronométré au format de la CKA : dix-sept tâches réparties
  comme les domaines officiels, sur un cluster kubeadm, chaque tâche sur l'hôte qu'elle désigne,
  jointe par ssh, noté sur l'état final du cluster, sans indice. Prévoyez 120 minutes.

criteria:
  - id: t01-classe-rapide
    label: "Tâche 1 : StorageClass rapide, provisionneur local-path, Retain, WaitForFirstConsumer"
  - id: t02-revendication-donnees
    label: "Tâche 2 : la revendication donnees est Bound sur rapide et le Pod ecrivain y a écrit"
  - id: t03a-worker-ready
    label: "Tâche 3 : le worker k8s-w1.lab est Ready"
  - id: t03b-kubelet-au-boot
    label: "Tâche 3 : le kubelet du worker tourne et démarre au boot"
  - id: t04-facture
    label: "Tâche 4 : facture fait tourner ses deux réplicas, prêts"
  - id: t05a-endpoints-annuaire
    label: "Tâche 5 : le Service annuaire a les Pods d'annuaire pour endpoints"
  - id: t05b-client-joint-annuaire
    label: "Tâche 5 : le Pod client joint annuaire par son nom"
  - id: t06-erreurs-du-journal
    label: "Tâche 6 : les lignes ERROR du Pod journal sont consignées"
  - id: t07-vitrine-retour-arriere
    label: "Tâche 7 : vitrine est revenue en 1.30.5 après une mise à jour en 1.30.6"
  - id: t08-configuration-api
    label: "Tâche 8 : api lit MODE dans une ConfigMap et MOT_DE_PASSE dans un Secret"
  - id: t09-placement-rapport
    label: "Tâche 9 : rapport tourne seulement sur le worker, par toleration et affinité de nœud"
  - id: t10a-lecteur-lit
    label: "Tâche 10 : le ServiceAccount lecteur peut lister et surveiller les Pods"
  - id: t10b-lecteur-limite
    label: "Tâche 10 : lecteur est lié, et ne peut rien de plus que lire les Pods"
  - id: t11-snapshot-etcd
    label: "Tâche 11 : un snapshot etcd valide est enregistré"
  - id: t12-crd-sauvegarde
    label: "Tâche 12 : la CRD est installée et la Sauvegarde quotidienne existe"
  - id: t13-overlay-prod
    label: "Tâche 13 : l'overlay prod est appliqué"
  - id: t14-networkpolicy
    label: "Tâche 14 : seul front joint la base"
  - id: t15-ingress
    label: "Tâche 15 : l'Ingress boutique route /api"
  - id: t16-gateway
    label: "Tâche 16 : la HTTPRoute magasin est acceptée et sert web"
  - id: t17-nodeport
    label: "Tâche 17 : accueil répond sur son NodePort"
