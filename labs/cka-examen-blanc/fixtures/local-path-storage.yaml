# local-path-provisioner de Rancher, v0.0.37 (publiée le 2026-08-05), copié de
# https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
# le 2026-11-11. Seul changement : les deux images, épinglées par digest
# (le provisionneur, et l'aide busybox qui crée et efface les répertoires).
# Mis en un seul document kind: List (le dépôt refuse les YAML à plusieurs
# documents) ; kubectl apply -f et delete -f le lisent tel quel.
apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Namespace
  metadata:
    name: local-path-storage
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: local-path-provisioner-service-account
    namespace: local-path-storage
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: local-path-provisioner-role
    namespace: local-path-storage
  rules:
  - apiGroups:
    - ''
    resources:
    - pods
    verbs:
    - get
    - list
    - watch
    - create
    - patch
    - update
    - delete
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRole
  metadata:
    name: local-path-provisioner-role
  rules:
  - apiGroups:
    - ''
    resources:
    - nodes
    - persistentvolumeclaims
    - configmaps
    - pods
    - pods/log
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - ''
    resources:
    - persistentvolumes
    verbs:
    - get
    - list
    - watch
    - create
    - patch
    - update
    - delete
  - apiGroups:
    - ''
    resources:
    - events
    verbs:
    - create
    - patch
  - apiGroups:
    - storage.k8s.io
    resources:
    - storageclasses
    verbs:
    - get
    - list
    - watch
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: local-path-provisioner-bind
    namespace: local-path-storage
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: local-path-provisioner-role
  subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata:
    name: local-path-provisioner-bind
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: local-path-provisioner-role
  subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: local-path-provisioner
    namespace: local-path-storage
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: local-path-provisioner
    template:
      metadata:
        labels:
          app: local-path-provisioner
      spec:
        serviceAccountName: local-path-provisioner-service-account
        containers:
        - name: local-path-provisioner
          image: docker.io/rancher/local-path-provisioner:v0.0.37@sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f
          imagePullPolicy: IfNotPresent
          command:
          - local-path-provisioner
          - --debug
          - start
          - --config
          - /etc/config/config.json
          ports:
          - name: health
            containerPort: 8080
            protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
          - name: config-volume
            mountPath: /etc/config/
          env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: CONFIG_MOUNT_PATH
            value: /etc/config/
          - name: HEALTH_PORT
            value: '8080'
        volumes:
        - name: config-volume
          configMap:
            name: local-path-config
- apiVersion: storage.k8s.io/v1
  kind: StorageClass
  metadata:
    name: local-path
  provisioner: rancher.io/local-path
  volumeBindingMode: WaitForFirstConsumer
  reclaimPolicy: Delete
- kind: ConfigMap
  apiVersion: v1
  metadata:
    name: local-path-config
    namespace: local-path-storage
  data:
    config.json: "{\n        \"nodePathMap\":[\n        {\n                \"node\":\"DEFAULT_PATH_FOR_NON_LISTED_NODES\"\
      ,\n                \"paths\":[\"/opt/local-path-provisioner\"]\n        }\n        ]\n}"
    setup: '#!/bin/sh

      set -eu

      mkdir -m 0777 -p "$VOL_DIR"'
    teardown: '#!/bin/sh

      set -eu

      rm -rf "$VOL_DIR"'
    helperPod.yaml: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: helper-pod\nspec:\n  priorityClassName: system-node-critical\n\
      \  tolerations:\n    - key: node.kubernetes.io/disk-pressure\n      operator: Exists\n      effect: NoSchedule\n  containers:\n\
      \  - name: helper-pod\n    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4\n\
      \    imagePullPolicy: IfNotPresent"
