id: cks-rbac-least-privilege
title: "Take cluster-admin away from a service account, without stopping its work"
level: cluster-hardening
section: cks
difficulty: intermediate
description: |
  A ServiceAccount holds cluster-admin because it was quicker. Take that power
  back and give it exactly what its application needs, no more. The proof is
  not the manifest: it is what the API server answers when that account asks.
skills:
  - rbac
  - least-privilege
  - clusterrolebinding
  - auth-can-i
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/rbac/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKS, domaine Cluster Hardening (15 %) : « Use Role
# Based Access Controls to minimize exposure » et « Exercise caution in using
# service accounts ». Le catalogue a déjà deux labs RBAC, CKA et CKAD, qui
# apprennent à DONNER un droit. Celui-ci apprend à en RETIRER un sans casser
# l'application, ce qui est le geste du CKS et le plus difficile des deux.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-compte-n-est-plus-administrateur-du-cluster
    label: "The account is no longer a cluster administrator"
    tests:
      - test_le_compte_n_est_plus_administrateur_du_cluster
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/rbac/
  - id: le-compte-a-ce-qu-il-lui-faut-et-rien-de-plus
    label: "The account has what it needs, and cannot read the Secrets"
    tests:
      - test_le_compte_a_ce_qu_il_lui_faut_et_rien_de_plus
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/rbac/
  - id: le-droit-s-arrete-au-namespace
    label: "The right stops at the namespace"
    tests:
      - test_le_droit_s_arrete_au_namespace
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/rbac/
  - id: le-droit-est-porte-par-le-namespace
    label: "The right is carried by a RoleBinding of the namespace"
    tests:
      - test_le_droit_est_porte_par_le_namespace
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/rbac/
