title: "Lire ce que déclare un Node worker"
description: |
  Sur le cluster kind multi-nœuds, consigner pour le worker
  architecture-worker2 son runtime de conteneurs, la version de son kubelet,
  sa capacité en CPU et en mémoire, et sa condition Ready, tels que le Node
  les déclare.

criteria:
  - id: le-runtime-du-worker-est-consigne
    label: "Le runtime de conteneurs d'architecture-worker2 et sa version sont consignés"
  - id: la-version-du-kubelet-est-consignee
    label: "La version du kubelet d'architecture-worker2 est consignée"
  - id: la-capacite-du-worker-est-consignee
    label: "La capacité en CPU et en mémoire d'architecture-worker2 est consignée"
  - id: la-condition-ready-est-consignee
    label: "La condition Ready d'architecture-worker2 est consignée"
