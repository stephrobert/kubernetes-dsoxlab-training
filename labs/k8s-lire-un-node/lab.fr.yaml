title: "Lire ce que déclare un Node worker"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/#mettre-en-pratique
description: |
  Sur le cluster kind multi-nœuds, consigner pour le worker
  architecture-worker2 ce qui le distingue des autres nœuds : son adresse
  interne, la plage d'adresses de ses Pods, son Machine ID et l'heure de son
  passage à Ready, tels que le Node les déclare.

criteria:
  - id: l-adresse-interne-est-consignee
    label: "L'adresse interne d'architecture-worker2 est consignée"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
  - id: la-plage-des-pods-est-consignee
    label: "La plage d'adresses des Pods d'architecture-worker2 est consignée"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
  - id: le-machine-id-est-consigne
    label: "Le Machine ID d'architecture-worker2 est consigné"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
  - id: l-heure-du-passage-a-ready-est-consignee
    label: "L'heure du passage à Ready d'architecture-worker2 est consignée"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
