# Lab guidé de la leçon « Les nœuds worker » du module Architecture de la
# formation. Il fait lire, sur un worker désigné, ce que le Node déclare de
# lui-même : son runtime, la version de son kubelet, sa capacité et sa
# condition Ready.
#
# Il tourne sur le cluster kind « architecture », partagé par les quatre labs
# du module. Il ne crée aucun objet dans le cluster : il n'écrit qu'une fiche
# dans le répertoire de l'apprenant, et ne modifie jamais les Nodes.
id: k8s-lire-un-node
title: "Read what a worker Node declares"
level: kubernetes-fundamentals
section: kcna
difficulty: beginner
description: |
  On the multi-node kind cluster, record for the worker architecture-worker2
  what sets it apart from the other nodes: its internal address, the address
  range of its Pods, its Machine ID and the time it became Ready, as the Node
  declares them.
skills:
  - kubectl-get-nodes
  - kubectl-describe-node
  - kubelet
  - container-runtime
  - node-conditions
distros:
  - debian13
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
lab_type: lab
estimated_time: 15m

certification_tags:
  - kcna
  - kcsa

runtime:
  type: vm
  targets:
    - name: kind
      host: k8s-kind.lab
  default: kind

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: l-adresse-interne-est-consignee
    label: "The internal address of architecture-worker2 is recorded"
    tests:
      - test_l_adresse_interne_est_consignee
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
  - id: la-plage-des-pods-est-consignee
    label: "The Pod address range of architecture-worker2 is recorded"
    tests:
      - test_la_plage_des_pods_est_consignee
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
  - id: le-machine-id-est-consigne
    label: "The Machine ID of architecture-worker2 is recorded"
    tests:
      - test_le_machine_id_est_consigne
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
  - id: l-heure-du-passage-a-ready-est-consignee
    label: "The time architecture-worker2 became Ready is recorded"
    tests:
      - test_l_heure_du_passage_a_ready_est_consignee
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/worker-nodes/
