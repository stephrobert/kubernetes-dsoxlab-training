---
# Joué par `dsoxlab clean` : défait ce que le lab a créé. Tout vit dans le
# namespace lab, le supprimer suffit. Le cluster reste.
- name: Nettoyer le lab ckad-troubleshoot-missing-configmap
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace de travail
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace lab
        --ignore-not-found --wait=false
      changed_when: true
      failed_when: false

    - name: Retirer le relevé de l'apprenant et la mémoire
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/home/{{ ansible_user | default('ansible') }}/broken-app"
        - /var/lib/dsoxlab/troubleshoot-missing-configmap.json
