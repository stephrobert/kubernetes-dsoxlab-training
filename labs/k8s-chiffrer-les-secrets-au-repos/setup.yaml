---
# Joué par `dsoxlab run` avant d'ouvrir la session.
- name: Préparer le lab k8s-chiffrer-les-secrets-au-repos
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Déposer le script qui déchiffre avant de rendre le manifeste d'origine
      # prepare.sh l'appelle : ansible.builtin.script ne copie que le script
      # qu'il joue, pas ses voisins.
      ansible.builtin.copy:
        src: fixtures/dechiffrer.sh
        dest: /var/lib/dsoxlab/dechiffrer-secrets.sh
        mode: "0700"

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
