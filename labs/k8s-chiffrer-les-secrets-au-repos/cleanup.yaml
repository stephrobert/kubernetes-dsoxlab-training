---
# Joué par `dsoxlab clean`.
#
# L'ordre est imposé : déchiffrer TOUS les Secrets du cluster, PUIS rendre le
# manifeste d'origine de l'API server. Dans l'autre ordre, l'API server perdrait
# la clé avant d'avoir réécrit les Secrets chiffrés, et ne saurait plus les
# relire : c'est le lab suivant qui en paierait le prix. fixtures/dechiffrer.sh
# porte ce raisonnement en entier.
- name: Nettoyer le lab k8s-chiffrer-les-secrets-au-repos
  hosts: lab_target
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Déchiffrer les Secrets puis rendre le manifeste d'origine
      ansible.builtin.script: fixtures/dechiffrer.sh
      args:
        executable: /bin/bash
      changed_when: true

    - name: Supprimer le namespace du lab
      ansible.builtin.command: >-
        kubectl delete namespace tresorerie
        --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false
