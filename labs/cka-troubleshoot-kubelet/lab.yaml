id: cka-troubleshoot-kubelet
title: "Repair a kubelet that refuses to start"
level: troubleshooting
section: cka
difficulty: advanced
description: |
  A worker's kubelet stops as soon as it is launched, and the node is NotReady.
  Read in the journal what it holds against its configuration, fix the file
  without breaking anything else, and prove that the node and its application
  are back.
skills:
  - troubleshooting
  - kubelet
  - journalctl
  - kubelet-config
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Troubleshoot
# clusters and nodes » et « Troubleshoot cluster components ». La vague 1 du
# backlog le réclamait sous le nom cka-reparer-un-kubelet : l'attestation
# cluster-troubleshooting du blog n'a pas pu l'éprouver sur kind.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
    - name: w1
      host: k8s-w1.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
