id: cka-troubleshoot-kubelet
title: "Repair a kubelet that refuses to start"
level: troubleshooting
section: cka
difficulty: advanced
description: |
  A worker's kubelet stops as soon as it is launched, and the node is NotReady.
  Read in the journal what it holds against its configuration, fix the file
  without breaking anything else, and prove that the node and its application
  are back.
skills:
  - troubleshooting
  - kubelet
  - journalctl
  - kubelet-config
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/depanner-un-noeud-kubernetes/#mettre-en-pratique
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Troubleshoot
# clusters and nodes » et « Troubleshoot cluster components ». La vague 1 du
# backlog le réclamait sous le nom cka-reparer-un-kubelet : l'attestation
# cluster-troubleshooting du blog n'a pas pu l'éprouver sur kind.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
      # Ce lab interroge k8s-w1.lab par l'API du cluster : il lui faut
      # donc ce noeud, et `roles` est le champ que le contrat prevoit pour
      # « les hotes additionnels utilises simultanement ». Sans lui,
      # `dsoxlab start` ne le provisionne pas depuis la 0.8.2, et le lab
      # echoue sur un noeud introuvable.
      roles:
        worker: k8s-w1.lab
    - name: w1
      host: k8s-w1.lab
      # Ce lab interroge k8s-cp.lab par l'API du cluster : il lui faut
      # donc ce noeud, et `roles` est le champ que le contrat prevoit pour
      # « les hotes additionnels utilises simultanement ». Sans lui,
      # `dsoxlab start` ne le provisionne pas depuis la 0.8.2, et le lab
      # echoue sur un noeud introuvable.
      roles:
        control_plane: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

# Un critère par état demandé, et la leçon où le réviser.
criteria:
  - id: le-noeud-est-ready
    label: "The worker Node is Ready again"
    tests:
      - test_le_noeud_est_ready
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/depanner-un-noeud-kubernetes/
  - id: le-kubelet-tourne
    label: "The kubelet service runs on the worker"
    tests:
      - test_le_kubelet_tourne
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/depanner-un-noeud-kubernetes/
  - id: la-configuration-garde-son-dns
    label: "The kubelet configuration is repaired and keeps the kube-dns address"
    tests:
      - test_la_configuration_du_kubelet_garde_son_dns
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/depanner-un-noeud-kubernetes/
  - id: l-application-est-revenue
    label: "The application is back, three replicas on the worker"
    tests:
      - test_l_application_est_revenue_sur_le_noeud
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/depanner-un-noeud-kubernetes/
