title: "Exposer un Deployment par un Service ClusterIP"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/#mettre-en-pratique
description: |
  Déployer quatre replicas d'un serveur et les exposer par un Service
  interne. Vérifier depuis un client que le Service répond par son nom et son
  port, et qu'il répartit réellement les requêtes entre les Pods.

criteria:
  - id: le-deployment-demande-quatre-replicas
    label: "Le Deployment contacts demande quatre replicas"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: les-quatre-replicas-sont-disponibles
    label: "Les quatre replicas de contacts sont disponibles"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: les-pods-portent-le-label-app-contacts
    label: "Les Pods de contacts portent le label app=contacts"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: les-pods-tournent-avec-l-image-demandee
    label: "Les Pods de contacts tournent avec l'image busybox:1.38.0"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: le-service-est-de-type-clusterip
    label: "Le Service contacts-svc est de type ClusterIP"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-service-ecoute-sur-8081-vers-9090
    label: "Le Service contacts-svc écoute sur 8081 et vise le port 9090 des Pods"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-service-selectionne-app-contacts
    label: "Le selector de contacts-svc vaut app=contacts"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-service-a-quatre-endpoints-prets
    label: "Le Service contacts-svc a exactement quatre endpoints prêts"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-service-repond-sous-son-nom-depuis-le-client
    label: "http://contacts-svc:8081/ répond depuis le Pod client"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/coredns/
  - id: chaque-pod-repond-son-propre-nom
    label: "Chaque Pod sert son propre nom d'hôte, comparé à la liste réelle des Pods"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-service-repartit-entre-plusieurs-pods
    label: "Sur dix requêtes, au moins deux Pods différents répondent"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
