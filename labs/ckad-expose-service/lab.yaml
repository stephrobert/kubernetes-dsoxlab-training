id: ckad-expose-service
title: "Expose a Deployment through a ClusterIP Service"
level: services-networking
section: ckad
difficulty: beginner
description: |
  Deploy four replicas of a server and expose them through an internal
  Service. Check from a client that the Service answers under its name and
  port, and that it really spreads the requests across the Pods.
skills:
  - service
  - deployment
  - clusterip
  - dns
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
lab_type: lab
estimated_time: 10m

# Compétence du blueprint CKAD, domaine Services and Networking (20 %) :
# « Demonstrate basic understanding of NetworkPolicies » et « Provide and
# troubleshoot access to applications via services ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-deployment-demande-quatre-replicas
    label: "The Deployment contacts asks for four replicas"
    tests:
      - test_le_deployment_demande_quatre_replicas
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: les-quatre-replicas-sont-disponibles
    label: "The four replicas of contacts are available"
    tests:
      - test_les_quatre_replicas_sont_disponibles
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: les-pods-portent-le-label-app-contacts
    label: "The Pods of contacts carry the label app=contacts"
    tests:
      - test_les_pods_portent_le_label_app_contacts
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/deployments/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: les-pods-tournent-avec-l-image-demandee
    label: "The Pods of contacts run busybox:1.38.0"
    tests:
      - test_les_pods_tournent_avec_l_image_demandee
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: le-service-est-de-type-clusterip
    label: "The Service contacts-svc is of type ClusterIP"
    tests:
      - test_le_service_est_de_type_clusterip
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-service-ecoute-sur-8081-vers-9090
    label: "The Service contacts-svc listens on 8081 and targets port 9090 of the Pods"
    tests:
      - test_le_service_ecoute_sur_8081_vers_9090
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-service-selectionne-app-contacts
    label: "The selector of contacts-svc is app=contacts"
    tests:
      - test_le_service_selectionne_app_contacts
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-service-a-quatre-endpoints-prets
    label: "The Service contacts-svc has exactly four ready endpoints"
    tests:
      - test_le_service_a_quatre_endpoints_prets
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-service-repond-sous-son-nom-depuis-le-client
    label: "http://contacts-svc:8081/ answers from the client Pod"
    tests:
      - test_le_service_repond_sous_son_nom_depuis_le_client
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/coredns/
  - id: chaque-pod-repond-son-propre-nom
    label: "Each Pod serves its own hostname, checked against the real Pod list"
    tests:
      - test_chaque_pod_repond_son_propre_nom
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: le-service-repartit-entre-plusieurs-pods
    label: "Over ten requests, at least two different Pods answer"
    tests:
      - test_le_service_repartit_entre_plusieurs_pods
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/

feedback: full
