---
# Joué par `dsoxlab clean` : retire le namespace entrepot, la CRD Export (et
# avec elle tous ses objets) et le relevé de l'apprenant. Le cluster « lab »
# reste : c'est le socle partagé des labs kind. La situation d'avant le
# 2026-11-20 (namespace archives, CRD Sauvegarde) est retirée aussi.
- name: Nettoyer le lab k8s-explorer-l-api
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer les namespaces du lab
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kind/lab.kubeconfig delete namespace entrepot
        archives --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false

    - name: Supprimer la CRD Export
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kind/lab.kubeconfig delete crd
        exports.donnees.formation.k8s sauvegardes.sauvegarde.formation.k8s
        --ignore-not-found --wait=true --timeout=120s
      changed_when: true
      failed_when: false

    - name: Retirer les répertoires de l'apprenant
      ansible.builtin.file:
        path: "/home/{{ ansible_user | default('ansible') }}/{{ item }}"
        state: absent
      loop:
        - entrepot
        - archives
