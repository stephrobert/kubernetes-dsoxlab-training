# Épreuve de fin du niveau 5 de la formation Kubernetes (fiche
# KUBERN-EPREUVE-N5) : sécuriser le cluster qui héberge la boutique du fil
# rouge, à partir d'un état hérité faible, sans procédure.
#
# Elle croise tout le niveau : plan de contrôle (profileur, audit CIS), journal
# d'audit, admission (Pod Security Admission, ValidatingAdmissionPolicy),
# reprise d'un Pod privilégié, confinement (AppArmor, seccomp, gVisor), réseau
# (mTLS d'Istio, NetworkPolicy par défaut), détection (Falco) et chaîne
# d'approvisionnement (digest, cosign, trivy image, trivy config). Chaque pièce
# reprend un lab cks-* attesté ; Falco reprend k8s-challenge-confiner-et-detecter.
#
# D34 : l'énoncé ne nomme aucun type d'objet Kubernetes. Les tests retrouvent
# sur le cluster ce que l'apprenant a choisi (le profil AppArmor que le Pod
# déclare, la RuntimeClass que le Pod emploie, la politique d'audit que l'API
# server lit), et n'imposent un nom que là où la mesure en a besoin : les Pods
# fournis, la règle Falco, le dépôt du registre local.
#
# Seuil 70 (D06). Sept contrôles critiques, qu'aucune moyenne ne compense :
# P01, P04, P05, P06, P10, P13 et P19. dsoxlab note par test, à poids égal :
# dix-neuf états, environ 5,3 points chacun. Indices payants, en gradation
# réelle, du plus vague au plus explicite.
id: k8s-epreuve-securiser-un-cluster
title: "Level 5 test: secure a cluster"
level: cluster-hardening
section: cks
difficulty: advanced
description: |
  From a weak inherited state and requirements that name no Kubernetes
  object, secure the cluster hosting the shop: harden its control plane,
  trace Secret reads, have the cluster refuse what breaks a rule, take back a
  privileged Pod, confine workloads against the kernel, require mutual TLS and
  close the network by default, detect a shell, and let in only a pinned,
  signed and scanned image, while the shop keeps answering.
skills:
  - api-server
  - cis-benchmark
  - audit-logging
  - pod-security-admission
  - validating-admission-policy
  - apparmor
  - seccomp
  - gvisor
  - istio
  - networkpolicy
  - falco
  - cosign
  - trivy
distros:
  - ubuntu24
# Page cible de la fiche, encore à créer :
#   https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/epreuves/securiser-un-cluster/
# URL provisoire, celle de la formation, en attendant que la page existe.
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/
lab_type: challenge
exam_passing_score: 70
exam_blocking_checks:
  # Les sept contrôles critiques de la fiche (D06), sans compensation.
  - test_p01_le_profileur_est_ferme_et_l_api_repond
  - test_p04_le_journal_trace_un_secret_en_entier_et_le_reste_en_metadonnees
  - test_p05_la_boutique_refuse_un_pod_hors_standard_restricted
  - test_p06_une_image_par_tag_est_refusee_dans_la_boutique_seulement
  - test_p10_le_maillage_exige_le_tls_mutuel
  - test_p13_falco_alerte_sur_un_shell_dans_le_coffre_et_pas_ailleurs
  - test_p19_la_boutique_repond_apres_les_durcissements
estimated_time: 150m

certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  security: true
  persistence_after_reboot: false

criteria:
  - id: p01-profileur-ferme
    label: "P01 (critical): the API server's profiler no longer answers, and the API still answers"
    tests:
      - test_p01_le_profileur_est_ferme_et_l_api_repond
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/cis-benchmark/
  - id: p02-audit-cis
    label: "P02: a new CIS audit counts fewer failures than at the start, and the profiling checks pass"
    tests:
      - test_p02_un_audit_cis_rejoue_compte_moins_d_echecs
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/cis-benchmark/
  - id: p03-audit-active
    label: "P03: the API server runs with auditing on, its policy file and its log mounted"
    tests:
      - test_p03_l_api_server_tourne_avec_l_audit_monte
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/audit-logs/
  - id: p04-journal-d-audit
    label: "P04 (critical): the log records a Secret read in full and an ordinary read as metadata only"
    tests:
      - test_p04_le_journal_trace_un_secret_en_entier_et_le_reste_en_metadonnees
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/audit-logs/
  - id: p05-standard-restricted
    label: "P05 (critical): the shop's space refuses a Pod that breaks the restricted standard and accepts a compliant one"
    tests:
      - test_p05_la_boutique_refuse_un_pod_hors_standard_restricted
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
  - id: p06-image-par-tag-refusee
    label: "P06 (critical): the cluster refuses a Pod whose image is named by a tag and accepts a pinned one, without touching other spaces"
    tests:
      - test_p06_une_image_par_tag_est_refusee_dans_la_boutique_seulement
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/validating-admission-policy/
  - id: p07-pod-privilegie-repris
    label: "P07: the inherited privileged Pod is replaced by one without its defects, the original is gone and the host's processes are out of sight"
    tests:
      - test_p07_le_pod_privilegie_herite_est_remplace
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
  - id: p08-apparmor
    label: "P08: the AppArmor profile is loaded in enforce mode and the confined Pod can read but no longer write into /tmp"
    tests:
      - test_p08_apparmor_refuse_l_ecriture_et_laisse_lire
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/apparmor/
  - id: p09-seccomp
    label: "P09: the seccomp profile refuses the chmod family and allows the rest, and the Pod declaring it runs"
    tests:
      - test_p09_seccomp_refuse_chmod_et_le_pod_tourne
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/seccomp/
  - id: p10-tls-mutuel
    label: "P10 (critical): the meshed space requires mutual TLS, a client without a sidecar is blocked and a meshed client gets through"
    tests:
      - test_p10_le_maillage_exige_le_tls_mutuel
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/mtls-pod-to-pod/
  - id: p11-reseau-ferme
    label: "P11: the space is closed by default both ways, only the planned flow reaches the database and DNS resolves"
    tests:
      - test_p11_paiement_est_ferme_sauf_le_flux_prevu_et_le_dns
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/network-policies/
  - id: p12-bac-a-sable
    label: "P12: a runtime class designates the node's sandbox runtime and the Pod using it reads another kernel than the machine's"
    tests:
      - test_p12_le_bac_a_sable_lit_un_autre_noyau
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/runtime-sandboxes/
  - id: p13-falco-shell
    label: "P13 (critical): a shell in the protected space raises an alert of the requested Falco rule, with its priority, and a shell elsewhere does not"
    tests:
      - test_p13_falco_alerte_sur_un_shell_dans_le_coffre_et_pas_ailleurs
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/falco/
  - id: p14-regles-falco-intactes
    label: "P14: the Falco rules shipped with the package are intact"
    tests:
      - test_p14_les_regles_falco_fournies_sont_intactes
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/falco/
  - id: p15-digest-execute
    label: "P15: the shop's deployment references its image by the digest the node actually runs"
    tests:
      - test_p15_la_boutique_tourne_sur_le_digest_qu_elle_declare
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
  - id: p16-signature
    label: "P16: the public key is published in the cluster, the image is signed, and verification accepts it and refuses another"
    tests:
      - test_p16_l_image_signee_est_acceptee_et_une_autre_refusee
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/sign-and-verify-an-image/
  - id: p17-moins-de-failles
    label: "P17: the production image carries strictly fewer critical vulnerabilities than the original one"
    tests:
      - test_p17_l_image_de_production_porte_moins_de_failles_critiques
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/image-scanning/
  - id: p18-dockerfile
    label: "P18: the static analysis findings of the Dockerfile are gone and the application does the same thing"
    tests:
      - test_p18_le_dockerfile_ne_porte_plus_ses_constats
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
  - id: p19-la-boutique-repond
    label: "P19 (critical): the shop still answers after every hardening, with its replicas available"
    tests:
      - test_p19_la_boutique_repond_apres_les_durcissements
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/kubernetes-supply-chain-security/
