id: ckad-multi-container-sidecar
title: "A native sidecar that tails the application logs"
level: application-design
section: ckad
difficulty: intermediate
description: |
  Have a second container read the logs an application writes to a file,
  with a native sidecar, declared as an init container with restartPolicy
  Always, and a shared volume. Prove that the sidecar really does pass the
  lines on.
skills:
  - sidecar
  - multi-container
  - native-sidecar
  - emptydir
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/#mettre-en-pratique
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKAD, domaine Application Design and Build (20 %) :
# « Understand multi-container Pod design patterns (sidecar, init) ». Lab de
# la leçon « Init containers et sidecars » (KUBERN-06-07).
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: sidecar-natif
    label: "log-shipper is a native sidecar"
    tests:
      - test_log_shipper_est_un_sidecar_natif
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
  - id: volume-partage
    label: "The logs volume is shared by both containers"
    tests:
      - test_le_volume_logs_est_partage_par_les_deux_conteneurs
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
  - id: application-ecrit
    label: "app writes into the shared file"
    tests:
      - test_app_ecrit_dans_le_fichier_partage
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
  - id: sidecar-transmet
    label: "The sidecar passes on the lines of the application"
    tests:
      - test_le_sidecar_transmet_les_lignes_de_l_application
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
