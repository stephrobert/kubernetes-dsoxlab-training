id: ckad-multi-container-sidecar
title: "A native sidecar that tails the application logs"
level: application-design
section: ckad
difficulty: intermediate
description: |
  Have a second container read the logs an application writes to a file,
  with a native sidecar, declared as an init container with restartPolicy
  Always, and a shared volume. Prove that the sidecar really does pass the
  lines on.
skills:
  - sidecar
  - multi-container
  - native-sidecar
  - emptydir
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/init-containers-sidecars/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Design and Build (20 %) :
# « Understand multi-container Pod design patterns (sidecar, init) ». Le
# sidecar natif est stable depuis la 1.33 ; en 1.37, c'est la forme attendue.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
