---
# Joué par `dsoxlab run` : le cluster Cilium sans kube-proxy des hôtes net-*,
# ramené aux valeurs du socle (ce qui éteint la Gateway API qu'un passage
# précédent aurait activée), puis la situation du lab (fixtures/prepare.sh),
# qui retire ensuite les CRD de la Gateway API.
- name: Préparer le lab k8s-filtrer-en-l7-avec-cilium
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster Cilium sans kube-proxy
      ansible.builtin.include_tasks: ../../shared/cilium-cluster.yml
      vars:
        cilium_etape: cluster

    - name: Poser l'application fiches et son client
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
