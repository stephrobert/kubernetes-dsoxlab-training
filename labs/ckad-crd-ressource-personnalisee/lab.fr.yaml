title: "Utiliser une ressource personnalisée, lire les refus de son schéma, la débloquer"
description: |
  Découvrez le groupe d'API d'une CRD, créez et modifiez des ressources
  personnalisées, lisez le refus de l'API pour une valeur hors bornes, et
  débloquez une ressource restée en Terminating sans toucher à la CRD.

criteria:
  - id: quotidienne-creee
    label: "La Sauvegarde quotidienne existe avec la source et la rétention demandées"
  - id: hebdomadaire-modifiee
    label: "hebdomadaire garde 30 jours, sans avoir été recréée"
  - id: groupe-api
    label: "Le groupe et la version d'API de Sauvegarde sont consignés"
  - id: refus-hors-bornes
    label: "Le refus d'une rétention hors bornes est consigné, et l'API la refuse toujours"
  - id: ancienne-debloquee
    label: "ancienne n'est plus bloquée, et la CRD est celle du départ"
