---
# Joué par `dsoxlab clean` : retire la ConfigMap preuve des deux clusters, puis
# rend à l'apprenant le kubeconfig du seul cluster boutique. Les clusters
# restent.
- name: Nettoyer le lab k8s-changer-de-contexte
  hosts: lab_target
  become: true
  vars:
    maison: "/home/{{ ansible_user | default('ansible') }}"
  tasks:
    - name: Retirer la ConfigMap preuve des deux clusters
      ansible.builtin.shell: |
        for cluster in lab boutique; do
          K="kubectl --kubeconfig /etc/kind/${cluster}.kubeconfig"
          for ns in $($K get configmap -A --field-selector metadata.name=preuve \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{end}' 2>/dev/null); do
            $K -n "$ns" delete configmap preuve --ignore-not-found
          done
        done
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Retirer les fichiers d'une version précédente du lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ maison }}/Downloads/kubeconfig-recette.yaml"
        - "{{ maison }}/.kube/configs/recette.yaml"
        - "{{ maison }}/.kube/config.backup"
        - "{{ maison }}/.kube/config.merged"

    - name: Rendre le kubeconfig du cluster boutique
      ansible.builtin.copy:
        src: /etc/kind/boutique.kubeconfig
        dest: "{{ maison }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user | default('ansible') }}"
        group: "{{ ansible_user | default('ansible') }}"
        mode: "0600"
      failed_when: false
