# Lab guidé de la leçon « Kubeconfig et contextes » du module Fondamentaux de
# la formation. Il porte sur le geste de base de la leçon : lister les
# contextes, basculer, fixer le namespace par défaut, et constater où une
# commande sans -n ni --context envoie ce qu'elle crée. La fusion de deux
# kubeconfigs, devenue un approfondissement facultatif de la leçon, est faite
# par la préparation à la place de l'apprenant.
#
# Le second cluster est le cluster kind « lab », nommé recette dans le
# kubeconfig : la leçon en crée un pour l'occasion, ce lab réutilise un cluster
# du catalogue pour ne pas en monter un de plus sur la VM.
id: k8s-changer-de-contexte
title: "Switch context and set the default namespace"
level: kubernetes-fundamentals
section: kcna
difficulty: beginner
description: |
  Your kubeconfig already holds two contexts. Switch to recette, give it
  kube-system as its default namespace, and prove it with a ConfigMap created
  without naming any context or namespace, which must land in the right place.
skills:
  - kubeconfig
  - kubectl-config
  - contexts
  - namespaces
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-contexte/#mettre-en-pratique
lab_type: lab
estimated_time: 15m

certification_tags:
  - kcna

runtime:
  type: vm
  targets:
    - name: kind
      host: k8s-kind.lab
  default: kind

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-contexte-actif-est-recette
    label: "The active context is recette, pointing at the recette cluster"
    tests:
      - test_le_contexte_actif_est_recette
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-contexte/
  - id: le-namespace-par-defaut-est-kube-system
    label: "The default namespace of the recette context is kube-system"
    tests:
      - test_le_namespace_par_defaut_de_recette_est_kube_system
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-contexte/
  - id: la-preuve-est-au-bon-endroit
    label: "The ConfigMap preuve, created without -n nor --context, is in kube-system of the recette cluster only"
    tests:
      - test_la_preuve_est_dans_kube_system_du_cluster_recette
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-contexte/
