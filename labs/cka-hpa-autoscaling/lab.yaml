id: cka-hpa-autoscaling
title: "Scale out automatically with a HorizontalPodAutoscaler"
level: workloads-scheduling
description: |
  Put an HPA on a Deployment, generate load, watch the replica count go up,
  then cut the load. The tests read the HPA, its current metrics, and the
  rescale event the controller emitted: an HPA that has never rescaled is
  not a validated HPA.
skills:
  - hpa
  - autoscaling
  - metrics-server
  - resource-requests
  - load-testing
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/horizontal-pod-scaling/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKA, domaine Workloads and Scheduling (15 %) :
# « Configure workload autoscaling ». Le lab hérité lisait le spec du HPA et
# un ConfigMap recopiant ses valeurs ; ici la charge doit être générée, et
# la montée observée. metrics-server 0.9.0, la version courante, est
# installé par le setup et retiré par le nettoyage.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
