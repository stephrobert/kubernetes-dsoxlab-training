---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose les deux
# namespaces, vides, et ~/kustomize/, vide. Écrire la base et les overlays,
# c'est le travail. kubectl embarque Kustomize, rien à installer.
- name: Préparer le lab ckad-kustomize-overlays
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
        LAB_USER: "{{ ansible_user | default('ansible') }}"
