id: ckad-kustomize-overlays
title: "One Kustomize base and two overlays, dev and prod"
level: application-deployment
section: ckad
difficulty: intermediate
description: |
  Describe an application only once, in a Kustomize base, and deploy it into
  two namespaces with overlays that change the replica count, prefix the
  names and add an environment label. Prove that both environments are
  running and look alike.
skills:
  - kustomize
  - overlays
  - deployment
  - namespaces
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKAD, domaine Application Deployment (20 %) :
# « Use the Helm package manager to deploy existing packages » et « Kustomize ».
# La formation n'a pas de leçon Kustomize : la leçon jumelée est celle des
# Deployments, et le trou remonte au backlog du blog.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
