id: ckad-kustomize-overlays
title: "One Kustomize base and two overlays, recette and production"
level: application-deployment
section: ckad
difficulty: intermediate
description: |
  Describe the catalogue application only once, in a Kustomize base with a
  generated ConfigMap, and deploy it into recette and production with overlays
  that change the replica count, prefix the names, add a palier label, move
  recette alone to version 2 and merge one value of the configuration in
  production. Leave the cluster matching the folder.
skills:
  - kustomize
  - overlays
  - deployment
  - namespaces
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kustomize/
lab_type: lab
estimated_time: 30m

# Lab de la leçon Kustomize (KUBERN-06-05) du module « Déployer ses
# applications », et compétence du blueprint CKAD, domaine Application
# Deployment (20 %) : « Kustomize ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: recette-deux-replicas
    label: "rec-catalogue runs two available replicas in recette"
    tests:
      - test_recette_a_deux_replicas_disponibles
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kustomize/
  - id: production-quatre-replicas
    label: "prd-catalogue runs four available replicas in production"
    tests:
      - test_production_a_quatre_replicas_disponibles
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kustomize/
  - id: label-sur-les-pods
    label: "The Pods of each environment carry its palier label"
    tests:
      - test_les_pods_portent_le_label_de_leur_palier
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kustomize/
  - id: service-trouve-ses-pods
    label: "Each Service finds the Pods of its environment"
    tests:
      - test_chaque_service_trouve_ses_pods
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kustomize/
  - id: meme-structure
    label: "Both environments have the same container and the same port"
    tests:
      - test_les_deux_environnements_ont_la_meme_structure
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kustomize/
  - id: image-changee-par-l-overlay
    label: "Only recette moves to version 2, through its overlay, the base unchanged"
    tests:
      - test_recette_passe_a_la_version_2_par_son_overlay
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kustomize/
  - id: configmap-generee-et-fusionnee
    label: "The configuration comes from a generated ConfigMap, and production merges MODE=ecriture into it"
    tests:
      - test_la_configuration_generee_porte_le_mode_de_chaque_palier
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kustomize/
  - id: une-base-commune
    label: "Both overlays derive from one and the same base"
    tests:
      - test_les_overlays_derivent_d_une_meme_base
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kustomize/
  - id: cluster-conforme-au-dossier
    label: "The cluster matches the overlays of the folder"
    tests:
      - test_le_cluster_correspond_aux_overlays
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kustomize/
