---
# Joué par `dsoxlab clean` : défait ce que le lab a créé, les deux
# namespaces. Le cluster reste.
- name: Nettoyer le lab ckad-kustomize-overlays
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer les namespaces dev et prod
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace dev prod
        --ignore-not-found --wait=false
      changed_when: true
      failed_when: false
