title: "Une base Kustomize et deux overlays, recette et production"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/#mettre-en-pratique
description: |
  Décrire l'application catalogue une seule fois, dans une base Kustomize avec
  une ConfigMap générée, et la déployer en recette et en production avec des
  overlays qui changent le nombre de réplicas, préfixent les noms, ajoutent un
  label palier, passent la seule recette en version 2 et fusionnent une valeur
  de la configuration en production. Laisser le cluster conforme au dossier.

criteria:
  - id: recette-deux-replicas
    label: "rec-catalogue tourne avec deux réplicas disponibles dans recette"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/
  - id: production-quatre-replicas
    label: "prd-catalogue tourne avec quatre réplicas disponibles dans production"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/
  - id: label-sur-les-pods
    label: "Les Pods de chaque environnement portent son label palier"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/
  - id: service-trouve-ses-pods
    label: "Chaque Service trouve les Pods de son environnement"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/
  - id: meme-structure
    label: "Les deux environnements ont le même conteneur et le même port"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/
  - id: image-changee-par-l-overlay
    label: "Seule recette passe en version 2, par son overlay, sans modifier la base"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/
  - id: configmap-generee-et-fusionnee
    label: "La configuration vient d'une ConfigMap générée, où production fusionne MODE=ecriture"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/
  - id: une-base-commune
    label: "Les deux overlays dérivent d'une même base"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/
  - id: cluster-conforme-au-dossier
    label: "Le cluster correspond aux overlays du dossier"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kustomize/
