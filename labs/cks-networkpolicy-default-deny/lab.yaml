id: cks-networkpolicy-default-deny
title: "Deny everything, then reopen the strict minimum, DNS included"
level: cluster-setup
section: cks
difficulty: intermediate
description: |
  A namespace where everything talks to everything. Close it completely in
  both directions, then reopen exactly two things: the one flow the
  application needs, and name resolution, which a default-deny egress breaks
  in a way nothing warns you about.
skills:
  - networkpolicy
  - default-deny
  - zero-trust
  - dns-egress
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/network-policies/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKS, domaine Cluster Setup (15 %) : « Use Network
# security policies to restrict cluster level access ».
#
# Le catalogue a déjà deux labs NetworkPolicy, CKA et CKAD, qui apprennent à
# AUTORISER un flux. Celui-ci part de l'inverse, le modèle zéro-confiance :
# on ferme tout, puis on rouvre. Le piège qu'il éprouve n'existe que dans ce
# sens-là, et il est le plus coûteux du domaine : une sortie fermée par
# défaut casse le DNS, et rien ne le signale.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-namespace-est-ferme-par-defaut-dans-les-deux-sens
    label: "The namespace is closed by default, ingress and egress"
    tests:
      - test_le_namespace_est_ferme_par_defaut_dans_les_deux_sens
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/network-policies/
  - id: seul-le-flux-prevu-atteint-la-base
    label: "Only web reaches the database"
    tests:
      - test_seul_le_flux_prevu_atteint_la_base
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/network-policies/
  - id: le-dns-repasse-sans-rouvrir-le-reste-de-la-sortie
    label: "DNS works again, without reopening the rest of the egress"
    tests:
      - test_le_dns_repasse_sans_rouvrir_le_reste_de_la_sortie
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/network-policies/
  - id: la-sortie-reste-fermee-vers-ce-qui-n-a-pas-ete-ouvert
    label: "Egress stays closed towards what was not opened"
    tests:
      - test_la_sortie_reste_fermee_vers_ce_qui_n_a_pas_ete_ouvert
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/network-policies/
