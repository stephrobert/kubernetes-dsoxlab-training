---
# Joué par `dsoxlab clean` : Pods et politiques vivent dans le namespace
# zero-confiance, le supprimer suffit. Le cluster reste en place.
- name: Nettoyer le lab cks-networkpolicy-default-deny
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace de travail
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace zero-confiance
        --ignore-not-found --wait=false
      changed_when: true
      failed_when: false
