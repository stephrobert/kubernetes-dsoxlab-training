---
# Joué par `dsoxlab clean` : retire le namespace du lab. Le cluster reste, il
# est le socle commun des labs du catalogue.
- name: Nettoyer le lab ckad-service-nodeport-reparer
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace guichet
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace guichet
        --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false
