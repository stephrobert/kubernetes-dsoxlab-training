title: "Choisir et déployer le bon workload pour trois besoins"
description: |
  Sans guidage, servez trois besoins décrits sans nommer d'objet : une base dont
  les réplicas gardent une identité stable et leurs données, un agent sur chaque
  nœud, control plane compris, et une ressource personnalisée dont le schéma
  impose une borne.

criteria:
  - id: replicas-ordonnes
    label: "inventaire a ses trois réplicas ordonnés, tous Ready"
  - id: noms-stables
    label: "Les noms stables d'inventaire se résolvent derrière un Service headless"
  - id: donnee-survit
    label: "La donnée du réplica 1 survit à la suppression de son Pod"
  - id: agent-partout
    label: "L'agent collecteur est Ready sur chaque nœud, control plane compris"
  - id: taint-tolere
    label: "Le taint du control plane est toujours là, et l'agent le tolère"
  - id: collecte-conforme
    label: "La Collecte journaux est conforme au cahier des charges, et sa CRD est Established"
  - id: borne-refusee
    label: "Une rétention hors bornes est refusée par l'API"
