apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: collectes.atelier.formation.k8s
spec:
  group: atelier.formation.k8s
  scope: Namespaced
  names:
    plural: collectes
    singular: collecte
    kind: Collecte
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Cible
          type: string
          jsonPath: .spec.cible
        - name: Intervalle
          type: integer
          jsonPath: .spec.intervalleSecondes
        - name: Retention
          type: integer
          jsonPath: .spec.retentionJours
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - cible
                - intervalleSecondes
              properties:
                cible:
                  type: string
                  description: Le répertoire que l'agent collecte
                intervalleSecondes:
                  type: integer
                  minimum: 10
                  description: Délai entre deux collectes
                retentionJours:
                  type: integer
                  minimum: 1
                  description: Durée de conservation des journaux collectés
