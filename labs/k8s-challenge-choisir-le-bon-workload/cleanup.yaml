---
# Joué par `dsoxlab clean` : retire le namespace entrepot, les volumes que ses
# revendications avaient obtenus, la CRD Collecte, et le dossier de
# l'apprenant. Le taint du control plane est reposé s'il a été retiré : le
# cluster doit revenir à son état de départ. Le cluster « multi » reste.
- name: Nettoyer le challenge k8s-challenge-choisir-le-bon-workload
  hosts: lab_target
  become: true
  vars:
    kubectl: kubectl --kubeconfig /etc/kind/multi.kubeconfig
  tasks:
    - name: Supprimer le namespace entrepot
      ansible.builtin.command: >-
        {{ kubectl }} delete namespace entrepot
        --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false

    - name: Supprimer les volumes qui revendiquaient dans entrepot
      ansible.builtin.shell: |
        set -o pipefail
        {{ kubectl }} get pv -o jsonpath='{range .items[?(@.spec.claimRef.namespace=="entrepot")]}{.metadata.name}{"\n"}{end}' \
          | xargs -r {{ kubectl }} delete pv --wait=true --timeout=120s
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Supprimer la CRD Collecte
      ansible.builtin.command: >-
        {{ kubectl }} delete crd collectes.atelier.formation.k8s
        --ignore-not-found --wait=true --timeout=120s
      changed_when: true
      failed_when: false

    - name: Reposer le taint du control plane
      ansible.builtin.command: >-
        {{ kubectl }} taint nodes multi-control-plane
        node-role.kubernetes.io/control-plane:NoSchedule --overwrite
      changed_when: true
      failed_when: false

    - name: Retirer le dossier de l'apprenant
      ansible.builtin.file:
        path: "/home/{{ ansible_user | default('ansible') }}/entrepot"
        state: absent
