---
# Joué par `dsoxlab run` avant d'ouvrir la session. Un capstone de dépannage
# pose un état CASSÉ, et rien qui dise en quoi : le diagnostic est l'exercice.
- name: Préparer le capstone cka-capstone-portail
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la situation du capstone
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
