id: cka-capstone-portail
title: "Capstone: bring the portal back, with nobody left to ask"
level: troubleshooting
section: cka
difficulty: advanced
description: |
  A namespace handed over by a team that is gone, a portal that answers
  nothing, and no ticket saying why. Three independent faults to find, two
  requirements that were never met, and a single measure of success: the
  portal answers on every node of the cluster.
skills:
  - troubleshooting
  - scheduling
  - storage
  - services
  - nodeport
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cka/exercises/
lab_type: capstone
estimated_time: 45m

# Un capstone ne vise pas UNE compétence du blueprint, il en croise plusieurs.
# Celui-ci couvre quatre des cinq domaines du CKA : Troubleshooting (30 %),
# Services and Networking (20 %), Workloads and Scheduling (15 %) et
# Storage (10 %), soit 75 % de l'épreuve.
#
# Ce que les micro-labs n'éprouvent pas, et qui est pourtant l'essentiel du
# CKA : trouver OÙ regarder. Un lab nommé « troubleshoot-dns » a déjà répondu
# à la moitié de la question avant que le candidat n'ouvre un terminal.
certification_tags:
  - cka

# Le seuil de l'examen CKA est de 66 %, comme celui du CKAD.
exam_passing_score: 66

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: les-deux-exemplaires-du-portail-sont-prets
    label: "Both replicas of the portal are ready"
    tests:
      - test_les_deux_exemplaires_du_portail_sont_prets
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cka/exercises/
  - id: la-reserve-du-portail-tient-dans-un-noeud
    label: "The portal's resource requests fit on one node"
    tests:
      - test_la_reserve_du_portail_tient_dans_un_noeud
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cka/exercises/
  - id: le-service-designe-vraiment-les-pods-du-portail
    label: "The Service really selects the portal's Pods"
    tests:
      - test_le_service_designe_vraiment_les_pods_du_portail
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cka/exercises/
  - id: le-portail-repond-dans-le-cluster
    label: "The portal answers inside the cluster"
    tests:
      - test_le_portail_repond_dans_le_cluster
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cka/exercises/
  - id: le-service-est-expose-sur-le-port-30080
    label: "The Service is exposed on port 30080"
    tests:
      - test_le_service_est_expose_sur_le_port_30080
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cka/exercises/
  - id: le-portail-repond-sur-chaque-noeud
    label: "The portal answers on every node, from outside the cluster too"
    tests:
      - test_le_portail_repond_sur_chaque_noeud
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cka/exercises/
  - id: la-reclamation-de-stockage-est-satisfaite
    label: "The storage claim is bound"
    tests:
      - test_la_reclamation_de_stockage_est_satisfaite
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cka/exercises/
  - id: les-archives-ecrivent-vraiment-dans-leur-volume
    label: "The archives really write to their volume"
    tests:
      - test_les_archives_ecrivent_vraiment_dans_leur_volume
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/certifications/cka/exercises/
