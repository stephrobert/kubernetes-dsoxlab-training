id: cka-troubleshoot-networking
title: "Restore traffic to a Service"
level: troubleshooting
section: cka
difficulty: advanced
description: |
  A Service no longer serves its Pods: wrong selector, wrong port, and a
  network policy that closes everything. Set the Service straight, reopen
  exactly what is needed without removing the security policy, and prove that
  a client reaches the Service by its name.
skills:
  - troubleshooting
  - services
  - endpoints
  - networkpolicy
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Troubleshoot
# services and networking ». Le dernier test prouve que le trafic passe, ce
# qui suppose un CNI qui applique les NetworkPolicy : Calico, issue #3.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
