title: "Réparer le réseau des Pods d'un nœud et lire ce que dit le réseau"
description: |
  Un worker a perdu le réseau de ses Pods : le nœud est NotReady et un Pod reste
  en ContainerCreating. Consignez les plages d'adresses du cluster, réparez le
  nœud, prouvez qu'un Pod joint un Pod d'un autre nœud, et distinguez un refus
  immédiat d'un délai dépassé.

criteria:
  - id: plages
    label: "Les plages des Pods et des Services du cluster sont consignées"
  - id: adresse-cible
    label: "L'adresse actuelle du Pod cible est consignée"
  - id: worker-ready
    label: "Le worker est de nouveau Ready"
  - id: cible-sur-le-worker
    label: "cible tourne sur le worker"
  - id: d-un-noeud-a-l-autre
    label: "sonde, sur le control plane, joint cible sur le worker"
  - id: refus-ou-delai
    label: "Le refus immédiat et le délai dépassé sont distingués"
