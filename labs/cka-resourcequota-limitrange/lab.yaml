id: cka-resourcequota-limitrange
title: "Cap a namespace without blocking those who forget to declare themselves"
level: workloads-scheduling
section: cka
difficulty: intermediate
description: |
  A namespace with no ceiling and no defaults: one team can take the whole
  cluster, and a Pod with no requests is scheduled blind. Set both, and prove
  each: a Pod asking too much is refused, a Pod asking nothing is accepted and
  completed.
skills:
  - resourcequota
  - limitrange
  - requests-limits
  - scheduling
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/resource-quotas/
lab_type: lab
estimated_time: 25m

# Compétence du blueprint CKA, domaine Workloads and Scheduling (15 %) :
# « Configure workload autoscaling » et la maîtrise des ressources, ainsi que
# du domaine CKAD Application Environment.
#
# Les deux objets vont ENSEMBLE, et c'est le sujet du lab : un quota seul
# transforme l'oubli d'un développeur en refus incompréhensible, puisqu'un Pod
# sans requests devient invalide dès qu'un quota porte sur les requests.
certification_tags:
  - cka
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-namespace-refuse-un-pod-qui-demande-trop
    label: "The namespace refuses a Pod that asks for too much"
    tests:
      - test_le_namespace_refuse_un_pod_qui_demande_trop
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/resource-quotas/
  - id: un-pod-muet-repart-avec-des-requests
    label: "A Pod that declares nothing is accepted and given requests"
    tests:
      - test_un_pod_muet_repart_avec_des_requests
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/resource-quotas/
  - id: un-pod-muet-repart-avec-des-limits
    label: "A Pod that declares nothing is accepted and given limits"
    tests:
      - test_un_pod_muet_repart_avec_des_limits
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/resource-quotas/
