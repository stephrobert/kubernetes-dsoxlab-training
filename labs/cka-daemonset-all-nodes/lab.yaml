id: cka-daemonset-all-nodes
title: "An agent on every node, including the control plane"
level: workloads-scheduling
section: cka
difficulty: beginner
description: |
  Deploy a DaemonSet that places an agent on every node of the cluster,
  including the control plane, protected by its taint. The tests count one
  Pod per node, check that the taint is still there and that the agent runs
  on it anyway, and read its logs to prove that it is doing its job.
skills:
  - daemonset
  - tolerations
  - taints
  - node-scheduling
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/daemonsets/
lab_type: lab
estimated_time: 10m

# Compétence du blueprint CKA, domaine Workloads and Scheduling (15 %) :
# « Understand the primitives used to create robust, self-healing,
# application deployments » et les tolerations. Le socle retire le taint du
# control plane pour les autres labs ; celui-ci le remet, comme dans tout
# cluster de production, et le retire au nettoyage.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: image-demandee
    label: "The DaemonSet monitor-agent runs the requested image"
    tests:
      - test_le_daemonset_porte_l_image_demandee
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/daemonsets/
  - id: label-app-monitor
    label: "Its Pods carry the label app: monitor"
    tests:
      - test_les_pods_portent_le_label_app_monitor
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/daemonsets/
  - id: un-pod-par-noeud
    label: "One Ready Pod on every node, control plane included"
    tests:
      - test_un_pod_pret_sur_chaque_noeud
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/daemonsets/
  - id: taint-tolere
    label: "The taint of the control plane is still there, and the agent tolerates it"
    tests:
      - test_le_taint_est_la_et_l_agent_le_tolere
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/daemonsets/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/affinity-tolerations-and-taints/
  - id: heartbeat
    label: "Each agent writes heartbeat in its logs"
    tests:
      - test_chaque_agent_ecrit_heartbeat
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/daemonsets/

feedback: full
