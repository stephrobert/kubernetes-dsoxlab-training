id: cka-node-drain-cordon
title: "Drain a worker for maintenance, without cutting the service"
level: cluster-architecture-installation-configuration
section: cka
difficulty: intermediate
description: |
  Protect an application with a PodDisruptionBudget, take the worker out of
  scheduling, evict it while respecting that budget and the DaemonSets, then
  put it back in service and record the operation. The tests prove that the
  Pods really were recreated elsewhere, that the node came back, and that
  the CNI DaemonSet did not move.
skills:
  - cordon
  - drain
  - uncordon
  - pod-disruption-budget
  - node-maintenance
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/preparer-maintenance-cluster-kubernetes/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Cluster Architecture, Installation and
# Configuration (25 %) : « Prepare underlying infrastructure » et « Manage
# the lifecycle of Kubernetes clusters ». Le lab hérité tournait sur kind,
# où un drain n'a pas de conséquence ; ici le worker est une vraie machine
# et le CNI y tourne en DaemonSet.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
      # Ce lab interroge k8s-w1.lab par l'API du cluster : il lui faut
      # donc ce noeud, et `roles` est le champ que le contrat prevoit pour
      # « les hotes additionnels utilises simultanement ». Sans lui,
      # `dsoxlab start` ne le provisionne pas depuis la 0.8.2, et le lab
      # echoue sur un noeud introuvable.
      roles:
        worker: k8s-w1.lab
    - name: w1
      host: k8s-w1.lab
      # Ce lab interroge k8s-cp.lab par l'API du cluster : il lui faut
      # donc ce noeud, et `roles` est le champ que le contrat prevoit pour
      # « les hotes additionnels utilises simultanement ». Sans lui,
      # `dsoxlab start` ne le provisionne pas depuis la 0.8.2, et le lab
      # echoue sur un noeud introuvable.
      roles:
        control_plane: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
