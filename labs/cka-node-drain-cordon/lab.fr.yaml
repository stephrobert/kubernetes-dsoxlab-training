title: "Vider un worker pour une maintenance, sans couper le service"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/preparer-maintenance-cluster-kubernetes/
description: |
  Protéger une application par un PodDisruptionBudget, retirer le worker du
  scheduling, l'évacuer en respectant ce budget et les DaemonSets, puis le
  remettre en service et tracer l'opération. Les tests prouvent que les
  Pods ont réellement été recréés ailleurs, que le nœud est revenu, et que
  le DaemonSet du CNI n'a pas bougé.

criteria:
  - id: le-budget-protege-l-application
    label: "Le budget garde deux Pods de l'application disponibles"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/preparer-maintenance-cluster-kubernetes/
  - id: le-worker-a-ete-evacue
    label: "Les Pods de l'application ont quitté le worker, le DaemonSet du réseau est resté"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/preparer-maintenance-cluster-kubernetes/
  - id: le-pod-sans-controleur-est-parti
    label: "Le Pod sans contrôleur est parti aussi"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/preparer-maintenance-cluster-kubernetes/
  - id: le-worker-est-remis-en-service
    label: "Le worker est de retour dans le scheduling, après avoir été vidé"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/preparer-maintenance-cluster-kubernetes/
  - id: la-trace-est-ecrite
    label: "La trace de l'opération est écrite"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/preparer-maintenance-cluster-kubernetes/
