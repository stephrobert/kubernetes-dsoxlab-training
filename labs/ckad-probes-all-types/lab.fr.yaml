title: "Trois sondes sur un Pod : startup, liveness, readiness"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/probes/#mettre-en-pratique
description: |
  Équiper une application des trois sondes, avec des réglages qui ont un
  sens : un démarrage lent toléré, une vivacité surveillée, un trafic
  qui n'arrive qu'une fois prête. Prouver que les sondes agissent : le Pod
  n'est Ready que parce qu'elles répondent.

criteria:
  - id: port-et-image
    label: "probed-app déclare son port 80, sur l'image demandée"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/probes/
  - id: demarrage-tolerant
    label: "La sonde de démarrage tolère une minute de démarrage lent"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/probes/
  - id: vivacite-http
    label: "La sonde de vivacité interroge le port 80 en HTTP"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/probes/
  - id: disponibilite-http
    label: "La sonde de disponibilité interroge le port 80 en HTTP"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/probes/
  - id: ready-sans-redemarrage
    label: "probed-app est Ready, sans redémarrage"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/probes/
