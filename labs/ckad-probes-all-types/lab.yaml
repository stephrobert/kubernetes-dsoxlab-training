id: ckad-probes-all-types
title: "Three probes on one Pod: startup, liveness, readiness"
level: application-observability
section: ckad
difficulty: beginner
description: |
  Fit an application with all three probes, with settings that make sense:
  a slow start tolerated, liveness watched, traffic that only arrives once
  the Pod is ready. Prove the probes act: the Pod is Ready only because
  they answer.
skills:
  - probes
  - liveness
  - readiness
  - startup
  - health-check
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/probes/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKAD, domaine Application Observability and
# Maintenance (15 %) : « Implement probes and health checks ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: port-et-image
    label: "probed-app declares its port 80, on the requested image"
    tests:
      - test_probed_app_declare_son_port_sur_l_image_demandee
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/probes/
  - id: demarrage-tolerant
    label: "The startup probe tolerates a one-minute slow start"
    tests:
      - test_la_sonde_de_demarrage_tolere_une_minute
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/probes/
  - id: vivacite-http
    label: "The liveness probe queries port 80 over HTTP"
    tests:
      - test_la_sonde_de_vivacite_interroge_le_port_80_en_http
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/probes/
  - id: disponibilite-http
    label: "The readiness probe queries port 80 over HTTP"
    tests:
      - test_la_sonde_de_disponibilite_interroge_le_port_80_en_http
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/probes/
  - id: ready-sans-redemarrage
    label: "probed-app is Ready, without any restart"
    tests:
      - test_probed_app_est_ready_sans_redemarrage
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/probes/
