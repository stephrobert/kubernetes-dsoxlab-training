title: "Créer sa StorageClass et obtenir un volume qu'aucun administrateur n'a créé"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/storageclass/#mettre-en-pratique
description: |
  Une revendication bloquée en attente parce que personne n'a préparé de volume
  à la main. Créez une StorageClass qui reprend le provisionneur déjà installé
  et garde ses volumes, laissez le cluster en provisionner un à la demande par
  elle, et écrivez dedans depuis un Pod.

criteria:
  - id: classe-creee
    label: "La classe garde reprend le provisionneur de local-path, garde ses volumes et retarde la liaison"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/storageclass/
  - id: designe-la-classe
    label: "La revendication donnees désigne la classe garde"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/storageclass/
  - id: volume-cree-pour-elle
    label: "Le volume lié à donnees a été créé pour elle par le provisionneur de la classe"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/storageclass/
  - id: politique-de-la-classe
    label: "Le volume porte Retain, la reclaim policy que garde lui impose"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/storageclass/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/storage/
  - id: registre-monte
    label: "Le Pod registre monte la revendication sur /data"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/storage/
  - id: temoin-ecrit
    label: "Le Pod registre a écrit le fichier témoin dans le volume"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/storage/
