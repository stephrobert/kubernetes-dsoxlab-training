---
# Joué par `dsoxlab run` avant d'ouvrir la session.
- name: Préparer le lab cka-storageclass-provisionnement-dynamique
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Créer le répertoire de travail du lab sur le nœud
      ansible.builtin.file:
        path: /var/lib/dsoxlab
        state: directory
        mode: "0755"

    - name: Copier le manifeste du provisionneur de stockage local
      # local-path-provisioner de Rancher, v0.0.37 (dernière publiée le
      # 2026-11-11), images épinglées par digest dans fixtures/. Il crée la
      # StorageClass `local-path`, en WaitForFirstConsumer et reclaimPolicy
      # Delete. C'est le provisionneur que kind embarque.
      ansible.builtin.copy:
        src: fixtures/local-path-storage.yaml
        dest: /var/lib/dsoxlab/local-path-storage.yaml
        mode: "0644"

    - name: Installer le provisionneur de stockage local
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f
          /var/lib/dsoxlab/local-path-storage.yaml
      changed_when: true

    - name: Attendre que le provisionneur réponde
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf -n local-path-storage
          rollout status deployment/local-path-provisioner --timeout=300s
      changed_when: false

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
