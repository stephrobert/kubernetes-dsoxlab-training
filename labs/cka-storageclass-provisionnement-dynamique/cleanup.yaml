---
# Joué par `dsoxlab clean`.
#
# Le provisionneur pose une StorageClass et un namespace, qui sont des objets
# de CLUSTER ou qui survivraient au namespace du lab : la photographie du
# validateur les verrait apparaître.
- name: Nettoyer le lab cka-storageclass-provisionnement-dynamique
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace du lab, revendications comprises
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace archives
        --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false

    - name: Supprimer les volumes qui revendiquaient dans archives
      # La classe garde est en Retain : ses volumes survivent à leur
      # revendication, c'est l'objet du lab. Il faut donc les retirer ici.
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig /etc/kubernetes/admin.conf get pv \
          -o jsonpath='{range .items[?(@.spec.claimRef.namespace=="archives")]}{.metadata.name}{"\n"}{end}' \
          | xargs -r kubectl --kubeconfig /etc/kubernetes/admin.conf delete pv --wait=true --timeout=120s
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Supprimer la classe créée par l'apprenant
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete storageclass garde
        --ignore-not-found
      changed_when: true
      failed_when: false

    - name: Retirer le provisionneur de stockage
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf delete -f
          /var/lib/dsoxlab/local-path-storage.yaml
          --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false

    - name: Effacer ce que le provisionneur a écrit sur le disque du nœud
      # Les volumes vivent sous /opt/local-path-provisioner : les laisser
      # remplirait le disque du nœud au fil des labs.
      ansible.builtin.file:
        path: /opt/local-path-provisioner
        state: absent
