---
# Joué par `dsoxlab clean` : retire le namespace du lab, le relevé et la
# mémoire de l'état initial. Le cluster kind reste, il est le socle partagé du
# module Architecture.
- name: Nettoyer le lab k8s-observer-la-reconciliation
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace du lab
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kind/architecture.kubeconfig delete namespace
        reconciliation --ignore-not-found --wait=false
      changed_when: true
      failed_when: false

    - name: Retirer le relevé et la mémoire de l'état initial
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/home/{{ ansible_user | default('ansible') }}/reconciliation"
        - /var/lib/dsoxlab/observer-la-reconciliation.json
