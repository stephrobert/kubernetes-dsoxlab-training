---
# Joué par `dsoxlab run` : installe le socle kind sur k8s-kind.lab, avec le
# cluster « lab » et le kubeconfig de l'apprenant, puis pose le cahier des
# charges de l'application annuaire, avec son délai tiré au sort.
- name: Préparer le challenge k8s-challenge-appliquer-et-verifier-ses-manifests
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle kind
      ansible.builtin.include_tasks: ../../shared/kind-cluster.yml
      vars:
        kind_cluster_name: lab

    - name: Poser le cahier des charges et le répertoire de travail
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kind/lab.kubeconfig
        LAB_USER: "{{ ansible_user | default('ansible') }}"
