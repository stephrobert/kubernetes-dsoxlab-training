# Épreuve de fin du niveau 4 de la formation Kubernetes (fiche
# KUBERN-EPREUVE-N4) : administrer, à partir d'un état hérité, le cluster
# kubeadm qui héberge la boutique. L'agrandir, le sauvegarder, le restaurer, le
# mettre à jour, le dépanner et le garder disponible, sans procédure.
#
# Dix-huit états, P01 à P18, un test chacun, à poids égal (dsoxlab note par
# test : environ 5,6 points l'état). Seuil 70 (D06), donc treize états au
# moins. Sept critiques, qu'aucune moyenne ne compense : P01, P03, P04, P06,
# P09, P12 et P13. `lab_type: challenge` comme les autres épreuves du
# catalogue ; capstone est réservé aux certifications.
#
# Indices payants, en gradation réelle : quatre, de 10, 15, 20 et 25 points (D91), du plus
# vague au plus explicite. dsoxlab retire leur coût du barème, ce que le
# scénario dit à l'apprenant (D36 l'avait fait renoncer aux indices sur les
# épreuves des niveaux 1 et 2).
#
# DEUX CLUSTERS, comme k8s-challenge-installer-un-cluster et pour la même
# raison : l'infrastructure ne porte qu'un plan de contrôle kubeadm. P03 et P04
# (haute disponibilité derrière un répartiteur) se jouent sur un cluster kind à
# trois plans de contrôle que l'apprenant crée sur k8s-kind.lab, et dont le
# correcteur gèle un nœud (`docker pause`). Tout le reste se joue sur le
# cluster kubeadm. Une restauration d'etcd sur un etcd à trois membres empilés,
# enchaînée avec une montée de version de trois plans de contrôle, ne se
# rejouerait pas de façon fiable sur ce banc.
#
# Le setup reconstruit le cluster en 1.36.4 (repris de cka-kubeadm-upgrade) ;
# le cleanup le RECONSTRUIT à la version du catalogue, parce que l'apprenant
# peut le laisser dans un état qu'aucune montée ne sait reprendre.
#
# Page provisoire : la page de l'épreuve n'existe pas encore. URL cible de la
# fiche : https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/epreuves/administrer-un-cluster/
id: k8s-epreuve-administrer-un-cluster
title: "Level 4 test: administer a cluster"
level: cluster-architecture-installation-configuration
section: cka
difficulty: advanced
description: |
  From an inherited state and requirements that name no Kubernetes object,
  administer the kubeadm cluster that hosts the shop: bring back a reset
  worker, prove a highly available control plane, back up etcd and restore
  the shop from an older backup, migrate manifests off removed APIs, upgrade
  every node one minor version, keep the shop available through maintenance,
  repair a node, an API server and a component after recording each cause,
  and carry live changes and certificate renewals through.
skills:
  - kubeadm
  - etcd
  - disaster-recovery
  - upgrade
  - high-availability
  - troubleshooting
  - poddisruptionbudget
  - pki
distros:
  - ubuntu24
  - debian13
# Provisoire : URL cible dans le commentaire d'en-tête.
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/
lab_type: challenge
exam_passing_score: 70
exam_blocking_checks:
  - test_p01_le_worker_reinitialise_est_ready_en_1_37
  - test_p03_trois_plans_de_controle_ready_par_le_repartiteur
  - test_p04_l_api_repond_par_le_repartiteur_apres_l_arret_d_un_plan_de_controle
  - test_p06_la_boutique_est_revenue_avec_ses_uid_d_origine
  - test_p09_cluster_monte_en_1_37_0_sans_perdre_la_boutique
  - test_p12_le_noeud_notready_est_ready_et_son_kubelet_survivra_au_redemarrage
  - test_p13_l_api_server_repond_et_autorise_toujours_node_rbac
estimated_time: 180m

certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
      # Utilisés en même temps que la cible : le worker est réinitialisé puis
      # joint, l'hôte kind porte le cluster hautement disponible.
      roles:
        worker: k8s-w1.lab
        kind: k8s-kind.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: p01-worker-joint
    label: "P01 (critical): the reset worker joins the cluster, is Ready and its kubelet reports 1.37"
    tests:
      - test_p01_le_worker_reinitialise_est_ready_en_1_37
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/install-kubernetes-with-kubeadm/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kubeadm-join-a-node/
  - id: p02-swap-coupe
    label: "P02: swap is off on the worker and stays off after a reboot"
    tests:
      - test_p02_le_swap_est_coupe_et_le_reste_au_redemarrage
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kubeadm-join-a-node/
  - id: p03-trois-plans-de-controle
    label: "P03 (critical): three control-plane nodes are Ready, read through the load balancer's address"
    tests:
      - test_p03_trois_plans_de_controle_ready_par_le_repartiteur
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ha-control-plane/
  - id: p04-api-survit
    label: "P04 (critical): the API answers through the load balancer while the grader holds one control plane down"
    tests:
      - test_p04_l_api_repond_par_le_repartiteur_apres_l_arret_d_un_plan_de_controle
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/ha-control-plane/
  - id: p05-sauvegarde-fraiche
    label: "P05: a fresh, checked etcd backup exists and is more recent than the previous day's"
    tests:
      - test_p05_une_sauvegarde_fraiche_verifiee_plus_recente_que_la_veille
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/etcd/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/backup-restore/
  - id: p06-boutique-restauree
    label: "P06 (critical): the deleted shop is back with its original UIDs, restored from the previous day's backup"
    tests:
      - test_p06_la_boutique_est_revenue_avec_ses_uid_d_origine
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/backup-restore/
  - id: p07-apres-la-veille-efface
    label: "P07: an object created after the previous day's backup no longer exists, and the nodes are Ready"
    tests:
      - test_p07_l_objet_cree_apres_la_veille_n_existe_plus_et_les_noeuds_sont_ready
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/backup-restore/
  - id: p08-manifestes-migres
    label: "P08: the shop's manifests on removed APIs are migrated to the current API and apply"
    tests:
      - test_p08_les_manifestes_sont_migres_et_s_appliquent
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/api-deprecations/
  - id: p09-cluster-monte
    label: "P09 (critical): the API server and every node report the target version, no node is unschedulable, the shop keeps its replicas ready"
    tests:
      - test_p09_cluster_monte_en_1_37_0_sans_perdre_la_boutique
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/upgrade-a-kubernetes-cluster/
  - id: p10-budget-de-la-boutique
    label: "P10: during any voluntary maintenance, the storefront keeps at least one replica available, and the cluster guarantees it"
    tests:
      - test_p10_un_budget_protege_la_vitrine
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/disponibilite-applicative-kubernetes/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/preparer-maintenance-cluster-kubernetes/
  - id: p11-worker-evacue-et-rendu
    label: "P11: the worker is emptied without cutting the shop, then brought back, and accepts Pods again"
    tests:
      - test_p11_le_worker_a_ete_evacue_puis_remis_en_service
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/preparer-maintenance-cluster-kubernetes/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/gerer-noeuds-kubernetes/
  - id: p12-noeud-repare
    label: "P12 (critical): the NotReady node is Ready and its kubelet will survive a reboot"
    tests:
      - test_p12_le_noeud_notready_est_ready_et_son_kubelet_survivra_au_redemarrage
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/troubleshoot-a-node/
  - id: p13-api-server-repare
    label: "P13 (critical): the API server answers again and still authorizes requests through the Node and RBAC modes"
    tests:
      - test_p13_l_api_server_repond_et_autorise_toujours_node_rbac
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
  - id: p14-application-reparee
    label: "P14: panier has all its replicas available, no longer restarts, and reads its configuration where it looks for it"
    tests:
      - test_p14_panier_est_disponible_stable_et_lit_sa_configuration
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/crashloopbackoff/
  - id: p15-causes-consignees
    label: "P15: the cause of each failure is recorded from describe, the events or the logs before the repair"
    tests:
      - test_p15_la_cause_de_chaque_panne_est_consignee_avant_la_reparation
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/analyser-evenements-kubernetes/
  - id: p16-modification-versionnee
    label: "P16: a field changed live during the incident carries the same value in the versioned manifest"
    tests:
      - test_p16_la_modification_en_direct_est_dans_le_manifeste_versionne
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/taches-quotidiennes-admin-kubernetes/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-edit-patch-replace/
  - id: p17-certificats
    label: "P17: no control plane certificate expires in less than thirty days"
    tests:
      - test_p17_aucun_certificat_n_expire_avant_trente_jours
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/taches-quotidiennes-admin-kubernetes/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/cluster-pki/
  - id: p18-vitrine-repartie-et-sondee
    label: "P18: the storefront's replicas run on different nodes, and none receives traffic before it is ready to serve"
    tests:
      - test_p18_la_vitrine_est_repartie_et_porte_une_sonde_de_disponibilite
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/operer/disponibilite-applicative-kubernetes/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/probes/
