---
# Joué par `dsoxlab clean` : défait ce que le lab a créé et remet le DNS du
# cluster en service, que l'apprenant l'ait réparé ou non. Le cluster, lui,
# reste en place, il est le socle commun de tous les labs du catalogue.
- name: Nettoyer le lab cka-troubleshoot-dns
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace de l'application
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace app
        --ignore-not-found --wait=false
      changed_when: true
      failed_when: false

    - name: Restaurer le Corefile d'origine s'il a été gardé
      ansible.builtin.shell: |
        set -o pipefail
        S=/var/lib/dsoxlab/coredns-corefile.orig
        [ -f "$S" ] || exit 0
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system create configmap coredns \
          --from-file=Corefile="$S" --dry-run=client -o yaml \
          | kubectl --kubeconfig /etc/kubernetes/admin.conf replace -f -
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system rollout restart deployment/coredns
        rm -f "$S"
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Remettre CoreDNS à ses deux replicas, l'état que kubeadm pose
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system
        scale deployment coredns --replicas=2
      changed_when: true
      failed_when: false

    - name: Attendre que CoreDNS soit de nouveau prêt
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system
        rollout status deployment/coredns --timeout=180s
      changed_when: false
      failed_when: false
