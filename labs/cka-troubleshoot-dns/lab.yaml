id: cka-troubleshoot-dns
title: "Restore the cluster's DNS resolution"
level: troubleshooting
description: |
  No Pod resolves a service name any more. Find out why the cluster DNS has
  stopped answering, put it back in service, and prove that a client Pod
  resolves and reaches a Service by its name again.
skills:
  - troubleshooting
  - dns
  - coredns
  - networking
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/coredns/
lab_type: lab
estimated_time: 10m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %), le plus lourd
# des trois examens : « Troubleshoot cluster components » et « Troubleshoot
# services and networking ».
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
