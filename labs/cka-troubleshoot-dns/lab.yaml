id: cka-troubleshoot-dns
title: "Restore the cluster's DNS resolution"
level: troubleshooting
section: cka
difficulty: intermediate
description: |
  No Pod resolves a service name any more. Find out why the cluster DNS has
  stopped answering, put it back in service, then find why it still answers
  NXDOMAIN once Running and Ready, and prove that a client Pod resolves and
  reaches a Service by its name again.
skills:
  - troubleshooting
  - dns
  - coredns
  - networking
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/coredns/#mettre-en-pratique
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %), le plus lourd
# des trois examens : « Troubleshoot cluster components » et « Troubleshoot
# services and networking ».
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: coredns-retabli
    label: "CoreDNS runs again as kubeadm sets it up, two replicas ready"
    tests:
      - test_coredns_tourne_comme_kubeadm_le_pose
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/coredns/
  - id: corefile-zone
    label: "The CoreDNS configuration serves the cluster's zone, cluster.local"
    tests:
      - test_le_corefile_sert_la_zone_du_cluster
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/coredns/
  - id: client-resout
    label: "The client Pod resolves web-svc.app.svc.cluster.local"
    tests:
      - test_le_client_resout_le_service
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/coredns/
  - id: client-joint-en-http
    label: "The client Pod reaches web-svc over HTTP by that name"
    tests:
      - test_le_client_joint_le_service_en_http
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/coredns/

feedback: full
