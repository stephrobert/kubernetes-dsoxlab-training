---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit, une application qui marchait et un DNS de cluster qu'on
# a éteint.
#
# Transposé de K8sExamLab. Confronté à Kubernetes 1.37 le 2026-09-14 : le
# Deployment s'appelle toujours `coredns`, ses Pods portent toujours le label
# `k8s-app=kube-dns`, et kubeadm en pose toujours deux replicas.
- name: Préparer le lab cka-troubleshoot-dns
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
