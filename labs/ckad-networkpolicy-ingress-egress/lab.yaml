id: ckad-networkpolicy-ingress-egress
title: "Partition three tiers with ingress and egress NetworkPolicy"
level: services-networking
section: ckad
difficulty: intermediate
description: |
  Frontend, backend, database: allow only the intended flows, in both
  directions, DNS included, and forbid everything else. Prove every rule
  with a real connection, the one that goes through and the one that is
  blocked.
skills:
  - networkpolicy
  - ingress
  - egress
  - three-tier
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/#mettre-en-pratique
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKAD, domaine Services and Networking (20 %) :
# « Demonstrate basic understanding of NetworkPolicies ». Les tests font de
# vraies connexions, ce qui suppose un CNI qui applique les règles : Calico,
# issue #3.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: backend-policy
    label: "backend-policy targets tier=backend, inbound and outbound"
    tests:
      - test_backend_policy_vise_le_backend_dans_les_deux_sens
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: database-policy
    label: "database-policy targets tier=database, inbound and outbound"
    tests:
      - test_database_policy_vise_la_base_dans_les_deux_sens
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: backend-entree
    label: "backend accepts frontend only"
    tests:
      - test_le_backend_n_accepte_que_le_frontend
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: backend-sortie
    label: "backend reaches database and resolves names"
    tests:
      - test_le_backend_joint_la_base_et_resout_des_noms
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: base-entree
    label: "database refuses intrus"
    tests:
      - test_la_base_refuse_l_intrus
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
  - id: base-sans-sortie
    label: "database reaches nothing, not even DNS"
    tests:
      - test_la_base_ne_sort_pas
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/

feedback: full
