id: ckad-networkpolicy-ingress-egress
title: "Partition three tiers with ingress and egress NetworkPolicy"
level: services-networking
description: |
  Frontend, backend, database: allow only the intended flows, in both
  directions, DNS included, and forbid everything else. Prove every rule
  with a real connection, the one that goes through and the one that is
  blocked.
skills:
  - networkpolicy
  - ingress
  - egress
  - three-tier
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/network-policies/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKAD, domaine Services and Networking (20 %) :
# « Demonstrate basic understanding of NetworkPolicies ». Les tests font de
# vraies connexions, ce qui suppose un CNI qui applique les règles : Calico,
# issue #3.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
