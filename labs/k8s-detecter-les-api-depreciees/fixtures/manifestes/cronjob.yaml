apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: purge
  namespace: migration
spec:
  schedule: "15 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: purge
              image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
              command: ["sh", "-c", "echo purge"]
