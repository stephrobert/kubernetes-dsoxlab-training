apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: migration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.30.6@sha256:42c68eab6f7e22611786a9fe1d1c019e275c50185bd54b8f75dc2b9184322703
          resources:
            requests:
              cpu: 50m
