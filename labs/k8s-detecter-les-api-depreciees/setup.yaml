---
# Joué par `dsoxlab run` : le cluster kubeadm du catalogue, le namespace
# migration et le dépôt de manifestes hérités (fixtures/prepare.sh).
- name: Préparer le lab k8s-detecter-les-api-depreciees
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Copier les manifestes hérités sur le nœud
      ansible.builtin.copy:
        src: fixtures/manifestes/
        dest: /var/lib/dsoxlab/k8s-detecter-les-api-depreciees/
        mode: "0644"

    - name: Poser le namespace et le dépôt de manifestes
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
        LAB_USER: "{{ ansible_user | default('ansible') }}"
        SOURCE: /var/lib/dsoxlab/k8s-detecter-les-api-depreciees
