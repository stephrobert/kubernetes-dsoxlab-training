title: "Contrôler la santé d'etcd et défragmenter sa base"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/etcd/#mettre-en-pratique
description: |
  Avec etcdctl et les certificats TLS d'etcd, lire la santé de l'etcd du
  cluster, son membre et son quota d'espace, puis compacter et défragmenter une
  base gonflée en comparant sa taille avant et après.

criteria:
  - id: membre-et-sante
    label: "La réponse donne l'identifiant du membre etcd, son point d'accès client, et qu'il est en bonne santé"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/etcd/
  - id: quota
    label: "La réponse donne le quota d'espace qu'etcd applique vraiment"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/etcd/
  - id: defragmentation
    label: "La base etcd a été défragmentée : elle a rendu la place que le setup a libérée"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/etcd/
