id: cks-secure-existing-pod
title: "Take over a privileged Pod in production, without stopping its work"
level: minimize-vulnerabilities
section: cks
difficulty: intermediate
description: |
  A Pod runs with the host's process namespace, as root, privileged, from a
  floating tag. Rebuild it without any of that, and prove the difference where
  it is visible: from inside, the container no longer sees the host.
skills:
  - security-context
  - privileged
  - host-namespaces
  - remediation
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKS, domaine Minimize Microservice Vulnerabilities
# (20 %) : « Use appropriate pod security standards », côté remédiation.
#
# Le catalogue a déjà ckad-security-context-hardened, qui apprend à CONSTRUIRE
# un Pod durci. Celui-ci part d'un Pod existant, privilégié, qui tourne et que
# personne n'a signalé : reprendre l'existant est le geste du CKS, et il est
# plus difficile, parce qu'il faut trouver ce qui ne va pas avant de corriger.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-pod-corrige-tourne
    label: "The fixed Pod runs"
    tests:
      - test_le_pod_corrige_tourne
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
  - id: les-cinq-defauts-sont-repris
    label: "The five flaws of the original are fixed"
    tests:
      - test_les_cinq_defauts_sont_repris
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
  - id: le-pod-fautif-n-existe-plus
    label: "The faulty Pod is gone"
    tests:
      - test_le_pod_fautif_n_existe_plus
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
  - id: le-conteneur-ne-voit-plus-les-processus-de-l-hote
    label: "The container no longer sees the host's processes, and is not root"
    tests:
      - test_le_conteneur_ne_voit_plus_les_processus_de_l_hote
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
