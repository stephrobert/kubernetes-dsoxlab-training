---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose le namespace et
# retire le Pod qu'un passage précédent aurait laissé. Le reste est le travail.
#
# Transposé de K8sExamLab, dont la solution employait nginx:1.27 en
# utilisateur 1000 sans capability : nginx ne peut alors pas se lier au port
# 80, et le Pod n'aurait pas tourné. L'image non privilégiée écoute sur 8080.
# Confronté à Kubernetes 1.37 le 2026-09-15.
- name: Préparer le lab ckad-security-context-hardened
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
