id: ckad-security-context-hardened
title: "Harden a Pod with a securityContext"
level: application-environment
section: ckad
difficulty: intermediate
description: |
  Run a web server with no privilege: non-root user, no escalation,
  read-only root filesystem, every capability dropped. And still give it
  somewhere to write where it needs to, otherwise it will not start. Prove,
  from the inside, that the confinement holds and that the application
  serves.
skills:
  - security-context
  - hardening
  - non-root
  - readonly-filesystem
  - capabilities
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Environment, Configuration
# and Security (25 %) : « Understand SecurityContexts ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: la-definition-impose-l-utilisateur-1000
    label: "The Pod runs, and its definition requires the non-root user 1000"
    tests:
      - test_la_definition_impose_l_utilisateur_1000
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: la-definition-interdit-l-escalade
    label: "The container forbids privilege escalation"
    tests:
      - test_la_definition_interdit_l_escalade
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: la-definition-ferme-la-racine
    label: "The container declares a read-only root filesystem"
    tests:
      - test_la_definition_ferme_la_racine
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: la-definition-retire-toutes-les-capabilities
    label: "The container drops every capability"
    tests:
      - test_la_definition_retire_toutes_les_capabilities
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: le-processus-est-l-utilisateur-1000
    label: "Inside the container, the process is user 1000"
    tests:
      - test_le_processus_est_l_utilisateur_1000
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: la-racine-est-en-lecture-seule
    label: "A write into the container's root is refused"
    tests:
      - test_la_racine_est_en_lecture_seule
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: le-serveur-peut-ecrire-dans-tmp
    label: "The server can write in /tmp"
    tests:
      - test_le_serveur_peut_ecrire_dans_tmp
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: l-application-repond
    label: "The application answers despite the hardening"
    tests:
      - test_l_application_repond
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
