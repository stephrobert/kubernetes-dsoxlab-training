id: ckad-security-context-hardened
title: "Harden a Pod with a securityContext"
level: application-environment
section: ckad
difficulty: intermediate
description: |
  Run a web server with no privilege: non-root user, no escalation,
  read-only root filesystem, every capability dropped. And still give it
  somewhere to write where it needs to, otherwise it will not start. Prove,
  from the inside, that the confinement holds and that the application
  serves.
skills:
  - security-context
  - hardening
  - non-root
  - readonly-filesystem
  - capabilities
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/security-context/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Environment, Configuration
# and Security (25 %) : « Understand SecurityContexts ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
