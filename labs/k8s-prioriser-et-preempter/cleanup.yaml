---
# Joué par `dsoxlab clean` et `dsoxlab reset`. Les PriorityClass sont des objets
# du CLUSTER : supprimer le namespace ne les retire pas. Toutes celles qui ne
# sont pas du système (system-*) partent, quel que soit le nom que l'apprenant
# leur a donné, pour que le lab se rejoue à l'identique.
- name: Défaire le lab k8s-prioriser-et-preempter
  hosts: lab_target
  become: true
  vars:
    kubectl: kubectl --kubeconfig /etc/kind/multi.kubeconfig
  tasks:
    - name: Supprimer le namespace du lab
      ansible.builtin.command: >-
        {{ kubectl }} delete namespace ordonnancement --ignore-not-found --wait=true --timeout=180s
      changed_when: true

    - name: Retirer les PriorityClass qui ne sont pas du système
      ansible.builtin.shell: |
        set -o pipefail
        {{ kubectl }} get priorityclasses -o name | { grep -v '/system-' || true; } | xargs -r {{ kubectl }} delete
      args:
        executable: /bin/bash
      changed_when: true

    - name: Retirer le manifeste fourni
      ansible.builtin.file:
        path: "/home/{{ ansible_user | default('ansible') }}/lab/urgent.yaml"
        state: absent
