title: "Lire l'état d'un Pod en erreur"
description: |
  Deux applications refusent de démarrer dans le namespace diagnostic. Dites
  pourquoi, preuves lues dans le cluster, sans rien réparer : la raison pour
  laquelle une image ne se télécharge pas, l'erreur qu'un conteneur a écrite
  avant de s'arrêter, son code de sortie, et le Pod en marche qui consomme le
  plus de mémoire.

criteria:
  - id: la-cause-de-api-est-consignee
    label: "api.txt nomme pourquoi le conteneur de api attend, et l'image fautive"
  - id: l-erreur-de-batch-est-consignee
    label: "batch.txt cite l'erreur écrite par l'exécution précédente de batch"
  - id: le-code-de-sortie-de-batch-est-consigne
    label: "batch.txt donne le code de sortie du dernier conteneur terminé de batch"
  - id: le-pod-le-plus-gourmand-est-consigne
    label: "top.txt nomme le Pod du namespace qui consomme le plus de mémoire"
  - id: rien-n-a-ete-repare
    label: "Rien n'a été réparé : api et batch gardent leur image et leur commande d'origine"
