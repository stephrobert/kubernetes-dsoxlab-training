title: "Lire l'état d'un Pod en erreur"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-get-describe-logs-top/#mettre-en-pratique
description: |
  Deux applications refusent de démarrer dans le namespace incident. Dites
  pourquoi, preuves lues dans le cluster, sans rien réparer : la raison pour
  laquelle une image ne se télécharge pas, l'erreur qu'un conteneur a écrite
  avant de s'arrêter, son code de sortie, et le Pod en marche qui consomme le
  plus de mémoire.

criteria:
  - id: la-cause-de-catalogue-est-consignee
    label: "catalogue.txt nomme pourquoi le conteneur de catalogue attend, et l'image fautive"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-get-describe-logs-top/
  - id: l-erreur-d-export-est-consignee
    label: "export.txt cite l'erreur écrite par l'exécution précédente d'export"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-get-describe-logs-top/
  - id: le-code-de-sortie-d-export-est-consigne
    label: "export.txt donne le code de sortie du dernier conteneur terminé d'export"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-get-describe-logs-top/
  - id: le-pod-le-plus-gourmand-est-consigne
    label: "top.txt nomme le Pod du namespace qui consomme le plus de mémoire"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-get-describe-logs-top/
  - id: rien-n-a-ete-repare
    label: "Rien n'a été réparé : catalogue et export gardent leur image et leur commande d'origine"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-get-describe-logs-top/
