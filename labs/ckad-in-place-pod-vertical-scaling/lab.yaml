id: ckad-in-place-pod-vertical-scaling
title: "Resize a Pod in place, without restarting it"
level: application-environment
description: |
  Raise the CPU and the memory of a running Pod, without recreating it and
  without restarting its container, through the resize subresource. Prove that
  the kernel applies the new limit and that the container stayed the same.
skills:
  - resources
  - in-place-resize
  - vertical-scaling
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/requests-limits/
lab_type: lab
estimated_time: 10m

# Compétence du blueprint CKAD, domaine Application Environment, Configuration
# and Security (25 %) : « Understand requests, limits, quotas ». Le lab hérité
# le rangeait dans services-networking, et son script d'appariement proposait
# la leçon VPA, un faux ami : le sujet est le redimensionnement en place,
# activé par défaut depuis la 1.33.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
