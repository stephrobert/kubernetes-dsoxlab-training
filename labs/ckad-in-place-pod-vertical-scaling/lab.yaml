id: ckad-in-place-pod-vertical-scaling
title: "Resize a Pod in place, without restarting it"
level: application-environment
section: ckad
difficulty: advanced
description: |
  Raise the CPU and the memory of a running Pod, without recreating it and
  without restarting its container, through the resize subresource. Prove that
  the kernel applies the new limit and that the container stayed the same.
skills:
  - resources
  - in-place-resize
  - vertical-scaling
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/requests-limits/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Environment, Configuration
# and Security (25 %) : « Understand requests, limits, quotas ». Le lab hérité
# le rangeait dans services-networking, et son script d'appariement proposait
# la leçon VPA, un faux ami : le sujet est le redimensionnement en place,
# enseigné par la leçon « Requests et Limits » (KUBERN-06-11).
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: nouvelles-ressources-demandees
    label: "scaling-pod requests its new resources"
    tests:
      - test_scaling_pod_demande_ses_nouvelles_ressources
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/requests-limits/
  - id: redimensionne-en-place
    label: "The resize happened in place, without recreating or restarting"
    tests:
      - test_le_redimensionnement_s_est_fait_sans_recreer_ni_redemarrer
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/requests-limits/
  - id: limite-appliquee
    label: "The new limit is applied by the kubelet and the kernel"
    tests:
      - test_la_nouvelle_limite_est_appliquee_par_le_kubelet_et_le_noyau
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/requests-limits/
