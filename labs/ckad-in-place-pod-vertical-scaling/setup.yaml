---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose le Pod avec son
# budget trop juste et sa politique de redimensionnement, et note sa date de
# création dans une annotation, pour prouver ensuite qu'il n'a pas été recréé.
#
# Transposé de K8sExamLab. Confronté à Kubernetes 1.37 le 2026-09-15 : la
# sous-ressource resize est là depuis la 1.33, activée par défaut.
- name: Préparer le lab ckad-in-place-pod-vertical-scaling
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
