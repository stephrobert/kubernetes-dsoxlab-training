---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose le Pod avec son
# budget trop juste et sa politique de redimensionnement, et mémorise son uid
# dans /var/lib/dsoxlab, pour prouver ensuite qu'il n'a pas été recréé.
#
# Transposé de K8sExamLab. Confronté à Kubernetes 1.37 : le Pod se
# redimensionne par la sous-ressource resize.
- name: Préparer le lab ckad-in-place-pod-vertical-scaling
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
