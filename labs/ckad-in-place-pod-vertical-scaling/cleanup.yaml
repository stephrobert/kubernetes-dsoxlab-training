---
# Joué par `dsoxlab clean` : défait ce que le lab a créé. Tout vit dans le
# namespace lab, le supprimer suffit. Le cluster reste.
- name: Nettoyer le lab ckad-in-place-pod-vertical-scaling
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace de travail
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace lab
        --ignore-not-found --wait=false
      changed_when: true
      failed_when: false

    - name: Retirer la mémoire de l'état initial
      ansible.builtin.file:
        path: /var/lib/dsoxlab/in-place-pod-vertical-scaling.json
        state: absent
