id: cka-troubleshoot-node-notready
title: "Bring a NotReady node back into the cluster"
level: troubleshooting
section: cka
difficulty: advanced
description: |
  A worker has gone NotReady, and the application reserved for it is degraded.
  Find out on the node why it no longer talks to the control plane, put its
  agent back in service for good, and prove that the application is back.
skills:
  - troubleshooting
  - node-notready
  - kubelet
  - systemd
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/cluster-troubleshooting/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Troubleshoot
# clusters and nodes ». Un des sujets que kind ne peut pas prouver : le kubelet
# est un service systemd d'une vraie machine, et il faut un second nœud pour
# en casser un sans casser l'API.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
      # Ce lab interroge k8s-w1.lab par l'API du cluster : il lui faut
      # donc ce noeud, et `roles` est le champ que le contrat prevoit pour
      # « les hotes additionnels utilises simultanement ». Sans lui,
      # `dsoxlab start` ne le provisionne pas depuis la 0.8.2, et le lab
      # echoue sur un noeud introuvable.
      roles:
        worker: k8s-w1.lab
    - name: w1
      host: k8s-w1.lab
      # Ce lab interroge k8s-cp.lab par l'API du cluster : il lui faut
      # donc ce noeud, et `roles` est le champ que le contrat prevoit pour
      # « les hotes additionnels utilises simultanement ». Sans lui,
      # `dsoxlab start` ne le provisionne pas depuis la 0.8.2, et le lab
      # echoue sur un noeud introuvable.
      roles:
        control_plane: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
