id: cka-troubleshoot-node-notready
title: "Bring a NotReady node back into the cluster"
level: troubleshooting
section: cka
difficulty: advanced
description: |
  A worker has gone NotReady, and the application reserved for it is degraded.
  Find out on the node why it no longer talks to the control plane, put its
  agent back in service for good, and prove that the application is back.
skills:
  - troubleshooting
  - node-notready
  - kubelet
  - systemd
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/troubleshoot-a-node/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKA, domaine Troubleshooting (30 %) : « Troubleshoot
# clusters and nodes ». Un des sujets que kind ne peut pas prouver : le kubelet
# est un service systemd d'une vraie machine, et il faut un second nœud pour
# en casser un sans casser l'API.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
      # Ce lab interroge k8s-w1.lab par l'API du cluster : il lui faut
      # donc ce noeud, et `roles` est le champ que le contrat prevoit pour
      # « les hotes additionnels utilises simultanement ». Sans lui,
      # `dsoxlab start` ne le provisionne pas depuis la 0.8.2, et le lab
      # echoue sur un noeud introuvable.
      roles:
        worker: k8s-w1.lab
    - name: w1
      host: k8s-w1.lab
      # Ce lab interroge k8s-cp.lab par l'API du cluster : il lui faut
      # donc ce noeud, et `roles` est le champ que le contrat prevoit pour
      # « les hotes additionnels utilises simultanement ». Sans lui,
      # `dsoxlab start` ne le provisionne pas depuis la 0.8.2, et le lab
      # echoue sur un noeud introuvable.
      roles:
        control_plane: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

# Un critère par état demandé, et la leçon où le réviser.
criteria:
  - id: le-noeud-est-ready
    label: "The worker Node is Ready again"
    tests:
      - test_le_noeud_est_ready
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/troubleshoot-a-node/
  - id: le-kubelet-tourne
    label: "The kubelet service runs on the worker"
    tests:
      - test_le_kubelet_tourne
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/troubleshoot-a-node/
  - id: le-kubelet-est-active
    label: "The kubelet is enabled and will survive a reboot"
    tests:
      - test_le_kubelet_est_active_au_demarrage
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/troubleshoot-a-node/
  - id: l-application-est-revenue
    label: "The application is back, three replicas on the worker"
    tests:
      - test_l_application_est_revenue_sur_le_noeud
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/troubleshoot-a-node/
