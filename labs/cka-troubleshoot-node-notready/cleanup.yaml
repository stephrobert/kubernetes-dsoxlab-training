---
# Joué par `dsoxlab clean` : rend le worker au cluster, que l'apprenant l'ait
# réparé ou non, et retire l'application. Le cluster, lui, reste en place, et
# il faut attendre que le nœud soit Ready, sinon le lab suivant partirait
# d'un cluster amputé.
- name: Nettoyer le lab cka-troubleshoot-node-notready
  hosts: lab_target
  become: true
  tasks:
    - name: Remettre le kubelet du worker en service, activé
      ansible.builtin.systemd_service:
        name: kubelet
        state: started
        enabled: true
      delegate_to: k8s-w1.lab

    - name: Supprimer le namespace de l'application
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace production
        --ignore-not-found --wait=false
      changed_when: true
      failed_when: false

    - name: Attendre que le worker soit Ready
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready
        node/k8s-w1.lab --timeout=180s
      changed_when: false
      failed_when: false
