---
# Joué par `dsoxlab clean`.
- name: Nettoyer le lab cka-gateway-api-httproute
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer les namespaces du lab
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace lab boutique
        --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false

    - name: Retirer le contrôleur, les CRD et la politique d'admission
      ansible.builtin.include_tasks: ../../shared/traefik-retirer.yml
