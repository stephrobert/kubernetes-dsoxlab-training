id: cka-gateway-api-httproute
title: "Route with the Gateway API, and repair a route the cluster refuses"
level: services-networking
section: cka
difficulty: advanced
description: |
  Same two applications, same single hostname, and the successor to Ingress.
  Declare a Gateway, attach a route to it, and prove the routing: each path
  answers with its own application's name, an undeclared path answers with
  neither. Then repair a route set up before you, which the cluster refuses
  without saying so anywhere but in its status.
skills:
  - gateway-api
  - httproute
  - services
  - routage
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/gateway-api/
lab_type: lab
estimated_time: 35m

# Compétence du blueprint CKA, domaine Services and Networking (20 %) :
# « Use the Gateway API to manage Ingress traffic », entrée ajoutée au
# curriculum et qui n'était couverte nulle part dans ce catalogue.
#
# Les CRD et la GatewayClass sont posées par le setup. Ce que le lab mesure
# est la Gateway et sa route, pas l'installation d'un contrôleur.
certification_tags:
  - cka

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: gateway-programmee
    label: "A Gateway exists and the cluster declares it Programmed"
    tests:
      - test_la_gateway_est_programmee
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/gateway-api/
  - id: chemin-api
    label: "Path /api reaches svc-api"
    tests:
      - test_le_chemin_api_atteint_svc_api
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/gateway-api/
  - id: chemin-web
    label: "Path /web reaches svc-web"
    tests:
      - test_le_chemin_web_atteint_svc_web
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/gateway-api/
  - id: chemin-non-declare
    label: "An undeclared path reaches neither application"
    tests:
      - test_un_chemin_non_declare_n_atteint_aucune_application
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/gateway-api/
  - id: route-catalogue-resolue
    label: "The route catalogue is Accepted and its references Resolved, up to date with its generation"
    tests:
      - test_la_route_catalogue_est_acceptee_et_resolue
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/gateway-api/
  - id: catalogue-servi
    label: "catalogue.local reaches the catalogue of the boutique namespace"
    tests:
      - test_catalogue_local_atteint_le_catalogue
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/gateway-api/

feedback: full
