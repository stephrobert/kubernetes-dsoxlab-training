id: ckad-blue-green-deployment
title: "Switch traffic from one version to the other: blue-green"
level: application-deployment
description: |
  Run two versions of an application side by side, then switch all the traffic
  from one to the other by changing a Service selector. Prove the switch from
  a client: every request reaches the new version, none the old one.
skills:
  - blue-green
  - deployment-strategy
  - services
  - selectors
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Deployment (20 %) :
# « Understand Deployments and how to perform rolling updates » et « Use
# Kubernetes primitives to implement common deployment strategies (blue/green
# or canary) ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
