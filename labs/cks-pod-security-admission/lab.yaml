id: cks-pod-security-admission
title: "Reject a privileged Pod at admission, with Pod Security Admission"
level: minimize-vulnerabilities
section: cks
difficulty: intermediate
description: |
  A namespace that accepts anything, including a Pod that shares the host's
  PID namespace and runs as root. Turn on the restricted standard so the
  cluster refuses it at admission, and prove the refusal without creating
  anything: a server-side dry run goes through admission and writes nothing.
skills:
  - pod-security-admission
  - pod-security-standards
  - admission-control
  - restricted
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKS, domaine Minimize Microservice Vulnerabilities
# (20 %) : « Use appropriate pod security standards ». C'est le contrôle qui
# remplace PodSecurityPolicy, retiré en 1.25, et il est intégré à l'API server :
# aucun composant à installer, ce qui en fait le premier lab CKS à écrire.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-namespace-declare-le-standard-restricted
    label: "The namespace declares the restricted standard in all three modes"
    tests:
      - test_le_namespace_declare_le_standard_restricted
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
  - id: le-pod-conforme-tourne
    label: "The conforming Pod runs"
    tests:
      - test_le_pod_conforme_tourne
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
  - id: le-pod-conforme-satisfait-les-quatre-exigences
    label: "The conforming Pod meets the four requirements"
    tests:
      - test_le_pod_conforme_satisfait_les_quatre_exigences
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
  - id: l-admission-refuse-l-interdit-et-accepte-le-conforme
    label: "Admission refuses the forbidden Pod and accepts the conforming one"
    tests:
      - test_l_admission_refuse_l_interdit_et_accepte_le_conforme
    lessons:
      - https://www.stephane-robert.info/en/docs/devsecops/runtime/pod-security-standards/
