id: cks-audit-log-policy
title: "Record who reads Secrets, and only the metadata of everything else"
level: monitoring-logging
section: cks
difficulty: advanced
description: |
  The cluster keeps no trace of who reads what. Give the API server an audit
  policy with two levels, full bodies for Secrets and metadata for everything
  else, and prove it works by reading the log the cluster has just written.
skills:
  - audit-policy
  - audit-log
  - kube-apiserver
  - static-pod
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/audit-logs/
lab_type: lab
estimated_time: 25m

# Compétence du blueprint CKS, domaine Monitoring, Logging and Runtime
# Security (20 %) : « Ensure immutability of containers at runtime » et
# l'audit qui va avec. Ce domaine pèse un cinquième de l'épreuve et n'avait
# aucun lab.
#
# Ce lab modifie le manifeste statique de l'API server, ce qu'un cluster en
# conteneur ne permet pas de faire proprement : c'est une des raisons d'être
# des VM de ce catalogue.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: la-politique-enregistre-les-secrets-en-requestresponse
    label: "The audit policy records Secrets at the RequestResponse level"
    tests:
      - test_la_politique_enregistre_les_secrets_en_requestresponse
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/audit-logs/
  - id: la-politique-enregistre-le-reste-en-metadata
    label: "The audit policy records everything else at the Metadata level"
    tests:
      - test_la_politique_enregistre_le_reste_en_metadata
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/audit-logs/
  - id: l-api-server-applique-la-politique
    label: "The API server is started with the audit policy file"
    tests:
      - test_l_api_server_applique_la_politique
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/audit-logs/
  - id: le-journal-est-ecrit-dans-un-fichier-du-noeud
    label: "The audit log is written to a file on the node"
    tests:
      - test_le_journal_est_ecrit_dans_un_fichier_du_noeud
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/audit-logs/
  - id: l-api-server-repond-apres-la-modification
    label: "The API server still answers after the change"
    tests:
      - test_l_api_server_repond_apres_la_modification
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/audit-logs/
  - id: le-journal-enregistre-la-lecture-du-secret-en-requestresponse
    label: "The log holds a Secret read at the RequestResponse level"
    tests:
      - test_le_journal_enregistre_la_lecture_du_secret_en_requestresponse
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/audit-logs/
  - id: le-journal-enregistre-une-lecture-banale-en-metadata-seulement
    label: "The log holds an ordinary read at the Metadata level only"
    tests:
      - test_le_journal_enregistre_une_lecture_banale_en_metadata_seulement
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/securiser/audit-logs/

feedback: full
