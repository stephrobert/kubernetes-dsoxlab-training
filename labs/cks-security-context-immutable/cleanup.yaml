---
# Joué par `dsoxlab clean`.
- name: Nettoyer le lab cks-security-context-immutable
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace du lab
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete namespace catalogue
        --ignore-not-found --wait=true --timeout=180s
      changed_when: true
      failed_when: false
