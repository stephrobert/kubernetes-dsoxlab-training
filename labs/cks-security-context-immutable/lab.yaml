id: cks-security-context-immutable
title: "Make a container immutable without bringing it down"
level: minimize-vulnerabilities
section: cks
difficulty: intermediate
description: |
  A running Deployment can still be written to from the inside. Make its root
  filesystem read-only, drop every capability, forbid escalation, and keep the
  application serving: nginx needs a few writable paths, and finding them is
  the exercise.
skills:
  - securitycontext
  - readonlyrootfilesystem
  - capabilities
  - emptydir
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKS, domaine Minimize Microservice Vulnerabilities
# (20 %) : le conteneur immuable.
#
# Distinct de cks-secure-existing-pod, qui porte sur le privilège, le partage
# de namespaces avec l'hôte et l'identité du processus. Celui-ci porte sur le
# système de fichiers, et sur le coût réel de cette contrainte : une
# application qui écrit pendant son démarrage ne redémarre pas.
certification_tags:
  - cks

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: la-racine-est-declaree-en-lecture-seule
    label: "The containers declare a read-only root filesystem"
    tests:
      - test_la_racine_est_declaree_en_lecture_seule
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: l-escalade-est-interdite
    label: "The containers forbid privilege escalation"
    tests:
      - test_l_escalade_est_interdite
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: toutes-les-capacites-sont-retirees
    label: "The containers drop every capability"
    tests:
      - test_toutes_les_capacites_sont_retirees
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: l-execution-non-root-est-declaree
    label: "Running as non-root is declared"
    tests:
      - test_l_execution_non_root_est_declaree
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
  - id: l-interieur-ne-s-ecrit-plus-et-le-site-sert-toujours
    label: "The inside can no longer be written to, and the site still serves"
    tests:
      - test_l_interieur_ne_s_ecrit_plus_et_le_site_sert_toujours
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/security-context/
