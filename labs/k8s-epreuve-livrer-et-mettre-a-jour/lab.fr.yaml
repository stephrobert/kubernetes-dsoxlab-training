title: "Épreuve du niveau 1 : livrer et mettre à jour une application"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/epreuves/livrer-et-mettre-a-jour/
description: |
  D'après un cahier des charges qui ne nomme aucun objet Kubernetes, livrez la
  vitrine de la boutique dans l'espace propre à son équipe, en trois
  exemplaires joignables à une adresse stable, nourrie d'une configuration et
  d'un mot de passe tenus hors de l'image, passez-la à la version suivante
  sans coupure en gardant un retour, et réparez un composant en panne après
  avoir consigné pourquoi il tombait.

criteria:
  - id: c1-trois-exemplaires-en-version-2
    label: "C1 (critique) : la vitrine tourne en trois exemplaires disponibles, tous en version 2"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: c2-une-adresse-stable
    label: "C2 (critique) : la vitrine répond à une adresse stable dans le cluster, servie par ses trois exemplaires"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: c3-configuration-hors-de-l-image
    label: "C3 (critique) : la configuration et le mot de passe vivent hors de l'image et hors de la description de la vitrine, le mot de passe géré comme une donnée sensible"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/configmaps/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/secrets/
  - id: c4-une-revision-de-retour
    label: "C4 (critique) : une mise à jour garde un retour possible vers la version 1"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/
  - id: c5-aucune-coupure
    label: "C5 : une mise à jour ne prive jamais la vitrine d'un exemplaire disponible"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-rollbacks/
  - id: c6-son-propre-espace
    label: "C6 : l'application vit dans son propre espace, et rien d'elle ne traîne dans l'espace par défaut"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/namespaces/
  - id: c7-stock-repare-cause-consignee
    label: "C7 (critique) : le composant stock tourne de nouveau, et la cause de sa panne a été consignée avant la réparation"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/pods/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/configmaps/
