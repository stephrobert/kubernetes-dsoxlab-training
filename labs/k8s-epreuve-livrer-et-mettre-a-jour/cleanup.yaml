---
# Joué par `dsoxlab clean` : retire le namespace boutique de l'épreuve. Le
# cluster kind reste : il est le socle partagé de la boutique, et les
# namespaces des autres labs n'y sont pas touchés.
- name: Nettoyer l'épreuve k8s-epreuve-livrer-et-mettre-a-jour
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer le namespace de l'épreuve
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kind/boutique.kubeconfig delete namespace
        boutique --ignore-not-found --wait=false
      changed_when: true
      failed_when: false
