# Épreuve de fin du niveau 1 de la formation Kubernetes (fiche KUBERN-EPREUVE-N1),
# réécrite selon D33 et D34 (2026-11-11), grille validée en D35.
#
# D33 : l'épreuve croise TOUT le niveau 1, et non plus le seul challenge du
# module 3 : la livraison d'une application avec sa configuration et son mot
# de passe hors de l'image, une mise à jour sans coupure qui garde un retour, un
# composant en panne à diagnostiquer puis réparer, un espace dédié. L'accès par
# un tunnel, d'abord prévu, a été retiré (D35) : il ne prouvait que la valeur
# lue, et k8s-atteindre-une-application le prouve déjà.
#
# D34 : les critères disent le RÉSULTAT attendu, sans nommer la ressource à
# choisir. Le cahier des charges ne nomme aucun type d'objet : les tests
# retrouvent sur le cluster ce que l'apprenant a choisi.
#
# `lab_type: challenge` comme les épreuves du catalogue containers : capstone
# est réservé aux certifications. Seuil 70 (D06). Cinq critères critiques,
# qu'aucune moyenne ne compense (D35) : C1, C2, C3, C4 et C7. dsoxlab note par
# test, à poids égal : sept critères, environ 14,3 points chacun.
#
# Il tourne sur le cluster kind « boutique », dans deux namespaces : livraison,
# que l'apprenant crée, et entrepot, que le setup pose avec le composant en
# panne.
id: k8s-epreuve-livrer-et-mettre-a-jour
title: "Level 1 test: ship and update an application"
level: application-deployment
section: ckad
difficulty: intermediate
description: |
  From requirements that name no Kubernetes object, ship the shop's storefront
  in its team's own space, with three copies reachable at a stable address,
  fed by a configuration and a password kept outside the image, move it to the
  next version without downtime while keeping a way back, and repair a
  failing component after recording why it failed.
skills:
  - deployment
  - service
  - configmap
  - secret
  - rolling-update
  - namespaces
  - troubleshooting
distros:
  - debian13
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/exam-ship-and-update-an-application/
lab_type: challenge
exam_passing_score: 70
exam_blocking_checks:
  # Les cinq critères critiques de la grille (D35), sans compensation.
  - test_c1_trois_exemplaires_disponibles_en_version_2
  - test_c2_une_adresse_stable_servie_par_les_trois_exemplaires
  - test_c3_configuration_et_mot_de_passe_hors_de_l_image_et_du_manifeste
  - test_c4_une_revision_de_retour_sur_la_version_1
  - test_c7_stock_tourne_et_sa_cause_a_ete_consignee_avant
estimated_time: 60m

certification_tags:
  - ckad
  - kcna

runtime:
  type: vm
  targets:
    - name: kind
      host: k8s-kind.lab
  default: kind

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: c1-trois-exemplaires-en-version-2
    label: "C1 (critical): the storefront runs three available copies, all on version 2"
    tests:
      - test_c1_trois_exemplaires_disponibles_en_version_2
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/deployments/
  - id: c2-une-adresse-stable
    label: "C2 (critical): the storefront answers at a stable address in the cluster, served by its three copies"
    tests:
      - test_c2_une_adresse_stable_servie_par_les_trois_exemplaires
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/services/
  - id: c3-configuration-hors-de-l-image
    label: "C3 (critical): the configuration and the password live outside the image and outside the storefront's description, the password handled as sensitive data"
    tests:
      - test_c3_configuration_et_mot_de_passe_hors_de_l_image_et_du_manifeste
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/configmaps/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/secrets/
  - id: c4-une-revision-de-retour
    label: "C4 (critical): an update keeps a way back to version 1"
    tests:
      - test_c4_une_revision_de_retour_sur_la_version_1
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-and-rollbacks/
  - id: c5-aucune-coupure
    label: "C5: an update never leaves the storefront short of an available copy"
    tests:
      - test_c5_une_mise_a_jour_ne_prive_d_aucun_exemplaire
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/rolling-updates-and-rollbacks/
  - id: c6-son-propre-espace
    label: "C6: the application lives in its own space, and nothing of it is left in the default one"
    tests:
      - test_c6_l_application_vit_dans_son_propre_espace
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/namespaces/
  - id: c7-stock-repare-cause-consignee
    label: "C7 (critical): the stock component runs again, and the cause of its failure was recorded before the repair"
    tests:
      - test_c7_stock_tourne_et_sa_cause_a_ete_consignee_avant
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/pods/
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/configmaps/
