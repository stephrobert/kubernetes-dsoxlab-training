title: "Étiqueter et sélectionner des Pods"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-label-annotate/#mettre-en-pratique
description: |
  Dans le namespace etiquettes, donnez à tous les Pods du Deployment web le
  label env=prod d'une façon qui survit à leur remplacement, décrivez web par
  une annotation, puis consignez un sélecteur à négation qui rend exactement
  les Pods de api.

criteria:
  - id: le-label-est-dans-le-modele
    label: "env=prod est dans le modèle de Pod de web, donc sur tous ses Pods"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-label-annotate/
  - id: l-annotation-decrit-web
    label: "Le Deployment web porte une annotation description"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-label-annotate/
  - id: la-selection-rend-les-pods-de-api
    label: "Le sélecteur consigné, à négation, rend exactement les Pods de api"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/kubectl-label-annotate/
