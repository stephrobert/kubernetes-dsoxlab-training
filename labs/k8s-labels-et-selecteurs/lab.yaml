# Lab guidé de la leçon « kubectl label et annotate » du module « Les
# ressources de base » de la formation. Il reprend les gestes de la
# démonstration : un label durable s'écrit dans le modèle de Pod du Deployment,
# pas sur les Pods, qui sont remplacés ; une annotation décrit, elle ne
# sélectionne pas ; un sélecteur à négation retient aussi les objets qui n'ont
# pas la clé.
#
# Il tourne sur le cluster kind « boutique », partagé avec le module
# Fondamentaux, dans son propre namespace (etiquettes).
id: k8s-labels-et-selecteurs
title: "Label and select Pods"
level: application-design
section: ckad
difficulty: beginner
description: |
  In the etiquettes namespace, give every Pod of the vitrine Deployment the
  label palier=front in a way that survives their replacement, give vitrine a
  contact annotation, then record a selector with a negation that returns
  exactly the Pods of facturation.
skills:
  - kubectl-label
  - kubectl-annotate
  - label-selectors
  - pod-template
distros:
  - debian13
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kubectl-label-and-annotate/
lab_type: lab
estimated_time: 15m

certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: kind
      host: k8s-kind.lab
  default: kind

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: le-label-est-dans-le-modele
    label: "palier=front is in the Pod template of vitrine, so on all its Pods"
    tests:
      - test_palier_front_est_dans_le_modele_de_pod_de_vitrine
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kubectl-label-and-annotate/
  - id: l-annotation-contact-est-posee
    label: "The vitrine Deployment carries a contact annotation"
    tests:
      - test_une_annotation_contact_est_posee_sur_vitrine
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kubectl-label-and-annotate/
  - id: la-selection-rend-les-pods-de-facturation
    label: "The recorded selector, with a negation, returns exactly the Pods of facturation"
    tests:
      - test_le_selecteur_consigne_rend_exactement_les_pods_de_facturation
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/kubernetes/kubectl-label-and-annotate/
