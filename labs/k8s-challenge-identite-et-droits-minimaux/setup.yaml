---
# Joué par `dsoxlab run` : le cluster kubeadm du catalogue, puis la situation du
# challenge (fixtures/prepare.sh), fausse sur les cinq états par construction.
- name: Préparer le challenge k8s-challenge-identite-et-droits-minimaux
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser les deux namespaces, les deux applications et le droit hérité
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
