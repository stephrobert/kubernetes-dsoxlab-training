id: ckad-volumes-partage-entre-conteneurs
title: "Let one container read what another writes, and nothing else"
level: application-design
section: ckad
difficulty: intermediate
description: |
  Two containers in one Pod, one writing and one reading, and nothing shared
  between them. Give them a volume whose lifetime is the Pod's, and prove it
  both ways: what is written inside the volume crosses, what is written beside
  it does not.
skills:
  - volumes
  - emptydir
  - multi-container
  - sidecar
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/volumes-applicatifs/#mettre-en-pratique
lab_type: lab
estimated_time: 20m

# Compétence du blueprint CKAD, domaine Application Design and Build (20 %) :
# « Understand multi-container Pod design patterns » et l'usage des volumes.
#
# Le voisin `ckad-multi-container-sidecar` porte sur le MOTIF, deux conteneurs
# dans un Pod. Celui-ci porte sur ce qui les relie, et sur ce qu'un système de
# fichiers de conteneur ne partage justement pas.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: volume-ephemere-commun
    label: "An ephemeral volume is mounted at the same path in both containers"
    tests:
      - test_un_volume_ephemere_est_monte_dans_les_deux_conteneurs
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/volumes-applicatifs/
  - id: le-lecteur-voit
    label: "The reader sees the producer's file"
    tests:
      - test_le_lecteur_voit_le_fichier_du_producteur
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/volumes-applicatifs/
  - id: le-reste-reste-invisible
    label: "What is written outside the volume stays invisible to the reader"
    tests:
      - test_ce_qui_est_ecrit_hors_du_volume_reste_invisible_au_lecteur
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/volumes-applicatifs/
