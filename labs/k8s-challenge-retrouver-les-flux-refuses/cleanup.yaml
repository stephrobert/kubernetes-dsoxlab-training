---
# Joué par `dsoxlab clean` et `dsoxlab reset`, sur le modèle de
# k8s-auditer-les-flux-avec-hubble. Le cluster Cilium RESTE ; ne partent que
# les objets du lab et ce que sa solution a changé, dans cet ordre :
#
#   1. la configuration de Cilium revient à celle du socle : les métriques par
#      Pod et l'export des flux disparaissent, et les agents redémarrent ;
#   2. les journaux d'export sont retirés des trois nœuds ;
#   3. les namespaces livraison et voisin, et la référence du refus.
- name: Défaire le lab k8s-challenge-retrouver-les-flux-refuses
  hosts: lab_target
  become: true
  vars:
    kubectl: kubectl --kubeconfig /etc/kubernetes/admin.conf
  tasks:
    - name: Ramener Cilium à la configuration du socle
      ansible.builtin.include_tasks: ../../shared/cilium-cluster.yml
      vars:
        cilium_etape: cluster

    - name: Retirer les journaux d'export Hubble des trois nœuds
      ansible.builtin.shell: |
        rm -f /var/run/cilium/hubble/events* /var/run/cilium/hubble/refus*
      args:
        executable: /bin/bash
      changed_when: true
      delegate_to: "{{ noeud }}"
      loop: "{{ cilium_workers + [inventory_hostname] }}"
      loop_control:
        loop_var: noeud

    - name: Supprimer les namespaces du lab
      ansible.builtin.command: >-
        {{ kubectl }} delete namespace {{ item }} --ignore-not-found --wait=true --timeout=180s
      loop:
        - livraison
        - voisin
      changed_when: true

    - name: Retirer la référence du refus
      ansible.builtin.file:
        path: /var/lib/dsoxlab-labs/k8s-challenge-retrouver-les-flux-refuses.json
        state: absent

    - name: Retirer la configuration Helm de l'utilisateur du lab
      ansible.builtin.shell: |
        maison="$(getent passwd '{{ ansible_user | default('ubuntu') }}' | cut -d: -f6)"
        rm -rf "$maison/.config/helm" "$maison/.cache/helm"
      args:
        executable: /bin/bash
      changed_when: true
