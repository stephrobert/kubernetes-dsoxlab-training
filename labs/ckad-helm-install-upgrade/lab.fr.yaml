title: "Installer, mettre à jour et revenir en arrière avec Helm 4"
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/helm/install-releases/
description: |
  Installer le chart de l'équipe en version 0.1.0, mettre la release à jour
  avec le chart en version 0.2.0 et de nouvelles valeurs, puis revenir à la
  première révision. L'historique de la release montre la version du chart
  de chaque révision.
criteria:
  - id: trois-revisions
    label: "L'historique montre web-0.1.0, puis web-0.2.0, puis un rollback déployé vers la révision 1"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/helm/install-releases/
  - id: montee-annulee
    label: "La révision 2 portait 3 réplicas et le label tier=front, les valeurs courantes n'ont ni l'un ni l'autre"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/helm/install-releases/
  - id: application-repond
    label: "L'application tourne avec un replica, l'image du chart, et répond par son Service"
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/helm/install-releases/
