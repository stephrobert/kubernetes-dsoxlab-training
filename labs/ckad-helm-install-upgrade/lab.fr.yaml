title: "Installer, mettre à jour et revenir en arrière avec Helm 4"
description: |
  Déployer un chart avec Helm, le mettre à jour avec de nouvelles valeurs,
  puis revenir à la première révision. Prouver par l'historique de la
  release et par l'état du Deployment que les trois opérations ont eu lieu,
  dans cet ordre.
criteria:
  - id: trois-revisions
    label: "L'historique de la release montre install, upgrade puis un rollback, la dernière révision déployée"
  - id: montee-annulee
    label: "La révision 2 portait deux replicas, les valeurs courantes en ramènent un"
  - id: application-repond
    label: "L'application tourne avec un replica, l'image du chart, et répond par son Service"
