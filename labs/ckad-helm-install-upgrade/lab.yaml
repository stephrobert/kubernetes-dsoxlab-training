id: ckad-helm-install-upgrade
title: "Install, upgrade and roll back with Helm 4"
level: application-deployment
section: ckad
difficulty: intermediate
description: |
  Install the team's chart in version 0.1.0, upgrade the release with the
  chart in version 0.2.0 and new values, then go back to the first revision.
  The release history shows the chart version of each revision.
skills:
  - helm
  - release
  - upgrade
  - rollback
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/tools/helm/helm-install-releases/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Deployment (20 %) :
# « Use the Helm package manager to deploy existing packages ». Helm 4.3.2,
# la version courante : les labs sont à jour, et le blog a une leçon sur la
# migration vers Helm 4. Le lab hérité passait par les charts Bitnami, dont
# les images ne sont plus librement servies : le chart est local.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

# Critères ajoutés le 2026-11-16 pour la couverture stricte de la CKAD.
criteria:
  - id: trois-revisions
    label: "The history shows web-0.1.0, then web-0.2.0, then a deployed rollback to revision 1"
    tests:
      - test_l_historique_montre_les_deux_versions_du_chart_puis_le_retour
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/tools/helm/helm-install-releases/
  - id: montee-annulee
    label: "Revision 2 carried 3 replicas and the tier=front label, the current values carry neither"
    tests:
      - test_la_revision_2_portait_ses_valeurs_et_le_retour_les_retire
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/tools/helm/helm-install-releases/
  - id: application-repond
    label: "The application runs with one replica, the chart's image, and answers through its Service"
    tests:
      - test_l_application_tourne_et_repond
    lessons:
      - https://www.stephane-robert.info/en/docs/conteneurs/orchestrateurs/tools/helm/helm-install-releases/
