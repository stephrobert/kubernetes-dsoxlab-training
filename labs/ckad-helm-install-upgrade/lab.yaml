id: ckad-helm-install-upgrade
title: "Install, upgrade and roll back with Helm 4"
level: application-deployment
section: ckad
difficulty: intermediate
description: |
  Deploy a chart with Helm, upgrade it with new values, then go back to the
  first revision. Prove through the release history and the state of the
  Deployment that the three operations took place, in that order.
skills:
  - helm
  - release
  - upgrade
  - rollback
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/helm/install-releases/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Deployment (20 %) :
# « Use the Helm package manager to deploy existing packages ». Helm 4.3.0,
# la version courante : les labs sont à jour, et le blog a une leçon sur la
# migration vers Helm 4. Le lab hérité passait par les charts Bitnami, dont
# les images ne sont plus librement servies : le chart est local.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

# Critères ajoutés le 2026-11-16 pour la couverture stricte de la CKAD. La
# leçon n'a pas encore de jumelle anglaise (404 relevé ce jour) : les liens
# visent la page française.
criteria:
  - id: trois-revisions
    label: "The release history shows install, upgrade, then a rollback, the last revision deployed"
    tests:
      - test_l_historique_montre_les_trois_revisions
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/helm/install-releases/
  - id: montee-annulee
    label: "Revision 2 carried two replicas, the current values bring back one"
    tests:
      - test_la_montee_en_charge_a_eu_lieu_puis_a_ete_annulee
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/helm/install-releases/
  - id: application-repond
    label: "The application runs with one replica, the chart's image, and answers through its Service"
    tests:
      - test_l_application_tourne_et_repond
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/helm/install-releases/
