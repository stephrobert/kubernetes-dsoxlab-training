id: ckad-helm-install-upgrade
title: "Install, upgrade and roll back with Helm 4"
level: application-deployment
section: ckad
difficulty: intermediate
description: |
  Deploy a chart with Helm, upgrade it with new values, then go back to the
  first revision. Prove through the release history and the state of the
  Deployment that the three operations took place, in that order.
skills:
  - helm
  - release
  - upgrade
  - rollback
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/outils/helm/install-releases/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Deployment (20 %) :
# « Use the Helm package manager to deploy existing packages ». Helm 4.3.0,
# la version courante : les labs sont à jour, et le blog a une leçon sur la
# migration vers Helm 4. Le lab hérité passait par les charts Bitnami, dont
# les images ne sont plus librement servies : le chart est local.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
