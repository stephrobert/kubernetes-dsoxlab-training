---
# Joué par `dsoxlab run` avant d'ouvrir la session : il installe le cluster
# kubeadm du catalogue s'il manque, dépose le générateur du dépôt, puis pose
# le namespace plateforme vide et le dépôt ~/plateforme tiré au sort.
- name: Préparer le lab k8s-challenge-migrer-les-api-retirees
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Créer le répertoire des fichiers du lab sur le nœud
      ansible.builtin.file:
        path: /var/lib/dsoxlab
        state: directory
        mode: "0755"

    - name: Déposer le générateur du dépôt de manifestes
      ansible.builtin.copy:
        src: fixtures/generer.py
        dest: /var/lib/dsoxlab/generer-plateforme.py
        mode: "0600"

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
        LAB_USER: "{{ ansible_user | default('ansible') }}"
        GENERATEUR: /var/lib/dsoxlab/generer-plateforme.py
