---
# Joué par `dsoxlab run` avant d'ouvrir la session : il installe le socle kind
# sur k8s-kind.lab, puis pose la situation du challenge. Le kubeconfig de
# l'apprenant est écrit par fixtures/prepare.sh, pas par le socle : il doit
# démarrer sur un autre contexte que celui de la boutique.
- name: Préparer le challenge k8s-challenge-premier-deploiement
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, un cluster kind
      ansible.builtin.include_tasks: ../../shared/kind-cluster.yml
      vars:
        kind_cluster_name: boutique
        kind_donner_kubeconfig: false

    - name: Poser la situation du challenge
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kind/boutique.kubeconfig
        LAB_USER: "{{ ansible_user | default('ansible') }}"
