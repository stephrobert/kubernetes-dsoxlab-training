id: k8s-rendre-une-application-conforme-12-facteurs
title: "Make an application 12-factor compliant on Kubernetes"
level: application-design
section: ckad
difficulty: intermediate
description: |
  The team delivered podinfo with its configuration hard-coded in its
  arguments, its state written on a volume of the Pod, and no clean shutdown,
  while a Redis runs next to it unused. Generate the configuration with a
  Kustomize configMapGenerator, move the state to Redis, add a preStop hook,
  then seed the cache with an administration Job.
skills:
  - twelve-factor
  - kustomize
  - configmap-generator
  - stateless
  - jobs
distros:
  - ubuntu24
# La leçon n'a pas encore de jumelle anglaise (404 relevé le 2026-11-16) : le
# lab pointe la page française.
doc_url: https://www.stephane-robert.info/docs/conteneurs/cloud-native/application-12-factor-kubernetes/
lab_type: lab
estimated_time: 30m

# Lab guidé de la leçon KUBERN-06-18 « Rendre une application conforme au
# 12-factor sur Kubernetes » (règle 17, décision D110, issue #217). Blueprint
# CKAD, domaine Application Design and Build.
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false

criteria:
  - id: configuration-generee
    label: "The configuration comes from a ConfigMap generated by Kustomize (hash-suffixed name), injected by envFrom"
    tests:
      - test_la_configuration_vient_d_un_configmap_genere
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/cloud-native/application-12-factor-kubernetes/
  - id: etat-dans-redis
    label: "No local state volume, and a value written to the cache survives the deletion of the Pod"
    tests:
      - test_l_etat_survit_a_la_suppression_du_pod
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/cloud-native/application-12-factor-kubernetes/
  - id: arret-propre
    label: "The podinfo container has a preStop hook"
    tests:
      - test_le_conteneur_a_un_prestop
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/cloud-native/application-12-factor-kubernetes/
  - id: job-d-administration
    label: "The Job admin-seed is Complete, runs the application's image, and wrote the seed into Redis"
    tests:
      - test_la_graine_est_posee_par_le_job_admin_seed
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/cloud-native/application-12-factor-kubernetes/

feedback: full
