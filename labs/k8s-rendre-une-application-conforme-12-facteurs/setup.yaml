---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose l'application
# fautive du namespace douze (configuration en dur, état sur le disque du Pod,
# aucun preStop) et le Redis attaché qu'elle n'utilise pas. Les images sont
# épinglées par digest : podinfo 6.17.0 (dernière publiée, mesurée le
# 2026-11-16 ; la leçon la mesurait en 6.15.0) et redis 7.4.11 de la leçon.
- name: Préparer le lab k8s-rendre-une-application-conforme-12-facteurs
  hosts: lab_target
  become: true
  vars:
    session: "{{ ansible_user | default('ansible') }}"
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser l'application fautive
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
        SESSION_UTILISATEUR: "{{ session }}"
