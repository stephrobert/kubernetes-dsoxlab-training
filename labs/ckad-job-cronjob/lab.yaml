id: ckad-job-cronjob
title: "A Job with parallel completions, and a CronJob"
level: application-design
section: ckad
difficulty: beginner
description: |
  Run a workload four times, two at a time, with a Job, and prove that the
  runs really did overlap. Then schedule a cleanup every five minutes with
  a CronJob that keeps a bounded history.
skills:
  - job
  - cronjob
  - batch
  - completions
  - parallelism
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/conteneurs/orchestrateurs/kubernetes/jobs-cronjobs/
lab_type: lab
estimated_time: 15m

# Compétence du blueprint CKAD, domaine Application Design and Build (20 %) :
# « Understand Jobs and CronJobs ».
certification_tags:
  - ckad

runtime:
  type: vm
  targets:
    - name: cp
      host: k8s-cp.lab
  default: cp

validation:
  functional: true
  persistence_after_reboot: false
