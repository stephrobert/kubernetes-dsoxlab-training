title: "Un Job à complétions parallèles et un CronJob"
description: |
  Exécuter un traitement quatre fois, deux à la fois, avec un Job, et
  prouver que les exécutions se sont bien chevauchées. Puis planifier un
  nettoyage toutes les cinq minutes avec un CronJob qui garde un historique
  borné.

criteria:
  - id: quatre-completions-deux-a-la-fois
    label: "batch-job demande quatre complétions, deux à la fois"
  - id: job-termine
    label: "batch-job s'est terminé avec succès"
  - id: parallelisme-observe
    label: "Deux exécutions se sont réellement chevauchées"
  - id: cronjob-planifie
    label: "log-cleanup tourne toutes les cinq minutes, avec un historique borné"
  - id: declenche-a-la-main
    label: "Un Job lancé à la main depuis log-cleanup a réussi"
