---
# Socle commun à tous les labs de ce catalogue : un cluster kubeadm, un control
# plane et les workers que meta.yml déclare, prêt à recevoir des Pods.
#
# POURQUOI CE FICHIER EST INCLUS PAR CHAQUE LAB, ET NON JOUÉ UNE FOIS.
# dsoxlab ne propose aucun point d'accroche à la fin du provisionnement : un
# lab pose son état initial dans son propre `setup.yaml`, et rien d'autre ne
# tourne entre le `terraform apply` et le lab. Le socle vit donc ici, et
# chaque `setup.yaml` l'inclut, dans un play sur `lab_target`, le control
# plane. Les workers sont préparés et joints depuis ce play, par délégation :
# aucun lab n'a à connaître la topologie.
#
# Le coût est supportable parce que ces tâches sont IDEMPOTENTES : la première
# exécution installe le cluster, les suivantes constatent qu'il est là et
# rendent la main en quelques dizaines de secondes. C'est aussi ce qui rend
# `dsoxlab reset` utilisable, alors que le point de reprise est pris AVANT le
# setup.
#
# Version enseignée par la formation : 1.37. Le dépôt pkgs.k8s.io est versionné
# par MINEURE : `v1.37` restera la 1.37 quoi qu'il arrive, mais rien n'y fige le
# PATCH. Une installation faite dans six mois prendra la 1.37.x du jour, pas
# celle sur laquelle les labs ont été validés.
#
# Ce n'est pas un défaut à corriger ici, et surtout pas en figeant un patch pour
# l'éternité : un catalogue qui installerait indéfiniment la 1.37.0 enseignerait
# un Kubernetes que plus personne n'exécute. Le bon dispositif est ailleurs —
# `validation-labs.json` porte la version RÉELLEMENT jouée pour chaque lab, les
# README l'affichent, et un patch qui bouge se traite en rejouant le catalogue.
#
# Mesuré le 2026-09-15 : le dépôt v1.37 ne publie encore que la 1.37.0, ce qui
# bloque d'ailleurs le lab de montée de version (issue #32) faute de cible.

# PIEGE CORRIGE LE 2026-09-14, ET IL MERITE D'ETRE RACONTE.
# La premiere version gardait tout ce fichier derriere un unique
# « le cluster repond-il deja ? ». Le premier passage a echoue APRES
# `kubeadm init` mais AVANT le kubeconfig, le taint et le CNI. Au second
# passage, la garde a vu un cluster qui repond et a tout saute : le noeud est
# reste NotReady pour toujours, faute de CNI.
#
# Une garde grossiere transforme un echec partiel en echec permanent. Chaque
# tache porte donc sa propre idempotence, et un cluster a moitie installe se
# repare tout seul au passage suivant.

# ---------------------------------------------------------------------------
# Le control plane
# ---------------------------------------------------------------------------
- name: Préparer le control plane comme un nœud Kubernetes
  ansible.builtin.include_tasks: noeud-kubernetes.yml

- name: Initialiser le plan de contrôle
  ansible.builtin.command:
    cmd: kubeadm init --pod-network-cidr=10.244.0.0/16
    creates: /etc/kubernetes/admin.conf

# `state: link` ne crée pas le répertoire parent : sans cette tâche, la
# suivante échoue sur « No such file or directory ».
- name: Créer le répertoire kube de root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Poser le kubeconfig pour root
  ansible.builtin.file:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    state: link
    force: true

- name: Créer le répertoire kube de l'utilisateur du lab
  ansible.builtin.file:
    path: "/home/{{ ansible_user | default('ubuntu') }}/.kube"
    state: directory
    owner: "{{ ansible_user | default('ubuntu') }}"
    mode: "0700"

- name: Donner le kubeconfig à l'utilisateur du lab
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user | default('ubuntu') }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user | default('ubuntu') }}"
    mode: "0600"

# Le taint du plan de contrôle est retiré, même avec un worker : un lab qui
# n'a besoin que d'un nœud doit continuer à tourner si le worker manque, et
# les labs qui enseignent les taints posent les leurs. Décision de l'issue #2.
- name: Retirer le taint du plan de contrôle
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf taint nodes --all
    node-role.kubernetes.io/control-plane- --overwrite
  changed_when: true
  failed_when: false

# Le CNI est Calico, et non Flannel : Flannel n'applique pas les NetworkPolicy.
# Mesuré sur le socle Flannel le 2026-09-14 : une politique deny-all était
# acceptée par l'API et sans aucun effet sur le trafic. Quatre labs hérités
# éprouvent des NetworkPolicy, et la doctrine du dépôt exige un dernier test
# qui exerce les deux côtés, ce qui suppose un CNI qui applique les règles.
# Issue #3.
#
# get_url ne télécharge qu'en l'absence du fichier : le manifeste est figé
# sur une version, et une exécution suivante ne le retire pas.
- name: Récupérer le manifeste Calico
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/calico.yaml
    dest: /root/calico.yaml
    mode: "0644"

# Sans cela, Calico créerait son pool sur 192.168.0.0/16 alors que kubeadm a
# réservé 10.244.0.0/16 aux Pods.
- name: Aligner le pool d'adresses Calico sur le CIDR des Pods, le nom
  ansible.builtin.replace:
    path: /root/calico.yaml
    regexp: '# - name: CALICO_IPV4POOL_CIDR'
    replace: '- name: CALICO_IPV4POOL_CIDR'

- name: Aligner le pool d'adresses Calico sur le CIDR des Pods, la valeur
  ansible.builtin.replace:
    path: /root/calico.yaml
    regexp: '#   value: "192.168.0.0/16"'
    replace: '  value: "10.244.0.0/16"'

- name: Installer le CNI, Calico
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /root/calico.yaml
  changed_when: true

- name: Attendre que le control plane soit Ready
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready
    node/{{ inventory_hostname }} --timeout=300s
  changed_when: false

# ---------------------------------------------------------------------------
# Les workers : ceux que meta.yml déclare avec `role: worker`. dsoxlab les met
# dans le groupe `labenv` avec leur rôle en host_var ; on les prépare et on
# les joint depuis ici, par délégation, sans que les labs aient à le savoir.
# ---------------------------------------------------------------------------
- name: Recenser les workers déclarés par meta.yml
  ansible.builtin.set_fact:
    workers: >-
      {{ groups['labenv'] | default([])
         | reject('equalto', inventory_hostname)
         | select('in', hostvars | dict2items | selectattr('value.role', 'defined')
                                  | selectattr('value.role', 'equalto', 'worker')
                                  | map(attribute='key') | list)
         | list }}

- name: Préparer chaque worker comme un nœud Kubernetes
  ansible.builtin.include_tasks:
    file: noeud-kubernetes.yml
    apply:
      delegate_to: "{{ noeud }}"
  loop: "{{ workers }}"
  loop_control:
    loop_var: noeud

- name: Lister les nœuds déjà joints
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes
    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
  register: noeuds_joints
  changed_when: false

- name: Retenir les workers qui manquent encore au cluster
  ansible.builtin.set_fact:
    workers_manquants: "{{ workers | reject('in', noeuds_joints.stdout_lines) | list }}"

# Un token de jointure n'est fabriqué que s'il sert : il expire de lui-même.
- name: Fabriquer une commande de jointure
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 30m
  register: jointure
  changed_when: true
  when: workers_manquants | length > 0

- name: Joindre chaque worker manquant au cluster
  ansible.builtin.command:
    cmd: "{{ jointure.stdout }}"
    creates: /etc/kubernetes/kubelet.conf
  delegate_to: "{{ noeud }}"
  loop: "{{ workers_manquants }}"
  loop_control:
    loop_var: noeud

- name: Attendre que tous les nœuds soient Ready
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready
    nodes --all --timeout=300s
  changed_when: false

# ---------------------------------------------------------------------------
# Comme à l'examen : depuis le control plane, `ssh <nœud>` ouvre une session
# sur chaque worker, sans mot de passe. Les labs de diagnostic de nœud en
# dépendent, et l'apprenant n'a pas à connaître la clé de dsoxlab. Mesuré le
# 2026-09-14 : le nom k8s-w1.lab se résout depuis le control plane, mais
# l'utilisateur du lab n'y avait aucune clé.
# ---------------------------------------------------------------------------
- name: Donner une clé SSH à l'utilisateur du lab sur le control plane
  ansible.builtin.command:
    cmd: ssh-keygen -q -t ed25519 -N "" -f /home/{{ ansible_user | default('ubuntu') }}/.ssh/id_ed25519
    creates: /home/{{ ansible_user | default('ubuntu') }}/.ssh/id_ed25519
  become: true
  become_user: "{{ ansible_user | default('ubuntu') }}"

- name: Lire cette clé publique
  ansible.builtin.slurp:
    src: /home/{{ ansible_user | default('ubuntu') }}/.ssh/id_ed25519.pub
  register: cle_lab

- name: Autoriser cette clé sur chaque worker
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user | default('ubuntu') }}/.ssh/authorized_keys
    line: "{{ cle_lab.content | b64decode | trim }}"
    create: true
    owner: "{{ ansible_user | default('ubuntu') }}"
    mode: "0600"
  delegate_to: "{{ noeud }}"
  loop: "{{ workers }}"
  loop_control:
    loop_var: noeud

- name: Accepter la clé d'hôte des nœuds du lab au premier ssh
  ansible.builtin.copy:
    dest: /home/{{ ansible_user | default('ubuntu') }}/.ssh/config
    owner: "{{ ansible_user | default('ubuntu') }}"
    mode: "0600"
    content: |
      Host k8s-*
        StrictHostKeyChecking accept-new
