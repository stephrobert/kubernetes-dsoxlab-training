---
# Pose un contrôleur Ingress sur le cluster, pour les labs qui éprouvent
# l'Ingress, le TLS ou la Gateway API.
#
# À inclure depuis le `setup.yaml` d'un lab, après le socle kubeadm :
#
#     - name: Installer le contrôleur Ingress
#       ansible.builtin.include_tasks: ../../shared/traefik.yml
#
# POURQUOI TRAEFIK, et pas ingress-nginx.
#
# ingress-nginx est ARCHIVÉ depuis le 24 mars 2026 : son dépôt GitHub porte
# `archived: true`. La leçon `ingress.mdx` du blog a basculé sur Traefik par
# Helm, et un lab doit éprouver ce que la formation enseigne.
#
# POURQUOI DES NODEPORT FIXES.
#
# Le Service du chart est un LoadBalancer par défaut. Sur un cluster kubeadm
# sans fournisseur de cloud, il reste `Pending` indéfiniment et rien ne
# répond, sans message qui le dise. Les NodePort 30080 et 30443 sont donc
# imposés, et c'est par eux que les tests interrogent le contrôleur depuis le
# nœud.
#
# POURQUOI L'ENTRYPOINT WEB ÉCOUTE SUR 80.
#
# Le chart le met sur 8000 par défaut, le conteneur ne tournant pas en root.
# Cela suffirait aux labs Ingress, qui passent par le NodePort. Mais le
# listener d'une Gateway déclare un port qui doit correspondre à celui d'un
# entrypoint Traefik : un candidat qui écrit `port: 80`, ce que toute
# documentation de la Gateway API lui montre, verrait sa Gateway rester non
# programmée sans message utile. Plutôt que de lui faire écrire `port: 8000`,
# on aligne l'entrypoint, avec le sysctl sûr
# `net.ipv4.ip_unprivileged_port_start=0`.
#
# GATEWAY API.
#
# Passer `traefik_gateway_api: true` installe les CRD de la Gateway API et
# active le provider correspondant, ce qui crée la GatewayClass `traefik`. La
# Gateway elle-même reste à la charge du candidat : `gateway.enabled=false`.
#
# Les CRD sont posées par NOUS, et non par le chart, qui prévient d'ailleurs
# qu'il cessera de les livrer : « Gateway API CRDs will no longer be shipped
# with this chart in a future major version ».
#
# Le lab qui inclut ce fichier appelle `shared/traefik-retirer.yml` dans son
# `cleanup.yaml` : le chart pose une IngressClass et des CRD, qui sont des
# objets de CLUSTER et que la photographie du validateur compterait comme une
# trace laissée au lab suivant.

- name: Installer helm avec mise
  ansible.builtin.include_tasks: outil-par-mise.yml
  vars:
    outil_nom: helm
    outil_version: "4.3.0"
    # `helm --version` n'existe pas : helm attend la sous-commande `version`.
    outil_verification: version --short

- name: Installer les CRD de la Gateway API
  # v1.6.2, canal `standard`, mesuré disponible le 2026-09-16. Le fichier pose
  # dix CRD ET une ValidatingAdmissionPolicy nommée
  # `safe-upgrades.gateway.networking.k8s.io`, que le retrait doit reprendre :
  # ce sont toutes des objets de CLUSTER.
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f
      https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.2/standard-install.yaml
  changed_when: true
  when: traefik_gateway_api | default(false) | bool

- name: Déclarer le dépôt de charts de Traefik
  ansible.builtin.command:
    cmd: /usr/local/bin/helm repo add traefik https://traefik.github.io/charts
  register: _depot_traefik
  changed_when: "'has been added' in _depot_traefik.stdout"
  failed_when: _depot_traefik.rc != 0 and 'already exists' not in _depot_traefik.stderr

- name: Rafraîchir l'index des charts
  ansible.builtin.command:
    cmd: /usr/local/bin/helm repo update traefik
  changed_when: false

- name: Installer Traefik, exposé en NodePort
  # Chart 41.6.0, mesuré disponible le 2026-09-16. Son appVersion est v3.7.13 ;
  # l'image est montée à v3.7.18, dernier correctif de la branche 3.7 publié le
  # 2026-11-10, et ÉPINGLÉE par digest. Le chart demande versionOverride quand
  # l'image est désignée par digest : il ne peut pas en déduire la version.
  # Tout est épinglé : un chart ou une image qui bouge sous le lab en change le
  # comportement sans que rien ne le signale.
  #
  # L'ADRESSE DES INGRESS. Par défaut, Traefik recopie sur chaque Ingress
  # l'adresse de son propre Service. En NodePort, ce Service n'en a aucune, et
  # un Ingress pris en charge resterait sans adresse, ce qui ressemble à un
  # Ingress ignoré (mesuré le 2026-11-12). On publie donc l'adresse du nœud, où
  # le NodePort répond.
  #
  # LE TYPE DU SERVICE se règle par service.spec.type : le chart 41.6.0 ignore
  # service.type, et laissait le Service en LoadBalancer jamais servi (mesuré
  # le 2026-11-12). Les NodePort existaient quand même, d'où l'erreur restée
  # invisible.
  #
  # PAS DE CLASSE PAR DÉFAUT. Le chart marque son IngressClass par défaut, et
  # Kubernetes remplit alors lui-même ingressClassName sur tout Ingress qui
  # n'en nomme aucune : le contrôle des labs ne verrait plus si l'apprenant
  # l'a écrite. Ce réglage ne change PAS ce que Traefik sert : avec
  # providers.kubernetesIngress.ingressClass laissé vide, Traefik traite aussi
  # les Ingress sans classe (mesuré le 2026-11-12, classe par défaut ôtée).
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/helm upgrade --install traefik traefik/traefik
      --namespace traefik --create-namespace --version 41.6.0
      --set service.spec.type=NodePort
      --set ingressClass.isDefaultClass=false
      --set ports.web.nodePort=30080
      --set ports.web.port=80
      --set ports.websecure.nodePort=30443
      --set providers.kubernetesIngress.publishedService.enabled=false
      --set providers.kubernetesIngress.ingressEndpoint.ip={{ ansible_default_ipv4.address }}
      --set deployment.replicas=1
      --set image.digest=sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
      --set versionOverride=v3.7.18
      --set-string podSecurityContext.sysctls[0].name=net.ipv4.ip_unprivileged_port_start
      --set-string podSecurityContext.sysctls[0].value=0
      --set providers.kubernetesGateway.enabled={{ traefik_gateway_api | default(false) | bool | lower }}
      --set gateway.enabled=false
      --wait --timeout 6m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true

- name: Attendre que le contrôleur soit prêt
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf -n traefik
      rollout status deployment/traefik --timeout=300s
  changed_when: false
