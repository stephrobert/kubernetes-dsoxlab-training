---
# La mécanique de l'examen réel, pour les deux examens blancs (décision D63) :
# chaque tâche désigne un hôte, l'apprenant s'y connecte par ssh depuis la base
# (k8s-cp.lab, la session de `dsoxlab run`), travaille, puis revient par exit.
# Aucun contexte : chaque tâche écrit son namespace.
#
# Ce fichier pose ce qu'il faut sur les deux hôtes de tâche, et rien qu'il ne
# puisse défaire sans toucher à ce qui existait avant lui (audit du 2026-11-13) :
#   - sur k8s-w1.lab, un kubeconfig DÉDIÉ, ~/.kube/dsoxlab-examen.conf, que le
#     bloc du .bashrc désigne par KUBECONFIG. Un ~/.kube/config ou tout autre
#     fichier de l'apprenant reste intact. Si ~/.kube n'existait pas, un marqueur
#     le note, pour que le nettoyage ne retire que ce qu'il a créé ;
#   - l'autorisation de `ssh k8s-cp.lab` depuis la base. Un marqueur note que le
#     setup l'a AJOUTÉE : une clé déjà autorisée n'est jamais retirée ;
#   - l'alias `k` et la complétion de kubectl, comme à l'examen.
#
# Inclus par labs/cka-examen-blanc et labs/ckad-examen-blanc, défait par
# shared/examen-ssh-nettoyage.yml. Joué en root sur le control plane.

- name: Lire le kubeconfig d'administration du cluster
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: examen_admin_conf

- name: Savoir si le répertoire kubeconfig existe déjà sur le worker
  ansible.builtin.stat:
    path: "/home/{{ ansible_user | default('ansible') }}/.kube"
  register: examen_kube_avant
  delegate_to: k8s-w1.lab

- name: Créer le répertoire des marqueurs de l'examen sur les deux hôtes
  ansible.builtin.file:
    path: /var/lib/dsoxlab
    state: directory
    mode: "0755"
  delegate_to: "{{ hote_examen }}"
  loop:
    - "{{ inventory_hostname }}"
    - k8s-w1.lab
  loop_control:
    loop_var: hote_examen

- name: Noter que le répertoire kubeconfig du worker est créé par l'examen
  ansible.builtin.copy:
    dest: /var/lib/dsoxlab/examen-kube-cree
    content: "{{ ansible_user | default('ansible') }}\n"
    mode: "0644"
  delegate_to: k8s-w1.lab
  when: not examen_kube_avant.stat.exists

- name: Créer le répertoire kubeconfig de l'utilisateur du lab sur le worker
  ansible.builtin.file:
    path: "/home/{{ ansible_user | default('ansible') }}/.kube"
    state: directory
    owner: "{{ ansible_user | default('ansible') }}"
    mode: "0700"
  delegate_to: k8s-w1.lab

- name: Poser le kubeconfig dédié de l'examen sur le worker
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user | default('ansible') }}/.kube/dsoxlab-examen.conf"
    content: "{{ examen_admin_conf.content | b64decode }}"
    owner: "{{ ansible_user | default('ansible') }}"
    mode: "0600"
  delegate_to: k8s-w1.lab

- name: Lire la clé publique de l'utilisateur du lab sur le control plane
  ansible.builtin.slurp:
    src: "/home/{{ ansible_user | default('ansible') }}/.ssh/id_ed25519.pub"
  register: examen_cle_cp

- name: Autoriser ssh k8s-cp.lab depuis la base
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user | default('ansible') }}/.ssh/authorized_keys"
    line: "{{ examen_cle_cp.content | b64decode | trim }}"
    create: true
    owner: "{{ ansible_user | default('ansible') }}"
    mode: "0600"
  register: examen_cle_ajoutee

- name: Noter que l'autorisation a été ajoutée par l'examen
  ansible.builtin.copy:
    dest: /var/lib/dsoxlab/examen-cle-ajoutee
    content: "{{ examen_cle_cp.content | b64decode | trim }}\n"
    mode: "0644"
  when: examen_cle_ajoutee is changed

- name: Poser l'alias k et la complétion de kubectl sur la base
  ansible.builtin.blockinfile:
    path: "/home/{{ ansible_user | default('ansible') }}/.bashrc"
    marker: "# {mark} DSOXLAB EXAMEN BLANC"
    create: true
    owner: "{{ ansible_user | default('ansible') }}"
    mode: "0644"
    block: |
      alias k=kubectl
      source <(kubectl completion bash)
      complete -o default -F __start_kubectl k

- name: Poser le kubeconfig dédié, l'alias k et la complétion sur le worker
  ansible.builtin.blockinfile:
    path: "/home/{{ ansible_user | default('ansible') }}/.bashrc"
    marker: "# {mark} DSOXLAB EXAMEN BLANC"
    create: true
    owner: "{{ ansible_user | default('ansible') }}"
    mode: "0644"
    block: |
      export KUBECONFIG="$HOME/.kube/dsoxlab-examen.conf"
      alias k=kubectl
      source <(kubectl completion bash)
      complete -o default -F __start_kubectl k
  delegate_to: k8s-w1.lab
