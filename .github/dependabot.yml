version: 2
updates:
  # Garde les actions GitHub (épinglées par SHA) à jour, l'écosystème pertinent
  # pour ce dépôt de contenu.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    # Laisser décanter une nouvelle release : un paquet compromis est
    # généralement retiré en quelques jours, un cooldown réduit la fenêtre.
    #
    # `default-days` seul : les paliers semver-{major,minor,patch}-days ne sont
    # PAS supportés pour l'écosystème github-actions (ils valent pour les
    # écosystèmes de paquets type pip/npm). Les déclarer ici fait échouer la
    # validation du fichier côté GitHub, qui cesse alors d'ouvrir des PR, et
    # cela ressemble exactement à « aucune mise à jour disponible ».
    cooldown:
      default-days: 7
    # Un lot par semaine plutôt qu'une branche par action. Le dépôt Linux jumeau
    # avait cinq PR ouvertes en même temps, dont trois pour les trois actions
    # github/codeql-action/*, qui sortent toujours la même version le même jour
    # et ne se fusionnent jamais séparément. Chacune ouvrait une branche et
    # déclenchait une CI complète.
    #
    # Les majeures restent seules : ce sont elles qui cassent, elles méritent
    # d'être lues, et les grouper ferait qu'une action incompatible bloquerait
    # toutes les autres du même lot.
    #
    # Les alertes de sécurité restent hors groupe, ce qui est le défaut
    # (`applies-to: version-updates`) : elles sont urgentes et méritent une PR
    # ciblée plutôt que d'attendre le lot hebdomadaire.
    groups:
      actions-mineures-et-correctives:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Pas d'écosystème Python ici : ce dépôt de contenu n'a aucune dépendance à
  # builder (pyproject.toml : package = false, dependencies = []). Ses seules
  # dev-deps sont pyyaml et pytest, tirées à la demande dans des environnements
  # éphémères (`uv run --no-project --with …`) par les hooks et la CI, jamais
  # résolues depuis un lockfile.
  #
  # La CLI dsoxlab n'est pas une dépendance de ce dépôt : c'est un OUTIL,
  # installé à part (`uv tool install dsoxlab`), suivi et publié dans son propre
  # dépôt. Ici on ne surveille que les actions GitHub.
